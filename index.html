<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IIQE 试卷一：保险原理及实务刷题与知识图谱</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #64717f;
      --line: #d8e0e8;
      --paper: #f7f8fa;
      --panel: #ffffff;
      --teal: #0f7b7b;
      --blue: #2f68b7;
      --gold: #b27a13;
      --red: #b84a4a;
      --green: #4a8b45;
      --violet: #7255a3;
      --cyan: #277c9e;
      --shadow: 0 18px 48px rgba(17, 31, 45, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(247,248,250,.96)),
        radial-gradient(circle at 9% 0%, rgba(47, 104, 183, .11), transparent 28%),
        radial-gradient(circle at 94% 6%, rgba(15, 123, 123, .12), transparent 30%),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(420px, 1fr) 390px;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title h1 {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.22;
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tab-button {
      min-height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 0 13px;
      color: var(--ink);
      font-weight: 720;
      cursor: pointer;
    }

    .tab-button:hover,
    .tab-button.active {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(15, 123, 123, .08);
    }

    .exam-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(84px, auto));
      gap: 10px;
    }

    .stat {
      min-width: 88px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    aside,
    main,
    .detail {
      min-height: 0;
    }

    aside {
      border-right: 1px solid var(--line);
      padding: 18px;
      overflow: auto;
      background: rgba(255, 255, 255, .58);
    }

    main {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(18, 35, 51, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 35, 51, .04) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .detail {
      border-left: 1px solid var(--line);
      padding: 18px;
      overflow: auto;
      background: rgba(255, 255, 255, .72);
    }

    .app.solo-view {
      grid-template-columns: 1fr;
    }

    .app.solo-view aside,
    .app.solo-view main {
      display: none;
    }

    .app.solo-view .detail {
      grid-column: 1 / -1;
      border-left: 0;
      width: min(1120px, 100%);
      justify-self: center;
      background: rgba(255, 255, 255, .82);
    }

    .app.practice-view .detail,
    .app.quiz-view .detail {
      width: min(880px, 100%);
    }

    .section-label {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
    }

    .section-label:first-child {
      margin-top: 0;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    .search input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 123, 123, .14);
    }

    .chapter-list {
      display: grid;
      gap: 8px;
    }

    .chapter-button {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .chapter-button:hover,
    .chapter-button.active {
      transform: translateY(-1px);
      border-color: var(--chapter-color, var(--teal));
      box-shadow: 0 8px 20px rgba(17, 31, 45, .08);
    }

    .chapter-button .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chapter-button strong {
      font-size: 14px;
    }

    .chapter-button small {
      color: var(--muted);
      line-height: 1.45;
    }

    .weight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 24px;
      color: #fff;
      background: var(--chapter-color, var(--teal));
      border-radius: 999px;
      font-size: 12px;
      font-weight: 760;
    }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .rank-table th,
    .rank-table td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .rank-table th {
      color: var(--muted);
      font-size: 12px;
      background: #f1f4f6;
    }

    .rank-table tr:last-child td {
      border-bottom: 0;
    }

    .graph-toolbar {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 2;
      pointer-events: none;
    }

    .toolbar-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-button,
    .mode-button {
      height: 36px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      border-radius: 8px;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(17, 31, 45, .08);
    }

    .icon-button {
      width: 38px;
      font-weight: 760;
    }

    .mode-button {
      padding: 0 12px;
    }

    .mode-button.active,
    .icon-button:hover,
    .mode-button:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 83px);
    }

    .link {
      stroke: rgba(96, 112, 128, .34);
      stroke-width: 1.4;
      transition: stroke .16s ease, stroke-width .16s ease, opacity .16s ease;
    }

    .link.focused {
      stroke: var(--teal);
      stroke-width: 3;
      opacity: .92;
    }

    .node {
      cursor: pointer;
    }

    .node circle {
      fill: #fff;
      stroke: var(--node-color, var(--teal));
      stroke-width: 2.4;
      filter: drop-shadow(0 6px 14px rgba(16, 32, 44, .15));
      transition: r .18s ease, fill .18s ease, stroke-width .18s ease, opacity .18s ease;
    }

    .node text {
      fill: var(--ink);
      font-size: 12px;
      font-weight: 680;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .node .subtext {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 620;
    }

    .node.dim circle,
    .node.dim text {
      opacity: .22;
    }

    .node.focused circle {
      r: 24;
      fill: color-mix(in srgb, var(--node-color, var(--teal)) 14%, #fff);
      stroke-width: 3.4;
    }

    .node.selected circle {
      r: 28;
      fill: color-mix(in srgb, var(--node-color, var(--teal)) 22%, #fff);
      stroke-width: 4;
    }

    .tooltip {
      position: absolute;
      max-width: 310px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      border-radius: 8px;
      box-shadow: var(--shadow);
      pointer-events: none;
      transform: translate(14px, 14px);
      opacity: 0;
      transition: opacity .12s ease;
      z-index: 5;
    }

    .tooltip.visible {
      opacity: 1;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 5px;
    }

    .tooltip p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .detail h2 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
    }

    .detail .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
    }

    .detail-block {
      margin: 14px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow-x: auto;
    }

    .detail-block h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .detail-block p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.68;
    }

    .detail-block ul,
    .detail-block ol {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.68;
    }

    .detail-block li + li {
      margin-top: 5px;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .mini-table th,
    .mini-table td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .mini-table th {
      color: var(--muted);
      background: #f1f4f6;
    }

    .mini-table tr:last-child td {
      border-bottom: 0;
    }

    .flashcard {
      display: grid;
      gap: 10px;
    }

    .flashcard .question {
      font-size: 16px;
      font-weight: 760;
      line-height: 1.48;
    }

    .flashcard .answer {
      color: var(--muted);
      line-height: 1.68;
    }

    .practice-controls {
      display: grid;
      gap: 10px;
    }

    .practice-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .practice-chip {
      min-height: 30px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 720;
      cursor: pointer;
    }

    .practice-chip.active,
    .practice-chip:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(15, 123, 123, .08);
    }

    .practice-search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      outline: none;
    }

    .practice-search:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 123, 123, .14);
    }

    .question-card {
      display: grid;
      gap: 12px;
    }

    .question-title {
      font-size: 16px;
      line-height: 1.7;
      font-weight: 760;
    }

    .option-list {
      display: grid;
      gap: 8px;
    }

    .option-button {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px 11px;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.58;
      transition: border-color .14s ease, background .14s ease, transform .14s ease;
    }

    .option-button:hover {
      transform: translateY(-1px);
      border-color: var(--teal);
    }

    .option-button.correct {
      border-color: var(--green);
      background: rgba(74, 139, 69, .1);
    }

    .option-button.wrong {
      border-color: var(--red);
      background: rgba(184, 74, 74, .1);
    }

    .option-button .letter {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      height: 24px;
      margin-right: 8px;
      border-radius: 999px;
      background: #eef2f5;
      font-weight: 760;
      color: var(--muted);
    }

    .practice-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .practice-storage-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .practice-storage-row .mode-button {
      box-shadow: none;
    }

    .practice-view .detail h2 {
      font-size: 28px;
    }

    .practice-view .question-card {
      padding: 18px;
    }

    .practice-view .question-title {
      font-size: 18px;
    }

    .practice-view .option-button {
      min-height: 52px;
    }

    .answer-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.68;
      padding: 10px 12px;
      border-left: 3px solid var(--teal);
      background: rgba(15, 123, 123, .07);
      border-radius: 0 8px 8px 0;
    }

    .outline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .outline-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
    }

    .outline-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .outline-card p {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.62;
      font-size: 14px;
    }

    .progress-list {
      display: grid;
      gap: 8px;
    }

    .check-item {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: start;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .check-item input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--teal);
    }

    .check-item span.done {
      color: #93a0aa;
      text-decoration: line-through;
    }

    .source-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 250px 1fr;
      }

      .detail {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: none;
      }
    }

    @media (max-width: 820px) {
      .app {
        display: flex;
        flex-direction: column;
      }

      header {
        order: 0;
        position: static;
        grid-template-columns: 1fr;
        padding: 14px;
        gap: 12px;
      }

      .title h1 {
        font-size: 19px;
      }

      .title p {
        font-size: 12px;
      }

      .app.practice-view .title p {
        display: none;
      }

      .app.practice-view .exam-stats {
        display: none;
      }

      .top-nav {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .tab-button {
        flex: 0 0 auto;
      }

      .exam-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      aside,
      .detail {
        border: 0;
      }

      aside {
        order: 1;
        max-height: 300px;
        overflow: auto;
      }

      main {
        order: 2;
        height: 68vh;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .detail {
        order: 3;
        padding: 14px;
      }

      svg {
        min-height: 68vh;
      }

      .graph-toolbar {
        flex-wrap: wrap;
      }

      .app.solo-view aside,
      .app.solo-view main {
        display: none;
      }

      .app.solo-view .detail {
        width: 100%;
        order: 1;
      }

      .practice-view .detail h2 {
        font-size: 23px;
      }

      .practice-view .question-title {
        font-size: 17px;
      }

      .practice-filter-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .practice-chip {
        flex: 0 0 auto;
      }

      .practice-actions .mode-button {
        flex: 1 1 calc(50% - 8px);
      }

      .outline-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>IIQE 试卷一：保险原理及实务</h1>
        <p>面向香港保险中介人资格考试（IIQE）Paper 1 的学习工具，覆盖风险、法律原则、保险原则、香港保险业结构、规管架构与职业道德。</p>
        <nav class="top-nav" aria-label="主功能">
          <button class="tab-button active" data-mode="map">知识图谱</button>
          <button class="tab-button" data-mode="outline">大纲</button>
          <button class="tab-button" data-mode="practice">刷题</button>
          <button class="tab-button" data-mode="quiz">卡片</button>
        </nav>
      </div>
      <div class="exam-stats" aria-label="考试结构">
        <div class="stat"><strong>75</strong><span>选择题</span></div>
        <div class="stat"><strong>2h</strong><span>考试时间</span></div>
        <div class="stat"><strong>53</strong><span>合格题数</span></div>
        <div class="stat"><strong>913</strong><span>题库题目</span></div>
      </div>
    </header>

    <aside>
      <div class="section-label">搜索</div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜索：近因、代位、保险经纪..." autocomplete="off">
      </div>

      <div class="section-label">章节权重</div>
      <div id="chapterList" class="chapter-list"></div>

      <div class="section-label">复习优先级</div>
      <table class="rank-table">
        <thead>
          <tr><th>优先</th><th>章节</th><th>题量</th></tr>
        </thead>
        <tbody id="rankRows"></tbody>
      </table>
    </aside>

    <main id="graphStage">
      <div class="graph-toolbar">
        <div class="toolbar-group" role="group" aria-label="图谱控制">
          <button class="icon-button" id="zoomOut" title="缩小">-</button>
          <button class="icon-button" id="zoomIn" title="放大">+</button>
          <button class="icon-button" id="resetView" title="重置">↺</button>
        </div>
      </div>
      <svg id="graph" role="img" aria-label="保险原理及实务交互知识图谱"></svg>
      <div id="tooltip" class="tooltip"></div>
    </main>

    <section class="detail" id="detailPanel" aria-live="polite"></section>
  </div>

  <script>
    const colors = {
      root: "#17212b",
      c1: "#0f7b7b",
      c2: "#2f68b7",
      c3: "#b27a13",
      c4: "#4a8b45",
      c5: "#277c9e",
      c6: "#b84a4a",
      c7: "#7255a3",
      strategy: "#6b7280"
    };

    const chapters = [
      { id: "c3", title: "第 3 章：保险原则", short: "保险原则", weight: "30%", questions: "22-23", priority: 1, color: colors.c3, summary: "全卷最重要章节，覆盖可保权益、最高诚信、近因、彌偿、分担、代位。" },
      { id: "c6", title: "第 6 章：保险业规管架构", short: "规管架构", weight: "21%", questions: "16", priority: 2, color: colors.c6, summary: "记清保险业条例、守则、投诉局、中介人定义及经纪规管。" },

1.1 註","question":"當保險單提供「全險」的保險保障時，所提及的風險是指：","options":[{"letter":"A","text":"造成損失的原因"},{"letter":"B","text":"所承保的財物"},{"letter":"C","text":"正在考慮承保的人身"},{"letter":"D","text":"正在考慮承保的財物或人身"}],"answer":"A"},{"id":18,"chapter":"1","ref":"1.1.1 註","question":"如果代表保險人的「檢驗師」提出要對所承保之風險進行檢查，這裡所指的「風險」代表: i 承保的受風險財物 ii 所保「危險」或造成損失的原因 iii 保險人 iv 考慮承保的被保險人","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"B"},{"id":19,"chapter":"1","ref":"1.1.1 註","question":"風險對保險人來說可以理解為： i 保單所保「危險」或損失 ii 承保的受風險財物或人身 iii 對潛在損失的不確定性 iv 在任何情形下都不可受保的","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":20,"chapter":"1","ref":"1.1.1 註","question":"如果一名由保險人聘請的檢驗人，他必須為某項「風險」進行檢驗，那麼，「風險」一詞在這方面有 以下哪項或哪些含義？","options":[{"letter":"A","text":"將成為被保險人的繳付能力"},{"letter":"B","text":"將成為受保的財產"},{"letter":"C","text":"將成為被保險人的貸款資料"},{"letter":"D","text":"以上任何一項"}],"answer":"B"},{"id":21,"chapter":"1","ref":"1.1.1 註","question":"從保險從業員的角度，風險一詞是指： i 所保的危險 ii 承保的財物 iii 保險人承保的人身 iv 一項與潛在損失有關的不確定性","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":22,"chapter":"1","ref":"1.1.1 註 2","question":"保險中的一個詞來形容損失成因或受保財產損失原因：","options":[{"letter":"A","text":"風險"},{"letter":"B","text":"危險"},{"letter":"C","text":"保單持有人"},{"letter":"D","text":"被保險人"}],"answer":"B"},{"id":23,"chapter":"1","ref":"1.1.2a","question":"以下哪項屬於「純粹風險」? i 船隻沉沒 ii 開發新的武器 iii 建築物被意外地引發的火災被所摧毀 iv 飛機墜毀","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":24,"chapter":"1","ref":"1.1.2a","question":"風險可分為潛在的財務後果及它的原因和影響。財務後果包括純粹風險及：","options":[{"letter":"A","text":"非純風險"},{"letter":"B","text":"附加風險"},{"letter":"C","text":"衍生風險"},{"letter":"D","text":"投機風險"}],"answer":"D"},{"id":25,"chapter":"1","ref":"1.1.2a","question":"以下哪項是正確描述「純粹風險」的？ i 一艘船隻沉沒 ii 戰爭武器的生產 iii 一幅名畫於博物館內被盜竊 iv 一輛飛機墮毁","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":26,"chapter":"1","ref":"1.1.2a(i)","question":"「純粹風險」的定義：","options":[{"letter":"A","text":"一個永久不可保的風險"},{"letter":"B","text":"一份保險而保單持有人抱著誠實的態度"},{"letter":"C","text":"一項只有損失而不具收益的風險"},{"letter":"D","text":"一個具有災難性損失的風險"}],"answer":"C"},{"id":27,"chapter":"1","ref":"1.1.2a(ii)","question":"以下哪項是描述「投機風險」 ，而非純風險：","options":[{"letter":"A","text":"意外令雙腳折斷"},{"letter":"B","text":"發生嚴重車禍"},{"letter":"C","text":"建築物因雷電引致的損失"},{"letter":"D","text":"以上各項皆不是"}],"answer":"D"},{"id":28,"chapter":"1","ref":"1.1.1& 1.1.2a","question":"考慮風險概念時，以下哪項是不正確的？","options":[{"letter":"A","text":"在實際環境下，並非所有風險均可以利用商業保險保障的方式"},{"letter":"B","text":"保險是抗衡風險的唯一挽救方法"},{"letter":"C","text":"保險的基本目的是要抗衡風險所產生的財務後果"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":29,"chapter":"1","ref":"1.1.2a(i)","question":"以下哪項是屬於「純粹風險」？","options":[{"letter":"A","text":"賽馬賭博"},{"letter":"B","text":"展開一項新生意的決定"},{"letter":"C","text":"債務人無力償債"},{"letter":"D","text":"以上各項皆不是"}],"answer":"D"},{"id":30,"chapter":"1","ref":"1.1.2a(i)","question":"以下哪項或哪些屬於「純粹風險」？ i 建築物在空難中摧毀 ii 開發海洋鑽井技術 iii 建築物被意外地引起的火災摧毀 iv 一幅有價值的名畫在博物館被盜","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":31,"chapter":"1","ref":"1.1.2a(i)","question":"以下哪項關於純粹風險的描述是不正確的？","options":[{"letter":"A","text":"沉船的貨物"},{"letter":"B","text":"買入公司股票"},{"letter":"C","text":"被火燒毀的建築物"},{"letter":"D","text":"展覽館被偷取名畫"}],"answer":"B"},{"id":32,"chapter":"1","ref":"1.1.2(a)(i)","question":"以下哪項關於「純粹風險」的描述是不正確的？","options":[{"letter":"A","text":"意外失足引致腿傷"},{"letter":"B","text":"開拓深海攢探技術"},{"letter":"C","text":"建築地盤因火災引致的嚴重損失"},{"letter":"D","text":"一輛飛機墮毁"}],"answer":"B"},{"id":33,"chapter":"1","ref":"1.1.2a(i)","question":"以下哪項是描述純粹風險而不是投機風險？","options":[{"letter":"A","text":"投注賽馬"},{"letter":"B","text":"買賣股票"},{"letter":"C","text":"投資外匯"},{"letter":"D","text":"一輛汽車撞毀另一輛汽車"}],"answer":"D"},{"id":34,"chapter":"1","ref":"1.1.2a","question":"只有損失的機會而無收益的可能性之風險稱為：","options":[{"letter":"A","text":"純粹風險"},{"letter":"B","text":"特定風險"},{"letter":"C","text":"投機風險"},{"letter":"D","text":"基本風險"}],"answer":"A"},{"id":35,"chapter":"1","ref":"1.1.2a&b","question":"下列哪些是可保風險？ i 純粹風險 ii 特定風險 iii 基本風險 iv 投機風險","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":36,"chapter":"1","ref":"1.1.2a(i)","question":"以下哪項正確地描述純粹風險？","options":[{"letter":"A","text":"是必然可保的"},{"letter":"B","text":"是必然不可保的"},{"letter":"C","text":"可受保的程度比投機風險為高"},{"letter":"D","text":"可受保的程度比投機風險為低"}],"answer":"C"},{"id":37,"chapter":"1","ref":"1.1.2a(ii)","question":"以下哪項屬於「投機風險」類型？","options":[{"letter":"A","text":"製造商推出新款汽車於市場競爭"},{"letter":"B","text":"對未來恆生指數股數作推測"},{"letter":"C","text":"與友人合資投彩於賽馬活動中"},{"letter":"D","text":"包括以上各項"}],"answer":"D"},{"id":38,"chapter":"1","ref":"1.1.2a(ii)","question":"以下哪項或哪些可以分類為「投機」風險？ i 恒生指數的波動 ii 禽流感疫苗的研究及發展 iii 一個賭場被火災損壞的風險 iv 在沙田馬場舉行的一場賽馬結果","options":[{"letter":"A","text":"iii"},{"letter":"B","text":"i, ii"},{"letter":"C","text":"i, ii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":39,"chapter":"1","ref":"1.1.2a(ii)","question":"哪類風險具有收益亦有損失的兩種可能性？","options":[{"letter":"A","text":"純粹風險"},{"letter":"B","text":"投機風險"},{"letter":"C","text":"特定風險"},{"letter":"D","text":"基本風險"}],"answer":"B"},{"id":40,"chapter":"1","ref":"1.1.2a(ii)","question":"投機風險的定義：","options":[{"letter":"A","text":"一個有收益及損失的可能的風險"},{"letter":"B","text":"一個商業風險"},{"letter":"C","text":"一個只有收益但沒有損失的可能的風險"},{"letter":"D","text":"一份可使無效的合約"}],"answer":"A"},{"id":41,"chapter":"1","ref":"1.1.2b","question":"如果按照風險的影響分類，風險可以劃分為：","options":[{"letter":"A","text":"特定風險及純粹風險"},{"letter":"B","text":"基本風險及純粹風險"},{"letter":"C","text":"特定風險及基本風險"},{"letter":"D","text":"非特定風險及投機風險"}],"answer":"C"},{"id":42,"chapter":"1","ref":"1.1.2b","question":"以下哪項為「基本風險」而非「特定風險」的類別？","options":[{"letter":"A","text":"巴士墮崖"},{"letter":"B","text":"航機失事"},{"letter":"C","text":"戰事"},{"letter":"D","text":"渡輪意外"}],"answer":"C"},{"id":43,"chapter":"1","ref":"1.1.2b","question":"以下哪項是基本風險在香港情況的描述？","options":[{"letter":"A","text":"基本風險是損失的可能，非收益的機會"},{"letter":"B","text":"它的影響一般是不廣泛的"},{"letter":"C","text":"它的影響是對個人而非整個社會的"},{"letter":"D","text":"它相當可能是不受保的"}],"answer":"D"},{"id":44,"chapter":"1","ref":"1.1.2b(i)","question":"以下哪項描述最適用於特定風險？","options":[{"letter":"A","text":"一項不可保的風險"},{"letter":"B","text":"一項造成相對有限後果的風險"},{"letter":"C","text":"一項只影響指明保單持有人的風險"},{"letter":"D","text":"一項指明個別財物的財產保險"}],"answer":"B"},{"id":45,"chapter":"1","ref":"1.1.2b(i)","question":"特定風險是：","options":[{"letter":"A","text":"相當可能影響大量人數的情況"},{"letter":"B","text":"可能不會導致災難的後果"},{"letter":"C","text":"可能涉及政府"},{"letter":"D","text":"可能產生災難性的後果"}],"answer":"B"},{"id":46,"chapter":"1","ref":"1.1.2b(i)","question":"就可保性而言，特定風險可以形容為：","options":[{"letter":"A","text":"必然可保"},{"letter":"B","text":"永不可保"},{"letter":"C","text":"可保性相對於基本風險為高"},{"letter":"D","text":"可保性相對於基本風險為低"}],"answer":"C"},{"id":47,"chapter":"1","ref":"1.1.2b(i)","question":"以下哪類風險的影響是有限的﹝並非廣泛的﹞？","options":[{"letter":"A","text":"純粹風險"},{"letter":"B","text":"投機風險"},{"letter":"C","text":"特定風險"},{"letter":"D","text":"基本風險"}],"answer":"C"},{"id":48,"chapter":"1","ref":"1.1.2b(ii)","question":"以下哪項關於基本風險的描述是正確的？","options":[{"letter":"A","text":"地震或自然災害"},{"letter":"B","text":"通常都屬於除外責任"},{"letter":"C","text":"影響遍及整體社會而非個別人士"},{"letter":"D","text":"以上所述各項"}],"answer":"D"},{"id":49,"chapter":"1","ref":"1.1.2b(ii)","question":"一種風險的種類，它成為現實時，有可能會產生很廣泛的影響，這類風險通常稱為:","options":[{"letter":"A","text":"純粹風險"},{"letter":"B","text":"特定風險"},{"letter":"C","text":"投機風險"},{"letter":"D","text":"基本風險"}],"answer":"D"},{"id":50,"chapter":"1","ref":"1.1.2b(ii)","question":"饑荒、戰爭及大規模洪災是屬於哪類風險？","options":[{"letter":"A","text":"純粹風險"},{"letter":"B","text":"災難風險"},{"letter":"C","text":"特定風險"},{"letter":"D","text":"基本風險"}],"answer":"D"},{"id":51,"chapter":"1","ref":"1.1.2b(ii)","question":"有一種風險，是很多財產保單中的除外責任，這種風險稱為：","options":[{"letter":"A","text":"純粹風險"},{"letter":"B","text":"特定風險"},{"letter":"C","text":"基本風險"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":52,"chapter":"1","ref":"1.1.2b(ii)","question":"以下哪項被列為「基本風險」？","options":[{"letter":"A","text":"鍋爐爆炸"},{"letter":"B","text":"沙士爆發"},{"letter":"C","text":"數輛車相撞"},{"letter":"D","text":"打劫"}],"answer":"B"},{"id":53,"chapter":"1","ref":"1.1.2b(ii)","question":"基本風險是：","options":[{"letter":"A","text":"通常帶來的影響為固定及可計算量度的"},{"letter":"B","text":"發生的原因是超逾一個人或甚至一群人所能操控的，其所響的人不計其數，包括戰爭及天災人禍"},{"letter":"C","text":"特定風險的另一學名"},{"letter":"D","text":"以上各項均不是"}],"answer":"B"},{"id":54,"chapter":"1","ref":"1.1.3","question":"以下哪項是對「風險管理」的不正確描述？","options":[{"letter":"A","text":"保險人可以廣義的作出運用"},{"letter":"B","text":"在投資的述語中可能涉及管理投機風險"},{"letter":"C","text":"保險公司可以把運用範圍收窄至管理可保風險"},{"letter":"D","text":"可以描述為管理純粹風險或投機風險"}],"answer":"A"},{"id":55,"chapter":"1","ref":"1.1.3","question":"以下那項對風險管理的描述是正確的？","options":[{"letter":"A","text":"風險管理的其中一個方法是保險的安排"},{"letter":"B","text":"風險管理與保險並沒有聯繫"},{"letter":"C","text":"風險管理乃保險業界中的專有詞彙"},{"letter":"D","text":"風險管理即物質上控制風險"}],"answer":"A"},{"id":56,"chapter":"1","ref":"1.1.3","question":"以下哪項是對保險公司「風險管理」正確描述？","options":[{"letter":"A","text":"核保程序"},{"letter":"B","text":"保障投資盈利"},{"letter":"C","text":"保險公司理賠服務能力"},{"letter":"D","text":"降低受保風險損失可能性"}],"answer":"D"},{"id":57,"chapter":"1","ref":"1.1.3","question":"考慮改善受保的風險之潛在損失的可能性，保險人可能採用的字眼為：","options":[{"letter":"A","text":"核保"},{"letter":"B","text":"風險評估"},{"letter":"C","text":"風險管理"},{"letter":"D","text":"保險風險分析"}],"answer":"C"},{"id":58,"chapter":"1","ref":"1.1.3","question":"以下哪項有關「風險管理」一詞的描述是正確的：","options":[{"letter":"A","text":"只適用於保險公司"},{"letter":"B","text":"保險公司不大可能收窄此詞之應用至純風險"},{"letter":"C","text":"它指三步驟：風險識別、風險免除及風險融資"},{"letter":"D","text":"它包含二個步驟：風險識別及風險量化"}],"answer":"D"},{"id":59,"chapter":"1","ref":"1.1.3","question":"作為一門獨立學科，風險管理涉及：","options":[{"letter":"A","text":"純風險及投機風險"},{"letter":"B","text":"以保險人角度看，涉及純風險"},{"letter":"C","text":"以銀行家角度看，涉及投機風險"},{"letter":"D","text":"以上所列各項"}],"answer":"D"},{"id":60,"chapter":"1","ref":"1.1.3","question":"以下哪三項有關風險管理的陳述是正確的？ i. 它可能涉及投機風險和純風險 ii. 作為一門獨立科學，它涉及的問題較保險廣泛 iii. 以保險人的角度看，它絕大程度涉及受保的風險 iv. 以被保險人的角度看，它只涉及不受保的風險","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":61,"chapter":"1","ref":"1.1.3","question":"以下哪項關於「風險管理」的描述是正確的？","options":[{"letter":"A","text":"風險管理只應用於保險人"},{"letter":"B","text":"保險是風險管理其中一環"},{"letter":"C","text":"風險管理在銀行業界中與保險人的含意相同"},{"letter":"D","text":"保險人與被保險人對風險的理解一致"}],"answer":"B"},{"id":62,"chapter":"1","ref":"1.1.3","question":"如果風險被視為獨立的知識及研究學科， 「風險管理」一詞會經常被提及或應用，當保險人應用風險 管理時：","options":[{"letter":"A","text":"與獨立的知識及研究學科中的意思無異"},{"letter":"B","text":"較為著重改善風險"},{"letter":"C","text":"指的是投機風險而非純粹風險"},{"letter":"D","text":"只涉及保費計算"}],"answer":"B"},{"id":63,"chapter":"1","ref":"1.1.3","question":"下列哪項有關風險管理的句子是正確的？","options":[{"letter":"A","text":"在研究的獨立範疇中，風險管理是指投資及其他投機風險"},{"letter":"B","text":"在銀行的領域上，風險管理是指識別、量化及應對那些對某家機構構成威脅的風險"},{"letter":"C","text":"對保險人而言，風險管理可能只針對純粹風險"},{"letter":"D","text":"以上各項都不是"}],"answer":"C"},{"id":64,"chapter":"1","ref":"1.1.3","question":"以下哪項是對風險管理的不正確描述？","options":[{"letter":"A","text":"保險人經常廣義地使用此詞彙"},{"letter":"B","text":"投資術語中可涉及投機風險"},{"letter":"C","text":"保險人可把範圍收窄至祇對可保風險的管理"},{"letter":"D","text":"一般情況下可涉及純粹風險及特定風險"}],"answer":"A"},{"id":65,"chapter":"1","ref":"1.1.3","question":"保險可被形容為：","options":[{"letter":"A","text":"一種應付風險的方法"},{"letter":"B","text":"應付風險的唯一方法"},{"letter":"C","text":"應付任何類型風險的最廉價的方法"},{"letter":"D","text":"一種確保不會出現損失的萬無一失的妙法"}],"answer":"A"},{"id":66,"chapter":"1","ref":"1.1.3","question":"以獨立的一門學問來看， 「風險管理」可以利用哪項或哪些項的保險應付？","options":[{"letter":"A","text":"工程保險"},{"letter":"B","text":"經濟權益保險"},{"letter":"C","text":"一籃子保單"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":67,"chapter":"1","ref":"1.1.3","question":"以獨立的一門學問來看， 「風險管理」被視為：","options":[{"letter":"A","text":"保險的一部份"},{"letter":"B","text":"投機風險"},{"letter":"C","text":"保險可作為其中的一個應付選擇"},{"letter":"D","text":"與保險完全沒有關係"}],"answer":"C"},{"id":68,"chapter":"1","ref":"1.1.3","question":"很多時候，保險人在談論“風險管理”，管理可能涉及到：","options":[{"letter":"A","text":"公司要求承保或被要求承保的風險"},{"letter":"B","text":"危險風險"},{"letter":"C","text":"投資及其他投機風險"},{"letter":"D","text":"公司內主管核保部門的行政人員"}],"answer":"A"},{"id":69,"chapter":"1","ref":"1.1.3(a)","question":"在銀行及其他保險業以外的金融服務領域中，風險管理是指： i 投資風險 ii 投機風險 iii 防範風險 iv 減輕風險","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"A"},{"id":70,"chapter":"1","ref":"1.1.3(b)","question":"以下哪項能恰當地描述一般保險人對「風險管理」的描述：","options":[{"letter":"A","text":"核保程序"},{"letter":"B","text":"保障投資利潤"},{"letter":"C","text":"保險人的理賠服務能力"},{"letter":"D","text":"降低受保風險損失的可能性"}],"answer":"D"},{"id":71,"chapter":"1","ref":"1.1.3(b)","question":"保險業類別的風險管理涉及：","options":[{"letter":"A","text":"風險核保"},{"letter":"B","text":"處理索償"},{"letter":"C","text":"保險公司的成本"},{"letter":"D","text":"降低或改善所承保風險的潛在損失"}],"answer":"D"},{"id":72,"chapter":"1","ref":"1.1.3(b)","question":"保險公司在使用「風險管理」一詞時，它可能是指：","options":[{"letter":"A","text":"投資及其他投機風險"},{"letter":"B","text":"在正常情況下不可保的風險"},{"letter":"C","text":"正在承保或考慮承保的風險"},{"letter":"D","text":"公司內主管核保部門的行政人員"}],"answer":"C"},{"id":73,"chapter":"1","ref":"1.1.3(b)","question":"保險業中，風險管理所涉及的「風險」是指：","options":[{"letter":"A","text":"投資及投機風險"},{"letter":"B","text":"核保部門的行政人員"},{"letter":"C","text":"承保或被要求承保的風險"},{"letter":"D","text":"純粹風險"}],"answer":"D"},{"id":74,"chapter":"1","ref":"1.1.3 (c)","question":"作為「風險管理」在獨立的知識及研究範疇上，一般的理解為：","options":[{"letter":"A","text":"投資或投機風險所帶來的損失"},{"letter":"B","text":"保險人對受保風險損失上的改善"},{"letter":"C","text":"以識別、量化及處理作為進行的步驟"},{"letter":"D","text":"環繞著對保險合約的訂立及處理"}],"answer":"C"},{"id":75,"chapter":"1","ref":"1.1.3(c)","question":"在考慮風險的知識和研究的一個獨立的學科，經常被使用”風險管理”一詞。當保險人使用這個詞：","options":[{"letter":"A","text":"與知識和研究的一個獨立學科意思是一樣的"},{"letter":"B","text":"主要降低和改善承保的風險"},{"letter":"C","text":"其所指是投機風險，而不是純粹的風險"},{"letter":"D","text":"關係只在於計算保費"}],"answer":"B"},{"id":76,"chapter":"1","ref":"1.1.3(c)","question":"作為一門獨立的學科及研究的範圍，風險管理：","options":[{"letter":"A","text":"只處理純粹風險"},{"letter":"B","text":"只處理投機風險"},{"letter":"C","text":"可以處理純粹風險或投機風險"},{"letter":"D","text":"即非處理純粹風險也非投機風險"}],"answer":"C"},{"id":77,"chapter":"1","ref":"1.1.3(c)","question":"在獨立的研究和實務範疇中，風險管理是指：","options":[{"letter":"A","text":"主要是純粹風險"},{"letter":"B","text":"只有投機風險"},{"letter":"C","text":"只有可以受保風險"},{"letter":"D","text":"只有不可以受保風險"}],"answer":"A"},{"id":78,"chapter":"1","ref":"1.1.3(c)","question":"一般學術性管理風險上，除識別及應對那些對某家機構構成威脅的風險外，還有那一項亦為重要：","options":[{"letter":"A","text":"商討計策"},{"letter":"B","text":"量化"},{"letter":"C","text":"減輕風險"},{"letter":"D","text":"防範化"}],"answer":"B"},{"id":79,"chapter":"1","ref":"1.1.3(c)","question":"作為一門獨立的學科，風險管理是：","options":[{"letter":"A","text":"保險的其中一環"},{"letter":"B","text":"涉及可保風險"},{"letter":"C","text":"屬於機構性質的風險"},{"letter":"D","text":"可被形容為在整件過程中包括保險為其中的一環"}],"answer":"D"},{"id":80,"chapter":"1","ref":"1.1.3(c)","question":"在風險管理的課題中，識別威脅一間機構的風險後，會有下列哪些步驟？ i 量化 ii 損失防範 iii 損失降低 iv 金錢應付","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":81,"chapter":"1","ref":"1.1.3(c)","question":"作為一門獨立的學科，風險管理是：","options":[{"letter":"A","text":"保險的其中一環"},{"letter":"B","text":"涉及可保風險"},{"letter":"C","text":"屬於機構性質的風險"},{"letter":"D","text":"可被形容為在整件過程中包括保險為其中的一環"}],"answer":"D"},{"id":82,"chapter":"1","ref":"1.1.3(c)","question":"保險與風險管理之關係是：","options":[{"letter":"A","text":"保險是風險管理的其中一環"},{"letter":"B","text":"風險管理是保險的其中一環"},{"letter":"C","text":"保險與風險管理是完全相同之學科"},{"letter":"D","text":"保險與風險管理是無關的"}],"answer":"A"},{"id":83,"chapter":"1","ref":"1.1.3(c)","question":"在知識及研究的範疇中，風險管理的步驟包括： i 識別風險 ii 量化風險 iii 應對及防範、降低或以金錢應付威脅一間機構的風險 iv 確別風險","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"A"},{"id":84,"chapter":"1","ref":"1.1.3(c)","question":"風險管理可以解釋為管理學的一個分支，它包括了三項的步驟。最後一項是應對那些對某家機構構成威脅 (ii) 的風險，而前兩項為識別及","options":[{"letter":"A","text":"投保"},{"letter":"B","text":"量化"},{"letter":"C","text":"消除"},{"letter":"D","text":"轉移"}],"answer":"B"},{"id":85,"chapter":"1","ref":"1.1&1.2","question":"「保險」與「風險」之間的關係如何?","options":[{"letter":"A","text":"有些風險（不是所有類型之風險）是可保的"},{"letter":"B","text":"有著保險的保障，所有財務上的損失都是保險人之責任"},{"letter":"C","text":"應付風險的唯一方法就是保險"},{"letter":"D","text":"所有風險都是可保的"}],"answer":"A"},{"id":86,"chapter":"1","ref":"1.2(a)","question":"向被保人的受養人支付死亡保險金，可以稱得上是：","options":[{"letter":"A","text":"人壽保險唯一的功能"},{"letter":"B","text":"人壽保險的一項基本好處"},{"letter":"C","text":"保險的唯一功能或好處"},{"letter":"D","text":"不屬保險的功能或好處"}],"answer":"B"},{"id":87,"chapter":"1","ref":"1.2(a)","question":"什麼是保險所帶出的基本功能/好處？","options":[{"letter":"A","text":"為投保人作出感受上的安慰"},{"letter":"B","text":"替投保人作出明智的財務選擇"},{"letter":"C","text":"為投保人作出金錢上的賠償損失"},{"letter":"D","text":"以上各項均不是"}],"answer":"C"},{"id":88,"chapter":"1","ref":"1.2(a)","question":"「風險轉移機制」的概念是:","options":[{"letter":"A","text":"只適用於保險上"},{"letter":"B","text":"是保險的基本特點"},{"letter":"C","text":"是保險的輔助特點"},{"letter":"D","text":"只適用於人壽保險及海上貨物保險上"}],"answer":"B"},{"id":89,"chapter":"1","ref":"1.2(a)","question":"保險基本上：","options":[{"letter":"A","text":"與賭博相同"},{"letter":"B","text":"是一種風險轉移機制"},{"letter":"C","text":"只是一種應付投機風險的防衛方法"},{"letter":"D","text":"是一種保證沒有意外可以發生的途徑"}],"answer":"B"},{"id":90,"chapter":"1","ref":"1.2(a)","question":"保險本質上屬於一種：","options":[{"letter":"A","text":"抵銷風險機制"},{"letter":"B","text":"風險轉移機制"},{"letter":"C","text":"減少風險機制"},{"letter":"D","text":"杜絕風險機制"}],"answer":"B"},{"id":91,"chapter":"1","ref":"1.2(a)","question":"下列哪項是保險的基本好處/功能？","options":[{"letter":"A","text":"增加就業機會"},{"letter":"B","text":"為被保險的受害人提供金錢上的補償"},{"letter":"C","text":"鞏固金融服務業"},{"letter":"D","text":"幫助經濟增長及發展"}],"answer":"B"},{"id":92,"chapter":"1","ref":"1.2(a)","question":"為損失作出財務上的補償，可以怎樣去理解呢？","options":[{"letter":"A","text":"保險的基本功能"},{"letter":"B","text":"保險的輔助功能"},{"letter":"C","text":"保險的唯一功能"},{"letter":"D","text":"並非保險的基本或輔助功能"}],"answer":"A"},{"id":93,"chapter":"1","ref":"1.2(a)","question":"以下哪項或哪些可稱得上是保險的基本功能?","options":[{"letter":"A","text":"是風險轉移機制"},{"letter":"B","text":"為本港提供就業機會"},{"letter":"C","text":"為大部分人提供儲蓄"},{"letter":"D","text":"以上各項皆是"}],"answer":"A"},{"id":94,"chapter":"1","ref":"1.2(a)","question":"下列哪項不是保險的基本好處/功能？ i 保險是一種風險轉移機制 ii 把個人的潛在財務損失轉移給保險人 iii 幫助經濟增長及發展 iv 增加就業機會","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"以上全部都不是"}],"answer":"C"},{"id":95,"chapter":"1","ref":"1.2(b)","question":"保險為社會帶來好處嗎？","options":[{"letter":"A","text":"是有的，通過保險人要求採取可接受的損失降低措施等等"},{"letter":"B","text":"是有的，這是一種社會手段"},{"letter":"C","text":"沒有的，這僅僅是個人安排"},{"letter":"D","text":"沒有的，除非是強制保險"}],"answer":"A"},{"id":96,"chapter":"1","ref":"1.2(b)","question":"下列哪項不是保險的輔助功能？","options":[{"letter":"A","text":"增加就業機會"},{"letter":"B","text":"幫助經濟增長及發展"},{"letter":"C","text":"把金錢上的損失轉移到保險公司身上"},{"letter":"D","text":"作為儲蓄途徑"}],"answer":"C"},{"id":97,"chapter":"1","ref":"1.2(b)","question":"提供就業機會，損失防範，協助儲蓄及投資，可被形容為：","options":[{"letter":"A","text":"與保險全無關係"},{"letter":"B","text":"是保險的基本功能"},{"letter":"C","text":"是保險的輔助功能而非基本功能"},{"letter":"D","text":"是保險的基本目的而非副產品"}],"answer":"C"},{"id":98,"chapter":"1","ref":"1.2(b)","question":"以下哪項可視為保險為香港帶來的輔助功能/好處？ i 作為儲蓄途徑 ii 提供就業機會 iii 鼓勵經濟發展 iv 減低意外／損失的次數","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":99,"chapter":"1","ref":"1.2(b)","question":"下列哪項屬於保險的輔助功能/好處：","options":[{"letter":"A","text":"促進經濟繁榮"},{"letter":"B","text":"為老人、家庭悲劇及受害人提供福利"},{"letter":"C","text":"創造就業機會"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":100,"chapter":"1","ref":"1.2(b)","question":"以下哪項不應被視為保險對社會的間接益處：","options":[{"letter":"A","text":"為不少人提供就業機會"},{"letter":"B","text":"協助損失控制"},{"letter":"C","text":"促進經濟發展"},{"letter":"D","text":"對受保項目的受害人提供財務上的補償"}],"answer":"D"},{"id":101,"chapter":"2","ref":"2","question":"保險代理人安排一份保險合約時，涉及以下哪項或哪些法律範圍？","options":[{"letter":"A","text":"合約法"},{"letter":"B","text":"代理法"},{"letter":"C","text":"《保險業條例》的條文"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":102,"chapter":"2","ref":"2.1.1","question":"以下哪項對法律開支合約的描述是正確的？","options":[{"letter":"A","text":"嚴格來說，合約是無形的"},{"letter":"B","text":"不是所有協議都是合約"},{"letter":"C","text":"是可在法律上強制執行的協議"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":103,"chapter":"2","ref":"2.1.1","question":"合約可以定義為","options":[{"letter":"A","text":"具有法律效力的協議"},{"letter":"B","text":"兩人或多人之間的承諾"},{"letter":"C","text":"書面協議"},{"letter":"D","text":"兩方或多方之間的任何協議"}],"answer":"A"},{"id":104,"chapter":"2","ref":"2.1.1","question":"合約是法律上可強制執行的協議，而：","options":[{"letter":"A","text":"在訂立合約時，必須有第三者在場"},{"letter":"B","text":"它的內容必須涉及財務利益"},{"letter":"C","text":"內容可包含重要及次要事項"},{"letter":"D","text":"訂立時必須有法律人士在場"}],"answer":"C"},{"id":105,"chapter":"2","ref":"2.1.1","question":"以下哪三項對營業中斷保險合約的陳述是正確的？ i 不是所有協議都是合約 ii 必須經蓋章發生 iii 合約是可在法律上強制執行的協議 iv 嚴格來說，合約是無形的","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iv"}],"answer":"C"},{"id":106,"chapter":"2","ref":"2.1.1","question":"在社交活動中，朋友間的晚飯約會：","options":[{"letter":"A","text":"是一份道德的合約"},{"letter":"B","text":"在法律上不能強制執行合約"},{"letter":"C","text":"超過二人以上才可成為合約"},{"letter":"D","text":"以書面形式表達才構成一份合約"}],"answer":"B"},{"id":107,"chapter":"2","ref":"2.1.2","question":"以下哪三項有關僅以個人所涉及行為訂立的簡單合約的說明是不正確的? i 在法律上，這種交易不是真正的合約 ii 這些是特殊情況，並因此稱為「特殊合約」 iii 為使其合約有效，這種合約隨後會以書面形式表達 iv 儘管不是以口頭表達或書面方式，這種合約仍是有效的","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":108,"chapter":"2","ref":"2.1.2","question":"一位買者購買東西，付錢後完成交易，一份合約已經訂立，稱為：","options":[{"letter":"A","text":"簡單合約"},{"letter":"B","text":"不是合約，因為沒有口頭或者書面證明"},{"letter":"C","text":"是契據，因為沒有口頭或者書面證明"},{"letter":"D","text":"以上各項皆不是"}],"answer":"A"},{"id":109,"chapter":"2","ref":"2.1.2","question":"如要有效，一份合約必須：","options":[{"letter":"A","text":"以書面或口頭方式訂立"},{"letter":"B","text":"法律上訂明的手續(如有的話)"},{"letter":"C","text":"獨立見證人見證"},{"letter":"D","text":"符合上述 A 和 B"}],"answer":"D"},{"id":110,"chapter":"2","ref":"2.1.2","question":"下列哪三項有關長期保險合約的陳述是正確的？ i 並非所有協議都是合約 ii 所有合約必須經蓋章簽發 iii 合約是一份在法律上可強制執行的協議 iv 嚴格來說，合約是無形的","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":111,"chapter":"2","ref":"2.1.2(a)","question":"以下哪項是簡單合約的真實形容?","options":[{"letter":"A","text":"它不可解釋作貴重財物的投保"},{"letter":"B","text":"它可以是書面或口頭的"},{"letter":"C","text":"它必須經蓋章後發出才有效"},{"letter":"D","text":"以上沒有一項是正確的"}],"answer":"B"},{"id":112,"chapter":"2","ref":"2.1.2(a)","question":"以下哪項正確描述簡單合約？","options":[{"letter":"A","text":"必須以易於明白及理解的語言訂立"},{"letter":"B","text":"可以書面或口頭方式訂立"},{"letter":"C","text":"必須以蓋章形式訂立"},{"letter":"D","text":"以上各項皆不正確"}],"answer":"B"},{"id":113,"chapter":"2","ref":"2.1.2(a)","question":"以下哪項或哪些是一份「簡單合約」必要的？","options":[{"letter":"A","text":"必須以書面形式訂立"},{"letter":"B","text":"合約的各方都需付出代價"},{"letter":"C","text":"用詞必須簡單及容易明白"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":114,"chapter":"2","ref":"2.1.2(a)","question":"儘管缺乏口頭或書面證據，但可從涉及之人的行為斷定某項合約的存在，在法律上可描述為：","options":[{"letter":"A","text":"簡單合約"},{"letter":"B","text":"契據"},{"letter":"C","text":"推斷合約"},{"letter":"D","text":"以上任何一項"}],"answer":"A"},{"id":115,"chapter":"2","ref":"2.1.2(a)","question":"以下哪兩項有關簡單合約的陳述是正確的？ i 它們絕對不能是書面的 ii 它們不是經蓋章後發出 iii 在任何情況下它們必須是書面的 iv 它們可以是口頭或書面性質出現","options":[{"letter":"A","text":"i 及 ii 而已"},{"letter":"B","text":"i 及 iii 而已"},{"letter":"C","text":"ii 及 iii 而已"},{"letter":"D","text":"ii 及 iv 而已"}],"answer":"D"},{"id":116,"chapter":"2","ref":"2.1.2(a)","question":"「簡單合約」:","options":[{"letter":"A","text":"有效性並不取決於特殊的手續"},{"letter":"B","text":"只涉及一些不重要的事情"},{"letter":"C","text":"使用每人都明白的字句"},{"letter":"D","text":"不會涉及複雜和艱深的字句"}],"answer":"A"},{"id":117,"chapter":"2","ref":"2.1.2(a)","question":"為何保險合約屬於「簡單合約」？","options":[{"letter":"A","text":"因為它只涉及易於瞭解及簡單的內容"},{"letter":"B","text":"因為在法律上必須要以書面訂立"},{"letter":"C","text":"因為沒有指定要以書面訂立"},{"letter":"D","text":"因為必須要以簡易淺白的文字訂立"}],"answer":"C"},{"id":118,"chapter":"2","ref":"2.1.2(a)","question":"保險合約通常屬於哪一類合約？","options":[{"letter":"A","text":"簡單"},{"letter":"B","text":"蓋印"},{"letter":"C","text":"紀錄"},{"letter":"D","text":"契據"}],"answer":"A"},{"id":119,"chapter":"2","ref":"2.1.2(a)","question":"下列哪項是「簡單合約」的特性？","options":[{"letter":"A","text":"永遠不會以書面形式出現"},{"letter":"B","text":"法律上毋須以書面形式出現"},{"letter":"C","text":"必須要以書面形式出現"},{"letter":"D","text":"用字淺易簡白"}],"answer":"B"},{"id":120,"chapter":"2","ref":"2.1.2(a)","question":"保單在執行上往往以甚麼形式出現？","options":[{"letter":"A","text":"口頭性質"},{"letter":"B","text":"經蓋章後發出"},{"letter":"C","text":"書面"},{"letter":"D","text":"用詞簡單及易於明白"}],"answer":"C"},{"id":121,"chapter":"2","ref":"2.1.2(a)","question":"一個人在店舖內購買物件時，放下金錢並取走物件，過程中不發一言，在這種情況下：","options":[{"letter":"A","text":"屬於違法事件"},{"letter":"B","text":"以行為証明下訂立了合約"},{"letter":"C","text":"因為沒有蓋章及簽署，故此訂立了契據"},{"letter":"D","text":"巳訂立了一份記錄合約"}],"answer":"B"},{"id":122,"chapter":"2","ref":"2.1.2(a)","question":"以下哪項是簡單合約必須具有的條件？ i 代價 ii 要約 iii 簽署及蓋章 iv 必定以書面形式發出","options":[{"letter":"A","text":"i"},{"letter":"B","text":"i, ii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"B"},{"id":123,"chapter":"2","ref":"2.1.2& 2.1.3","question":"以下列哪項是簡單合約訂立時必須具備的條件？","options":[{"letter":"A","text":"以書面形式"},{"letter":"B","text":"合約雙方年滿十八歲"},{"letter":"C","text":"合約雙方付出代價"},{"letter":"D","text":"以上各項都是"}],"answer":"C"},{"id":124,"chapter":"2","ref":"2.1.2(b)","question":"以下有些是有關契據的正確描述？","options":[{"letter":"A","text":"它是成熟的簡單合約"},{"letter":"B","text":"合約的價值高"},{"letter":"C","text":"以書面形式簽發"},{"letter":"D","text":"以上各項都是"}],"answer":"C"},{"id":125,"chapter":"2","ref":"2.1.2(b)","question":"以下哪種合約是保險人在正常情況下會以契據方式成立的？","options":[{"letter":"A","text":"忠誠保證保險"},{"letter":"B","text":"強制性(第三者)汽車保險"},{"letter":"C","text":"擔保"},{"letter":"D","text":"以上所有各項"}],"answer":"C"},{"id":126,"chapter":"2","ref":"2.1.3","question":"一份有效的簡單合約對於以下哪項不是十分重要？","options":[{"letter":"A","text":"合法性"},{"letter":"B","text":"訂約的行為能力"},{"letter":"C","text":"代價"},{"letter":"D","text":"公平及合理的價格"}],"answer":"D"},{"id":127,"chapter":"2","ref":"2.1.3","question":"以下哪項顯示出有關人士並無訂約的行為能力?","options":[{"letter":"A","text":"沒有交保費能力"},{"letter":"B","text":"沒有做生意能力"},{"letter":"C","text":"沒有續保能力"},{"letter":"D","text":"沒有訂立合約的法律能力"}],"answer":"D"},{"id":128,"chapter":"2","ref":"2.1.3","question":"以下哪項不是簡單合約元素？","options":[{"letter":"A","text":"要約"},{"letter":"B","text":"承約"},{"letter":"C","text":"以書面文件作証據"},{"letter":"D","text":"對方的代價"}],"answer":"C"},{"id":129,"chapter":"2","ref":"2.1.3(a)","question":"要成立任何合約，其要約：","options":[{"letter":"A","text":"必須按其原有內容而被承約"},{"letter":"B","text":"可以視乎若干條件後而被承約"},{"letter":"C","text":"必須被承約，並須以書面通知收到"},{"letter":"D","text":"總是必須大體上被承約"}],"answer":"A"},{"id":130,"chapter":"2","ref":"2.1.3 (c)","question":"蘇先生在電話中要求一張機器全險保單，保險人承諾在一星期內發單。電話對話完結一小時後，該等 機器在火災中被毁。請問有否一個有效的機器全險保險合約承保是次火災損失？","options":[{"letter":"A","text":"沒有；承約不曾存在"},{"letter":"B","text":"沒有；保單還沒發"},{"letter":"C","text":"有；保險人一承諾發單，合約便訂立了"},{"letter":"D","text":"一個有追遡力的合約將在付保費時生效"}],"answer":"C"},{"id":131,"chapter":"2","ref":"2.1.3 - 1","question":"如果一份合約是「無效的」意指：","options":[{"letter":"A","text":"保險人有權取消合約"},{"letter":"B","text":"任何一方均可取消合約"},{"letter":"C","text":"在法律上這份合約是無效的"},{"letter":"D","text":"保險人已決定不作賠償"}],"answer":"C"},{"id":132,"chapter":"2","ref":"2.1.3 - 2","question":"有些合約是「可使無效的」， 「可使無效」是指：","options":[{"letter":"A","text":"永遠不能變為有效"},{"letter":"B","text":"可由一方將它變成無效"},{"letter":"C","text":"是有效的，但不可在法庭上執行"},{"letter":"D","text":"受屈一方可於合理時間內把合約視為無效"}],"answer":"D"},{"id":133,"chapter":"2","ref":"2.1.3 - 2","question":"以下哪項對可使無效的保險合約之陳述是正確的？","options":[{"letter":"A","text":"可使無效的合約是永遠不能變為有效的"},{"letter":"B","text":"可使無效與無效兩者的含義完全相同"},{"letter":"C","text":"受屈的一方可於合理時間內把合約視為無效的決定"},{"letter":"D","text":"只有被保險人才能把保單視作可使無效(即可予以取消)"}],"answer":"C"},{"id":134,"chapter":"2","ref":"2.1.3 - 2","question":"若客戶於投保後，給保險人發現遺漏或提供錯誤的重要資料，在發現後之一段合理時間內，保單可被視為：","options":[{"letter":"A","text":"由開始時已無效"},{"letter":"B","text":"可使無效"},{"letter":"C","text":"保單仍然生效"},{"letter":"D","text":"不能強制執行"}],"answer":"B"},{"id":135,"chapter":"2","ref":"2.1.3 - 2","question":"一份「可使無效的」合約，若合約的受屈一方沒有採取行動，該份合約會如何？","options":[{"letter":"A","text":"有關合約在合理時間過後將自動變成無效"},{"letter":"B","text":"有關合約在合理時間過後不可被視為無效"},{"letter":"C","text":"有關合約沒有法律效力"},{"letter":"D","text":"有關合約可在法庭上執行"}],"answer":"B"},{"id":136,"chapter":"2","ref":"2.1.3 - 3","question":"如果不可能按照某份不是無效的合約起訴，那麼這份合約是：","options":[{"letter":"A","text":"無投訴"},{"letter":"B","text":"違約"},{"letter":"C","text":"可使無效的"},{"letter":"D","text":"不能強制執行的"}],"answer":"D"},{"id":137,"chapter":"2","ref":"2.1.3 - 3","question":"一份合約由於一些要求還未完成而令致有關合約無法執行，此稱為：","options":[{"letter":"A","text":"可使無效的合約"},{"letter":"B","text":"不能強制執行的合約"},{"letter":"C","text":"無效的合約"},{"letter":"D","text":"不合法的合約"}],"answer":"B"},{"id":138,"chapter":"2","ref":"2.1.3(a)","question":"在一份建議合約上的要約對象稱為:","options":[{"letter":"A","text":"要約人"},{"letter":"B","text":"受要約人"},{"letter":"C","text":"被動人"},{"letter":"D","text":"準客户"}],"answer":"B"},{"id":139,"chapter":"2","ref":"2.1.3(a)","question":"一位用建議書作為要約的人被稱為：","options":[{"letter":"A","text":"建議人"},{"letter":"B","text":"受要約人"},{"letter":"C","text":"要約人"},{"letter":"D","text":"未來的客戶"}],"answer":"C"},{"id":140,"chapter":"2","ref":"2.1.3(b)","question":"如果保險人指出除非相關的保險限期縮減為半年，否則不會接受某項口頭投保。那麼，這項由保險人 提出的建議可構成：","options":[{"letter":"A","text":"反承約"},{"letter":"B","text":"相反的要約"},{"letter":"C","text":"反要約"},{"letter":"D","text":"附條件的承約"}],"answer":"C"},{"id":141,"chapter":"2","ref":"2.1.3(b)","question":"在反要約的過程中，下列哪項是不正確的？","options":[{"letter":"A","text":"原本的要約人成為受要約人"},{"letter":"B","text":"原本的受要約人成為要約人"},{"letter":"C","text":"原本的要約內容立刻被終止並撤銷"},{"letter":"D","text":"若反要約的內容不被接納，原本的要約內容可再次有效"}],"answer":"D"},{"id":142,"chapter":"2","ref":"2.1.3(b)","question":"在訂立合約的過程中，「甲方」是提出要約的一方；即「要約人」，而「乙方」則是「受要約人」 ， 如「乙方」不接受「甲方」的提議，並作出反要約：","options":[{"letter":"A","text":"「甲方」便成為「受要約人」"},{"letter":"B","text":"「甲方」仍是要約人，「乙方」仍是「受要約人」"},{"letter":"C","text":"原本的要約仍然有效"},{"letter":"D","text":"在保險合約中，永不會出現「反要約」"}],"answer":"A"},{"id":143,"chapter":"2","ref":"2.1.3(b)","question":"在訂立合約的過程中，甲方(A) 向乙方(B)要約合約,而(B)回答(A)要修改當中的條款, 這是:","options":[{"letter":"A","text":"反要約"},{"letter":"B","text":"相反要約"},{"letter":"C","text":"附條件的承約"},{"letter":"D","text":"反承約"}],"answer":"A"},{"id":144,"chapter":"2","ref":"2.1.3(b)","question":"保險保障要求提出後，保險人要求增加保費才接受保險保障要求，保險人的要求在法律上稱為：","options":[{"letter":"A","text":"反要約"},{"letter":"B","text":"相反的要約"},{"letter":"C","text":"有保留承約"},{"letter":"D","text":"有條件承約"}],"answer":"A"},{"id":145,"chapter":"2","ref":"2.1.3(b)","question":"要約如何能轉變為一份有效協議？","options":[{"letter":"A","text":"以精確字句接納原有的內容"},{"letter":"B","text":"必須被接納及以書面通知"},{"letter":"C","text":"必須在四十八小時內承約"},{"letter":"D","text":"接受大致上的條件"}],"answer":"A"},{"id":146,"chapter":"2","ref":"2.1.3(c)","question":"在保險合約中，保險人所付出的代價為：","options":[{"letter":"A","text":"於索償時所支付的數額"},{"letter":"B","text":"給予補償的承諾"},{"letter":"C","text":"支付代理人之佣金"},{"letter":"D","text":"退保款項"}],"answer":"B"},{"id":147,"chapter":"2","ref":"2.1.3(c)","question":"安琪在上機前買保險，保險人承諾安琪可回來後才繳付保費，安琪在途中失去一腿，而保險人拒絕賠償， 請問這情況是可行的嗎？","options":[{"letter":"A","text":"可，因保費未繳付"},{"letter":"B","text":"不可，根據「承保商專業守則」 ，未繳付保費也可獲賠償"},{"letter":"C","text":"不可，因某些保險在未繳付保費下仍可生效"},{"letter":"D","text":"可，因安琪缺乏訂立法律關係的意向"}],"answer":"C"},{"id":148,"chapter":"2","ref":"2.1.3(c)","question":"安琪在上機前買保險，保險人同意安琪可回來後才繳付保費，安琪在途中失去一腿，而保險人拒絕賠償， 請問保險人是否有權拒絕賠償？","options":[{"letter":"A","text":"不可以，看不到沒有不完整的合約元素存在"},{"letter":"B","text":"不可以，承保商專業守則不得因遲交保費而拒絕賠償"},{"letter":"C","text":"可以，安琪並沒有支付保費"},{"letter":"D","text":"可以，安琪缺乏訂立法律關係的意向"}],"answer":"B"},{"id":149,"chapter":"2","ref":"2.1.3(c)","question":"在保險合約當中，被保險人所付出的代價是：","options":[{"letter":"A","text":"承諾每年續保"},{"letter":"B","text":"向保險人繳付的保費"},{"letter":"C","text":"只在要約及續保時出現"},{"letter":"D","text":"以上所述各項都不是"}],"answer":"B"},{"id":150,"chapter":"2","ref":"2.1.3(c)","question":"在保險上，代價是由合約的哪方付出？","options":[{"letter":"A","text":"只是被保險人"},{"letter":"B","text":"只是保險人"},{"letter":"C","text":"保險人及被保險人雙方"},{"letter":"D","text":"以上各項都不是"}],"answer":"C"},{"id":151,"chapter":"2","ref":"2.1.3(c)","question":"甚麼是代價？","options":[{"letter":"A","text":"它必須由雙方在合約中訂定"},{"letter":"B","text":"這是合約的一方對另一方的承諾"},{"letter":"C","text":"這是合約的一方對另一方的義務"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":152,"chapter":"2","ref":"2.1.3(d)","question":"訂立合約的法律能力被稱為：","options":[{"letter":"A","text":"代價"},{"letter":"B","text":"訂約的行為能力"},{"letter":"C","text":"合法性"},{"letter":"D","text":"以上各項都是"}],"answer":"B"},{"id":153,"chapter":"2","ref":"2.1.3(d)","question":"以下哪類人士在訂約的行為能力方面可能會受到限制？","options":[{"letter":"A","text":"精神錯亂"},{"letter":"B","text":"未滿十八歲"},{"letter":"C","text":"破產人士"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":154,"chapter":"2","ref":"2.1.3(d)","question":"按照簡單合約，「訂約的行為能力」是指訂立合約的能力，在保險合約方面，這個元素該涉及：","options":[{"letter":"A","text":"投保人及保險人"},{"letter":"B","text":"未滿成年歲數的投保人"},{"letter":"C","text":"投保人，但不一定保險人"},{"letter":"D","text":"保險人，但不一定投保人"}],"answer":"A"},{"id":155,"chapter":"2","ref":"2.1.3(e)","question":"「一份協議的內容必須是合法的」 ，此句子形容合約元素中的哪一項：","options":[{"letter":"A","text":"訂約的行為能力"},{"letter":"B","text":"代價"},{"letter":"C","text":"合法性"},{"letter":"D","text":"訂立法律關係意向"}],"answer":"C"},{"id":156,"chapter":"2","ref":"2.1.3(f)","question":"構成有效的簡單合約，必須符合以下哪項要求？","options":[{"letter":"A","text":"香港身份證"},{"letter":"B","text":"商業登記"},{"letter":"C","text":"簡單的條款及條件"},{"letter":"D","text":"訂立法律關係的意圖"}],"answer":"D"},{"id":157,"chapter":"2","ref":"2.1.3(f)","question":"一份協議是缺乏與另一方訂立法律關係的意向情況下訂立，因此","options":[{"letter":"A","text":"技術上它是合約"},{"letter":"B","text":"技術上它是協議"},{"letter":"C","text":"不能是合約"},{"letter":"D","text":"受屈一方有權索取賠償"}],"answer":"C"},{"id":158,"chapter":"2","ref":"2.1.3(f)","question":"要成為有效的合約，一份協議必須具備訂立法律關係的意向，以下哪項構成有關內容？","options":[{"letter":"A","text":"必須支付代價"},{"letter":"B","text":"在訂立法律關係時沒有明示意向的某種情況下，訂立法律關係的意向是可以由法庭推定的"},{"letter":"C","text":"合約雙方或多方均具有訂立法律關係的意向"},{"letter":"D","text":"訂立法律關係的意向不適用於社交協議"}],"answer":"C"},{"id":159,"chapter":"2","ref":"2.1.3(f)","question":"簡單合約要素具有多種，其中訂立協議雙方明確自己的目的，並知道有關條款具有法律效力，此要素稱為：","options":[{"letter":"A","text":"訂立法律關係的意向"},{"letter":"B","text":"合法性"},{"letter":"C","text":"要約及承約"},{"letter":"D","text":"代價"}],"answer":"A"},{"id":160,"chapter":"2","ref":"2.1.3(f)","question":"在「一般保險」的合約中發生了一些誤解，被保險人希望為他的家居財產投保，但保單保障該建築物的 結構及家居財產，因此這合約便視為「無效」，因為它不符合下列哪項合約的元素？","options":[{"letter":"A","text":"合法性"},{"letter":"B","text":"代價"},{"letter":"C","text":"各方訂約的行為能力"},{"letter":"D","text":"訂立法律關係的意向"}],"answer":"D"},{"id":161,"chapter":"2","ref":"2.1.3(f)","question":"要成為一份有效的合約，在協議訂立的過程中須包括訂立法律關係意向，以下哪項是屬於這方面的意向？","options":[{"letter":"A","text":"這種意向必須在合約文件中列明"},{"letter":"B","text":"所有滿 18 歲這類的合約方須包括這類意向"},{"letter":"C","text":"訂立法律關係的明示意向如在某情況下沒表明，訂立法律關係意向可於法院推定"},{"letter":"D","text":"訂立法律關係意向只適用於商業合約"}],"answer":"D"},{"id":162,"chapter":"2","ref":"2.2","question":"在執行上，以下哪項對代理法規管的描述是正確的︰","options":[{"letter":"A","text":"保險代理人及保險經紀都被視為委托人"},{"letter":"B","text":"只有保險代理人才屬於中介人"},{"letter":"C","text":"委托人對代理人需負上轉承責任"},{"letter":"D","text":"只適用於保險代理人及保險經紀"}],"answer":"C"},{"id":163,"chapter":"2","ref":"2.2","question":"在代理法內，保險代理人或保險經紀是指:","options":[{"letter":"A","text":"只有保險經紀屬於代理人，保險代理人則不是"},{"letter":"B","text":"只有保險代理人屬於代理人，保險經紀則不是"},{"letter":"C","text":"保險代理人及保險經紀兩者都屬於代理人"},{"letter":"D","text":"保險代理人及保險經紀兩者都不屬於代理人"}],"answer":"C"},{"id":164,"chapter":"2","ref":"2.2","question":"以下哪三項對代理法的描述是正確的: i 委託人委託代理人 ii 保險經紀及保險代理人同屬代理人 iii 委託人對代理人需負上轉承責任 iv 只涉及保險經紀及保險代理人","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":165,"chapter":"2","ref":"2.2","question":"根據「代理法」：","options":[{"letter":"A","text":"保險代理人及保險經紀兩者同屬於「代理人」"},{"letter":"B","text":"保險代理人及保險經紀兩者都不屬於「代理人」"},{"letter":"C","text":"保險代理人屬於「代理人」，保險經紀則不屬"},{"letter":"D","text":"保險經紀屬於「代理人」"}],"answer":"A"},{"id":166,"chapter":"2","ref":"2.2(a)","question":"，保險代理人則不屬 對於本地保險中介人：","options":[{"letter":"A","text":"根據定義，所有銀行都是保險中介人"},{"letter":"B","text":"他們只包括保險代理人及其僱員"},{"letter":"C","text":"所有保險上的安排不可能沒有保險中介人的參與"},{"letter":"D","text":"他們包括保險代理人及保險經紀"}],"answer":"D"},{"id":167,"chapter":"2","ref":"2.2(a)","question":"保險代理人受下列哪類人士委托？","options":[{"letter":"A","text":"保險人"},{"letter":"B","text":"保單持有人"},{"letter":"C","text":"保險人及保單持有人"},{"letter":"D","text":"非保險人及保單持有人"}],"answer":"A"},{"id":168,"chapter":"2","ref":"2.2(a)","question":"在代理法中，以下哪項對於保險中介人的描述是正確的？","options":[{"letter":"A","text":"保險經紀是代表保險公司"},{"letter":"B","text":"保險代理人是代表被保險人"},{"letter":"C","text":"保險經紀及保險代理人同屬保險中介人"},{"letter":"D","text":"任何保險的事務都涉及以上兩者"}],"answer":"C"},{"id":169,"chapter":"2","ref":"2.2(a)","question":"保險經紀代表下列哪項人士？ i 受益人 ii 投保人 iii 保險人 iv 被保險人","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"ii, iv"}],"answer":"D"},{"id":170,"chapter":"2","ref":"2.2(b)","question":"代理人如未獲本身委託人的授權採取若干行動,委託人事後仍可給予授權,這種情況可視為:","options":[{"letter":"A","text":"違法"},{"letter":"B","text":"追認"},{"letter":"C","text":"明示代理"},{"letter":"D","text":"必要代理"}],"answer":"B"},{"id":171,"chapter":"2","ref":"2.2(b)","question":"「透過他人行事與自己親自執行並無分別」。這個與以下哪一項是最有關係的法律原則?","options":[{"letter":"A","text":"合約法"},{"letter":"B","text":"代理法"},{"letter":"C","text":"保險人的法律原則"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":172,"chapter":"2","ref":"2.2(b)","question":"某人對經授權的行為產生的約束力：","options":[{"letter":"A","text":"買家當心"},{"letter":"B","text":"最高誠信"},{"letter":"C","text":"委托人無須負責向代理人所授權的行為"},{"letter":"D","text":"透過他人行事與自己親自執行並無分別"}],"answer":"D"},{"id":173,"chapter":"2","ref":"2.2(c)","question":"轉承責任是指：","options":[{"letter":"A","text":"一種共同承擔的責任"},{"letter":"B","text":"一種刑事法律的責任"},{"letter":"C","text":"對他人作為或不作為引起的法律責任"},{"letter":"D","text":"代理人對其委託人所承擔的責任"}],"answer":"C"},{"id":174,"chapter":"2","ref":"2.2(c)","question":"「一種基於與他人存在某種關係而要對該人行為負上責任」的原則稱為：","options":[{"letter":"A","text":"轉承責任"},{"letter":"B","text":"直接責任"},{"letter":"C","text":"替代責任"},{"letter":"D","text":"承接責任"}],"answer":"A"},{"id":175,"chapter":"2","ref":"2.2(c)& 3.1.4(c)","question":"以下哪項有關「直接責任」及「轉承責任」的描述是不正確的？","options":[{"letter":"A","text":"直接責任是指對自己的行為負上責任"},{"letter":"B","text":"直接責任是指對他人的行為負上責任"},{"letter":"C","text":"轉承責任是指對他人行為疏忽所構成的責任負責的"},{"letter":"D","text":"轉承責任是指對他人的行為負上責任"}],"answer":"B"},{"id":176,"chapter":"2","ref":"2.2.1","question":"家庭內的安排，例如替媽媽做家務的協定：","options":[{"letter":"A","text":"是一份道德上的合約"},{"letter":"B","text":"通常不構成一份合約"},{"letter":"C","text":"只在涉及報酬的情況下才屬於一份合約"},{"letter":"D","text":"當該安排以書面形式表達時才構成一份合約"}],"answer":"B"},{"id":177,"chapter":"2","ref":"2.2.1& 6.2.1(a)","question":"保險代理人安排一份人壽保險合約時，所涉及的法律範圍包括：","options":[{"letter":"A","text":"代理法"},{"letter":"B","text":"合約法"},{"letter":"C","text":"「保險業條例」的條款"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":178,"chapter":"2","ref":"2.2.1","question":"要構成代理關係，下列哪項必須存在?","options":[{"letter":"A","text":"該代理關係是通過法律認可方式產生的"},{"letter":"B","text":"訂立法律關係的意向"},{"letter":"C","text":"代理關係是受到一份代理合約所支配"},{"letter":"D","text":"代價"}],"answer":"A"},{"id":179,"chapter":"2","ref":"2.2.1","question":"保險代理人履行職務安排一份保險時，便需考慮兩份合約，其中一份存在於保險代理人與有關保險人 之間，另一份則存在於：","options":[{"letter":"A","text":"保險代理人與第三者之間"},{"letter":"B","text":"保險人與保單持有人之間"},{"letter":"C","text":"保險代理人與保險業監管局保險業監管局之間"},{"letter":"D","text":"保險人與保險業監管局保險業監管局之間"}],"answer":"B"},{"id":180,"chapter":"2","ref":"2.2.1","question":"當保險代理人替保險人為投保人安排保險，我們可以說當中出現 2 份合約，其中一份在予保險人及投保 人之間，而另外一份合約是：","options":[{"letter":"A","text":"在予保險人及保險業監管局保險業監管局之間"},{"letter":"B","text":"在予投保人及再保險人之間"},{"letter":"C","text":"在予保險代理人及保險人之間"},{"letter":"D","text":"在予投保人及代理人之間"}],"answer":"C"},{"id":181,"chapter":"2","ref":"2.2.2","question":"委托人可透過甚麼途徑委任代理人？","options":[{"letter":"A","text":"通過協議"},{"letter":"B","text":"以隱含方式"},{"letter":"C","text":"以事後確認方式"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":182,"chapter":"2","ref":"2.2.2","question":"代理關係可以透過以下哪項訂立？ i 明示協議 ii 隱含協議 iii 緊急的代理關係 iv 代理人的錯誤事故","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"A"},{"id":183,"chapter":"2","ref":"2.2.2(b)","question":"對代理人追認意味著：","options":[{"letter":"A","text":"代理人確認其過去的行為"},{"letter":"B","text":"代理人獲償付所有開支"},{"letter":"C","text":"委托人授權從「過去」某時起計算"},{"letter":"D","text":"委托人對代理人的合約不需負上任何法律責任，除非代理人後來追認"}],"answer":"C"},{"id":184,"chapter":"2","ref":"2.2.2(b)","question":"2.2.2(b) 產生之代理關係稱為： 以下哪項正確描述委託人追認並確認對代理人的關係？","options":[{"letter":"A","text":"委託人有效地「追溯」與某人的代理關係"},{"letter":"B","text":"代理人在行事之前已得到委託人的明示權限"},{"letter":"C","text":"代理人曾在緊急的情況下替委託人行事"},{"letter":"D","text":"代理人以往亦曾在沒有得到授權的情況下替委託人做過類似的事情"}],"answer":"A"},{"id":185,"chapter":"2","ref":"2.2.2(b)","question":"委託人追認其代理人的行為意味着:","options":[{"letter":"A","text":"有關的代理協定的終結"},{"letter":"B","text":"該代理人將無權取得任何佣金"},{"letter":"C","text":"該委託人以「追溯」形式授權有關行為"},{"letter":"D","text":"該委託人拒絕為代理人的行為負上責任"}],"answer":"C"},{"id":186,"chapter":"2","ref":"2.2.2(b)","question":"事後批准一些之前並未獲授權的行為，這種做法稱為：","options":[{"letter":"A","text":"違法"},{"letter":"B","text":"追認"},{"letter":"C","text":"表面權限的代理關係"},{"letter":"D","text":"不容反悔的代理權"}],"answer":"B"},{"id":187,"chapter":"2","ref":"2.2.2(b)","question":"他人為某人本身採取某些行動，這人可以批准這些行動，並事後確認這個情況，在代理法下，這表示:","options":[{"letter":"A","text":"追認"},{"letter":"B","text":"確認"},{"letter":"C","text":"明示的代理權限"},{"letter":"D","text":"必要的代理權限"}],"answer":"A"},{"id":188,"chapter":"2","ref":"2.2.3","question":"為他人採取緊急行動，並於行動時未獲他人同意 ，在此情況下產生以下那種代理關係？","options":[{"letter":"A","text":"追認"},{"letter":"B","text":"確認"},{"letter":"C","text":"必要權限"},{"letter":"D","text":"表面權限"}],"answer":"C"},{"id":189,"chapter":"2","ref":"2.2.3","question":"以下哪項是指「明示權根」？","options":[{"letter":"A","text":"以口頭以外的形式發出"},{"letter":"B","text":"必須以書面的合約形式發出"},{"letter":"C","text":"以合約蓋章形式"},{"letter":"D","text":"明確說明代理人的責任"}],"answer":"D"},{"id":190,"chapter":"2","ref":"2.2.3","question":"「明示實際權限」是代表：","options":[{"letter":"A","text":"得到書面的授權"},{"letter":"B","text":"僅得到一份書面的授權"},{"letter":"C","text":"可以是書面或口頭的授權"},{"letter":"D","text":"只是得到口頭的授權"}],"answer":"C"},{"id":191,"chapter":"2","ref":"2.2.3","question":"有一日某人在街上發現了一條昂貴的純種狗,他很努力地尋找失主。幾天後,他尋找到失主,他在照顧這狗隻 期間的狗糧費用、獸醫費用,涉及相當數量的金錢, 他爭辯有權向 失主取回這些相關費用。因為他在照顧 狗隻期間可被稱為","options":[{"letter":"A","text":"追認代理人"},{"letter":"B","text":"必要代理人"},{"letter":"C","text":"明示代理人"},{"letter":"D","text":"不容反悔代理人"}],"answer":"B"},{"id":192,"chapter":"2","ref":"2.2.3","question":"在沒有獲授權的情況下，為另一方作了某些事情，而該行為是基於合理及必要，在此情況下，這人便成為：","options":[{"letter":"A","text":"不容反悔代理人"},{"letter":"B","text":"明示權限代理人"},{"letter":"C","text":"必要代理人"},{"letter":"D","text":"實際權限代理人"}],"answer":"C"},{"id":193,"chapter":"2","ref":"2.2.3(a)","question":"委託人明示或隱含地向代理人表明同意代理人代表委託人或替其行事，是屬於下列哪項代理人的權限：","options":[{"letter":"A","text":"實際權限"},{"letter":"B","text":"表面權限"},{"letter":"C","text":"必要權限"},{"letter":"D","text":"不容反悔的代理權"}],"answer":"A"},{"id":194,"chapter":"2","ref":"2.2.3(b)","question":"在代理法中，「表面權限」是指：","options":[{"letter":"A","text":"權限不存在"},{"letter":"B","text":"代理人的行為可訂立一份或一宗對委託人有約束力的合約或交易"},{"letter":"C","text":"代理人已獲得明確的指示行事"},{"letter":"D","text":"所有情況下顯示實際權限已經存在"}],"answer":"B"},{"id":195,"chapter":"2","ref":"2.2.3(b)","question":"以下哪項是對「表面授權」的正確描述？","options":[{"letter":"A","text":"這是不可能的"},{"letter":"B","text":"法律上是不容許的"},{"letter":"C","text":"以口頭或書面形式作出授權"},{"letter":"D","text":"委託人以行為表明同意代理人已獲授權"}],"answer":"D"},{"id":196,"chapter":"2","ref":"2.2.3(b)","question":"在代理法中，「表面授權」是指：","options":[{"letter":"A","text":"沒有授權"},{"letter":"B","text":"代理人在欺騙客戶"},{"letter":"C","text":"代理人獲明確指示行事"},{"letter":"D","text":"代理關係可以透過委托人行為來推斷"}],"answer":"D"},{"id":197,"chapter":"2","ref":"2.2.3(c)","question":"某人在某時為他人的最佳利益而行事，雖然他事前並沒有獲得授權，但在法律上卻持有這權限，並被視為：","options":[{"letter":"A","text":"必要代理人"},{"letter":"B","text":"緊急情況下代理人"},{"letter":"C","text":"具有追溯性的授權的代理人"},{"letter":"D","text":"自動獲授權的代理人"}],"answer":"A"},{"id":198,"chapter":"2","ref":"2.2.3(c)","question":"在人道或合理的原因下，某人承擔或支付代理另一人行事的開支，則即使他人沒有在產生開支期間或之後 授權，此人成為他人代理人，這是基於以下那種代理關係？","options":[{"letter":"A","text":"不容反悔"},{"letter":"B","text":"明示權限"},{"letter":"C","text":"必要代理"},{"letter":"D","text":"表面權限"}],"answer":"C"},{"id":199,"chapter":"2","ref":"2.2.3(c)","question":"「必要代理人」是指一名代理人，他：","options":[{"letter":"A","text":"替一名未成年人士行事(未滿 18 歲)"},{"letter":"B","text":"已經取得明示(書面或口頭)指令"},{"letter":"C","text":"事後被有關委托人追認為代理人"},{"letter":"D","text":"因當時情況所需而無可非議地為另一人行事"}],"answer":"D"},{"id":200,"chapter":"2","ref":"2.2.3(d)","question":"假如保險人根據被保險人的行為，合理地推斷(其實未獲授權)一名事務律師獲得授權替被保險人行事， 根據以下哪項法則，被保險人會受到事務律師的行為所約束？","options":[{"letter":"A","text":"明示權限"},{"letter":"B","text":"不容反悔代理權"},{"letter":"C","text":"必要權限"},{"letter":"D","text":"追認權限"}],"answer":"B"},{"id":201,"chapter":"2","ref":"2.2.3(d)","question":"如果第三者根據假定委托人的行為，覺得(其實未獲授權)假定代理人具備權限代表委托人行事，這代理 關係適用於？","options":[{"letter":"A","text":"明示實際權限"},{"letter":"B","text":"不容反悔代理權"},{"letter":"C","text":"必要權限"},{"letter":"D","text":"追認"}],"answer":"B"},{"id":202,"chapter":"2","ref":"2.2.3(d)","question":"「不容反悔」的代理關係是來自:","options":[{"letter":"A","text":"明示權限"},{"letter":"B","text":"法定條文"},{"letter":"C","text":"事後對代理人的行為所作的確認"},{"letter":"D","text":"據稱的委託人的行為"}],"answer":"D"},{"id":203,"chapter":"2","ref":"2.2.3(d)","question":"「不容反悔」是基於：","options":[{"letter":"A","text":"明示權限"},{"letter":"B","text":"書面授權"},{"letter":"C","text":"事後追溯性授權"},{"letter":"D","text":"假定委托人行為"}],"answer":"D"},{"id":204,"chapter":"2","ref":"2.2.4","question":"以下哪項不屬於代理人對委托人的責任？","options":[{"letter":"A","text":"遵從指示"},{"letter":"B","text":"親自執行"},{"letter":"C","text":"所有帳目必須以電腦形式記錄"},{"letter":"D","text":"必須保存與代理業務有關的足夠紀錄"}],"answer":"C"},{"id":205,"chapter":"2","ref":"2.2.4","question":"以下哪項不是代理人向委托人負上的責任？","options":[{"letter":"A","text":"遵行其委託人所有合法的指示"},{"letter":"B","text":"代理人要忠心與誠信"},{"letter":"C","text":"代理人只向委托人介紹有利可圖的生意"},{"letter":"D","text":"代理人沒有權利將責任下放給他人, 除非得到這樣的權限"}],"answer":"C"},{"id":206,"chapter":"2","ref":"2.2.4(a)","question":"代理人必須亳無保留地或盡最大可能服從及履行：","options":[{"letter":"A","text":"本身委托人的一切指示"},{"letter":"B","text":"本身委托人的一切合法指示"},{"letter":"C","text":"自己喜歡執行的指示而已"},{"letter":"D","text":"本身的委托人以書面方式提出的指示而己"}],"answer":"B"},{"id":207,"chapter":"2","ref":"2.2.4","question":"代理人對委托人的責任包括？ i 遵從 ii 忠心與誠信 iii 報帳 iv 承擔委托人的所有合理開支","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"A"},{"id":208,"chapter":"2","ref":"2.2.4","question":"代理人對委托人的責任包括？ i 遵從 ii 親自執行／不可下放給別人 iii 為委托人爭取最佳利益 iv 保存清楚帳目","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"B"},{"id":209,"chapter":"2","ref":"2.2.4(b)","question":"一位代理人何時可將責任下放予分代理人？","options":[{"letter":"A","text":"只要他願意隨時也可"},{"letter":"B","text":"他認為合理便可"},{"letter":"C","text":"除非他具有這樣的權限"},{"letter":"D","text":"當他收到委托人及分代理人的雙份佣金之後"}],"answer":"C"},{"id":210,"chapter":"2","ref":"2.2.4(c)","question":"如果一名代理人未能履行「應有的謹慎」的責任，而最後令委托人蒙受損失的話，該名委托人:","options":[{"letter":"A","text":"擁有向該名代理人追償的權利"},{"letter":"B","text":"不會擁有任何補救"},{"letter":"C","text":"惟有在該代理人作出過詐騙行為時才可向該名代理人追償"},{"letter":"D","text":"只能追償該名代理人所引致損失的 50%，理由是「均等便是公平」"}],"answer":"A"},{"id":211,"chapter":"2","ref":"2.2.4(e)","question":"以下哪項或哪些有關代理人的“報賬”的評論是正確的？","options":[{"letter":"A","text":"它必須對替本身委托人所收取所有的金錢報賬"},{"letter":"B","text":"它必須保存足夠與代理業務有關的記錄"},{"letter":"C","text":"它必須對以委托人的名義所收取的其他所有物件報賬"},{"letter":"D","text":"以上所有評論都是正確"}],"answer":"D"},{"id":212,"chapter":"2","ref":"2.2.4(e)","question":"代理人須向其委託人負上「報賬」的責任是指代理人必須對所收取的所有金錢報賬，並且","options":[{"letter":"A","text":"只可間中地提供回佣"},{"letter":"B","text":"足夠地備存與代理業務有關的記錄"},{"letter":"C","text":"用書面記錄每次與委託人的認真溝通"},{"letter":"D","text":"在收取金錢的三天內，向委託人轉付該筆金錢"}],"answer":"B"},{"id":213,"chapter":"2","ref":"2.2.5","question":"委托人對代理人應付的責任包括以下哪項？","options":[{"letter":"A","text":"利潤保證"},{"letter":"B","text":"同意按照相關行業標準支付薪酬"},{"letter":"C","text":"支付費用乃合理地及正常地替委托人所招致"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":214,"chapter":"2","ref":"2.2.5","question":"委托人對代理人的責任不包括：","options":[{"letter":"A","text":"給付合理的報酬"},{"letter":"B","text":"承擔代理人行事時所有合理成本及開支"},{"letter":"C","text":"履行對代理人的義務"},{"letter":"D","text":"保証代理人的佣金每年遞增"}],"answer":"D"},{"id":215,"chapter":"2","ref":"2.2.5","question":"以下那項對委托人支付給代理人之報酬的描述是正確的：","options":[{"letter":"A","text":"不包括佣金"},{"letter":"B","text":"經由有關的行業或機構設定的計算表計算"},{"letter":"C","text":"在該財政年度完結時支付"},{"letter":"D","text":"須於合理時間或任何指定的期限內支付"}],"answer":"D"},{"id":216,"chapter":"2","ref":"2.2.5","question":"在一份代理合約沒有特別制定下，以下哪項或哪些是有關代理人有權得到：","options":[{"letter":"A","text":"為委託人辦事而涉及的合理支出"},{"letter":"B","text":"所有辦公室的支出"},{"letter":"C","text":"以每月或更頻密的頻率收取報酬"},{"letter":"D","text":"以上各項"}],"answer":"A"},{"id":217,"chapter":"2","ref":"2.2.5(a)","question":"代理人有權收取雙方協議的佣金或其他報酬，委托人須於何時支付給代理人？ i 合理時間內 ii 任何指定期限內 iii 每個月發放 iv 每年發放","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"A"},{"id":218,"chapter":"2","ref":"2.2.5(b)","question":"除保險代理合約另外指明，委托人必須償付代理人以下哪項支出？","options":[{"letter":"A","text":"任何種類的支出"},{"letter":"B","text":"包括代理人的行政開支的支出"},{"letter":"C","text":"代理人替委托人行事時適當及合理的費用及開支"},{"letter":"D","text":"代理人替委托人取回款項的 50%為上限"}],"answer":"C"},{"id":219,"chapter":"2","ref":"2.2.6","question":"如果個人代理人辭世，其與委託人的代理關係：","options":[{"letter":"A","text":"自動終止"},{"letter":"B","text":"自動傳與其繼承人"},{"letter":"C","text":"在其遺囑訂明下才傳給其繼承人"},{"letter":"D","text":"在其委託人書面通知下才終止"}],"answer":"A"},{"id":220,"chapter":"2","ref":"2.2.6","question":"如果代理人或委託人其中一方違反代理合約，其代理關係可以透過以下哪個途徑終止：","options":[{"letter":"A","text":"追認"},{"letter":"B","text":"不容反悔"},{"letter":"C","text":"違反"},{"letter":"D","text":"得到雙方同意"}],"answer":"C"},{"id":221,"chapter":"2","ref":"2.2.6","question":"以下哪一個原因不足以令代理關係終止？","options":[{"letter":"A","text":"雙方同意"},{"letter":"B","text":"大額索償"},{"letter":"C","text":"其中一方辭世"},{"letter":"D","text":"違反協議"}],"answer":"B"},{"id":222,"chapter":"2","ref":"2.2.6","question":"以下哪項會導致終止代理關係？ i 雙方同意 ii 撤銷協議 iii 其中一方辭世 iv 精神錯亂","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":223,"chapter":"2","ref":"2.2.6","question":"需要甚麼規定才能延續一份為期一年的協議？","options":[{"letter":"A","text":"只需委托人同意便可"},{"letter":"B","text":"只需代理人同意便可"},{"letter":"C","text":"需在委托人及代理人雙方同意下才可廷續"},{"letter":"D","text":"自動廷續"}],"answer":"C"},{"id":224,"chapter":"2","ref":"2.2.6(a)","question":"雙方同意終止代理合約：","options":[{"letter":"A","text":"是必然可行的"},{"letter":"B","text":"除非合約有特別規定，否則是不容許"},{"letter":"C","text":"必須牽涉向代理人提供金錢賠償"},{"letter":"D","text":"足以令與第三者所訂立之所有合約無效"}],"answer":"A"},{"id":225,"chapter":"2","ref":"2.2.6","question":"以下那項為保險代理關係終止的途徑？","options":[{"letter":"A","text":"撤銷"},{"letter":"B","text":"衝突"},{"letter":"C","text":"不忠誠"},{"letter":"D","text":"以上各項皆是"}],"answer":"A"},{"id":226,"chapter":"2","ref":"2.2.6(a)","question":"在雙方同意下，代理關係可否終止？","options":[{"letter":"A","text":"要在合約條款中聲明才可"},{"letter":"B","text":"通常可行"},{"letter":"C","text":"委托人要向代理人賠償金錢才可"},{"letter":"D","text":"不可，因這樣會影響與第三者現存之合約"}],"answer":"B"},{"id":227,"chapter":"2","ref":"2.2.6(b)","question":"在以下哪種情況下，代理人可提出撤銷協議？","options":[{"letter":"A","text":"這未被明文所限制"},{"letter":"B","text":"當中須根據合約中有關給予通知及/或補償的條款進行"},{"letter":"C","text":"委託人曾經違反合約條件"},{"letter":"D","text":"委託人已經精神錯亂"}],"answer":"B"},{"id":228,"chapter":"2","ref":"2.2.6(b)","question":"在給予通知及/或代價補償的合約條文下，協議可在何時撤銷？","options":[{"letter":"A","text":"在協議生效時間前"},{"letter":"B","text":"在協議生效時間內"},{"letter":"C","text":"在協議生效的頭七天內取消"},{"letter":"D","text":"協議在任何時間都不能取消"}],"answer":"B"},{"id":229,"chapter":"2","ref":"2.2.6(b)","question":"撤銷一項代理協議，是指該協議在它的生效期內：","options":[{"letter":"A","text":"可被取消"},{"letter":"B","text":"必須每年續約"},{"letter":"C","text":"由委託人追認"},{"letter":"D","text":"暫停一段時間後巳經恢復生效"}],"answer":"A"},{"id":230,"chapter":"2","ref":"2.2.6(b)","question":"下列哪種情況下，代理人可撤銷代理協議？","options":[{"letter":"A","text":"這未被明文禁止"},{"letter":"B","text":"包含一項取消條文"},{"letter":"C","text":"委託人已違反協議"},{"letter":"D","text":"委託人已經精神錯亂"}],"answer":"B"},{"id":231,"chapter":"2","ref":"2.2.6(b)","question":"於合約條款中,那方可在協議有效期間內撤銷協議?","options":[{"letter":"A","text":"委託人,不是代理人"},{"letter":"B","text":"代理人,不是委託人"},{"letter":"C","text":"委託人或代理人"},{"letter":"D","text":"不是委託人,也不是代理人"}],"answer":"C"},{"id":232,"chapter":"2","ref":"2.2.6(c)","question":"若果代理人或委托人違反協議，另一方可採取甚麼行動？ i 終止合約 ii 要求賠償 iii 合約可以維持一段時間","options":[{"letter":"A","text":"i"},{"letter":"B","text":"ii"},{"letter":"C","text":"i, ii"},{"letter":"D","text":"i, ii, iii"}],"answer":"C"},{"id":233,"chapter":"2","ref":"2.2.6(c)","question":"如委託人或代理人任何一方基本地違反，可以是：","options":[{"letter":"A","text":"袛有委託人一方可取消協議內容"},{"letter":"B","text":"袛有代理人一方可取消協議內容"},{"letter":"C","text":"無論任何情況下，代理關係必須直至期滿後方可取消，但受屈一方可提出追討損害賠償"},{"letter":"D","text":"受屈一方可即時提出終止關係"}],"answer":"D"},{"id":234,"chapter":"2","ref":"2.2.6(c)","question":"若委托人對其代理人作出違反責任的行為，下列哪項情況被視為正確？","options":[{"letter":"A","text":"此乃屬於刑事罪行"},{"letter":"B","text":"在法律上，代理人沒有追討權"},{"letter":"C","text":"代理人可以運用其法律權利向委託人採取行動"},{"letter":"D","text":"所有經此代理人而辦理的保單變為失效"}],"answer":"C"},{"id":235,"chapter":"2","ref":"2.2.6(c)","question":"代理人可引用以下哪項或哪些理由終止代理協議？","options":[{"letter":"A","text":"委託人已到達退休年齡"},{"letter":"B","text":"委託人基本地違反該項協議"},{"letter":"C","text":"委託人成為了一家有限公司"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":236,"chapter":"2","ref":"2.2.6(d)","question":"如果代理人是屬於公司性質，而公司正處於清盤階段，與有關委托人的代理協議：","options":[{"letter":"A","text":"便告自動終止"},{"letter":"B","text":"便可供公司的清盤人購買"},{"letter":"C","text":"便可供公司的任何股東購買"},{"letter":"D","text":"便自動轉予公司的前常務董事"}],"answer":"A"},{"id":237,"chapter":"2","ref":"2.2.6(e)","question":"以下哪項或哪些關於死亡或清盤而終止代理人合約的論述是正確的?","options":[{"letter":"A","text":"委託人死亡可構成有效的原因"},{"letter":"B","text":"代理人死亡可構成有效的原因"},{"letter":"C","text":"委託人的法團或代理人清盤可構成有效的原因"},{"letter":"D","text":"以上各項皆屬正確"}],"answer":"D"},{"id":238,"chapter":"2","ref":"2.2.6(e)","question":"以下哪項或哪些有關由於精神錯亂而導致代理關係的終止的描述是正確的?","options":[{"letter":"A","text":"只有代理人可終止而不能是委托人"},{"letter":"B","text":"只有委托人一方可終止而不能是代理人"},{"letter":"C","text":"代理人和委托人(自然人)均可終止"},{"letter":"D","text":"代理人和委托人均沒有權利終止"}],"answer":"C"},{"id":239,"chapter":"2","ref":"2.2.6(e)","question":"以下哪方或哪一方精神錯亂可構成終止保險代理合約？","options":[{"letter":"A","text":"委托人(自然人)"},{"letter":"B","text":"代理人(法定團体)的董事"},{"letter":"C","text":"委托人(法定團体)的常務董事"},{"letter":"D","text":"以上任何一方"}],"answer":"A"},{"id":240,"chapter":"2","ref":"2.2.6(e)","question":"如果代理人一方出現精神錯亂(insanity)，意味著：","options":[{"letter":"A","text":"委托人可終止與代理人的合約"},{"letter":"B","text":"委托人需與代理人保持合約直至康復"},{"letter":"C","text":"委托人需與代理人保持的合約傳予代理人的家人"},{"letter":"D","text":"以上各項都不是"}],"answer":"A"},{"id":241,"chapter":"2","ref":"2.2.6(e)","question":"在終止代理關係的範圍中，「精神錯亂」只適合應用於：","options":[{"letter":"A","text":"代理人(自然人)"},{"letter":"B","text":"委托人"},{"letter":"C","text":"代理人或委托人"},{"letter":"D","text":"代理人或經紀"}],"answer":"C"},{"id":242,"chapter":"2","ref":"2.2.6(e)","question":"若保險代理人精神錯亂：","options":[{"letter":"A","text":"保險人有權終止保險代理協議"},{"letter":"B","text":"保險代理的近親可自動成為保險代理人"},{"letter":"C","text":"保險人必須維持代理合約直至保險代理人康復為止"},{"letter":"D","text":"保險人必須繼續發放佣金給代理人"}],"answer":"A"},{"id":243,"chapter":"2","ref":"2.2.6(f)","question":"如有一份代理關係協定為期一年，但因為法律上的改變，該關係建立了後的 6 個月變為非法，那麼:","options":[{"letter":"A","text":"該協議即時終止"},{"letter":"B","text":"該協議必須維持至該限期才能終止"},{"letter":"C","text":"如其中一方提出，該協議便會終止"},{"letter":"D","text":"該協議須由雙方同意下才可終止"}],"answer":"A"},{"id":244,"chapter":"2","ref":"2.2.6(f)","question":"一項合法的代理關係原本訂定為期一年，但由於法例於該代理關係開始六個月後有所改變，導致該代理 關係的內容違反法例，此情況下：","options":[{"letter":"A","text":"該項代理關係即時終止"},{"letter":"B","text":"合約雙方同意下，該代理關係可隨時終止"},{"letter":"C","text":"於合約結束後即時終止"},{"letter":"D","text":"該關係依舊維持"}],"answer":"A"},{"id":245,"chapter":"2","ref":"2.2.6(g)","question":"如委托人及代理人之間的協議只在一年內有效，在期限屆滿時，協議會怎麼樣？","options":[{"letter":"A","text":"期限屆滿時，協議便終止"},{"letter":"B","text":"如委托人同意，協議可繼續生效"},{"letter":"C","text":"期限屆滿後，協議會自動繼續生效"},{"letter":"D","text":"代理人可單方面使協議繼續生效"}],"answer":"A"},{"id":246,"chapter":"3","ref":"3","question":"可保權益及最高誠信適用於下列哪項合約？","options":[{"letter":"A","text":"一般保險合約而已"},{"letter":"B","text":"長期保險合約而已"},{"letter":"C","text":"所有保險合約"},{"letter":"D","text":"不適用於任何保險合約"}],"answer":"C"},{"id":247,"chapter":"3","ref":"3","question":"於一般保險中，理賠時不需考慮下列哪項？","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"分擔"},{"letter":"C","text":"彌償"},{"letter":"D","text":"未繳清的保費"}],"answer":"D"},{"id":248,"chapter":"3","ref":"3.1","question":"以下哪項是對可保權益的不正確陳述？","options":[{"letter":"A","text":"適用於所有類型保險"},{"letter":"B","text":"通常形容與保險標的有財務上的關係"},{"letter":"C","text":"如保單持有人作為保險標的之人壽保險時，並不適用"},{"letter":"D","text":"與保險標的的關係必須為法律上可認可的"}],"answer":"C"},{"id":249,"chapter":"3","ref":"3.1","question":"若要具備可保權益，以下那項並非必要條件？","options":[{"letter":"A","text":"財物必須是可保的"},{"letter":"B","text":"財物為保險的標的物"},{"letter":"C","text":"就財產保險而言，保單持有人必須該國的公民"},{"letter":"D","text":"具法律上認可關係"}],"answer":"C"},{"id":250,"chapter":"3","ref":"3.1","question":"以下哪項/哪些對財產可保權益的描述是正確的?","options":[{"letter":"A","text":"投保人需為財產擁有人"},{"letter":"B","text":"投保人需實質擁有該財產"},{"letter":"C","text":"投保人不一定需要是財產擁有人"},{"letter":"D","text":"以上所列各項皆是"}],"answer":"D"},{"id":251,"chapter":"3","ref":"3.1","question":"一事物是可受保的，而且是保險標的，投保人與該事物有法律認可關係，這描述完全屬於哪項原則？","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"可保權益"},{"letter":"C","text":"近因"},{"letter":"D","text":"最高誠信"}],"answer":"B"},{"id":252,"chapter":"3","ref":"3.1","question":"以下哪項不是可保權益的先決條件?","options":[{"letter":"A","text":"對保險標的一種法律認可關係"},{"letter":"B","text":"保險標的是屬於可受保的"},{"letter":"C","text":"保險標的是屬於法律責任，財產或法律權利"},{"letter":"D","text":"物件必須是保險的標的"}],"answer":"C"},{"id":253,"chapter":"3","ref":"3.1&3.4","question":"彌償及可保權益這兩個保險原則：","options":[{"letter":"A","text":"完全相同的"},{"letter":"B","text":"互不相干的"},{"letter":"C","text":"與近因關係非常密切"},{"letter":"D","text":"有共同基礎，均涉及被保險人財產權益"}],"answer":"D"},{"id":254,"chapter":"3","ref":"3.1&3.4","question":"彌償及可保權益兩個原則的關係：","options":[{"letter":"A","text":"均與財務利益有密切關係"},{"letter":"B","text":"兩者完全沒有共通之處"},{"letter":"C","text":"意向完全不同"},{"letter":"D","text":"尋求真正造成損失且具有影響力的原因"}],"answer":"A"},{"id":255,"chapter":"3","ref":"3.1.1","question":"以下哪項是一種對標的的法律認可關係？","options":[{"letter":"A","text":"可保權益"},{"letter":"B","text":"代位"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"比例分攤"}],"answer":"A"},{"id":256,"chapter":"3","ref":"3.1.1","question":"3.1.1 投買保險，如果投保損失發生： 以下哪些不符合「可保權益」的定義？","options":[{"letter":"A","text":"有可受保的人"},{"letter":"B","text":"有關人和物必須為保險的標的"},{"letter":"C","text":"必須構成財務損失"},{"letter":"D","text":"替盜賊偷回來的財物投買保險"}],"answer":"D"},{"id":257,"chapter":"3","ref":"3.1.1","question":"一種賦予某人可為自己的財物產物，購買保障的是：","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"分擔"},{"letter":"C","text":"可保權益"},{"lett

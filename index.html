t":"不屬於保險人或被保險人"},{"letter":"D","text":"按保險人指明的慈善機構"}],"answer":"B"},{"id":564,"chapter":"3","ref":"3.6.4(b)(i)","question":"對於一只遺失的指環的 ”全險” 索償，按照保額的 5 萬元如數結清。該指環稍後時間尋回並以 6 萬元售 出。在代位的原則下，該 1 萬元的利潤：","options":[{"letter":"A","text":"屬於保險人"},{"letter":"B","text":"屬於被保險人"},{"letter":"C","text":"由保險人及被保險人平均分享"},{"letter":"D","text":"給付由保險人指明的慈善機構"}],"answer":"B"},{"id":565,"chapter":"3","ref":"3.6.4(b)","question":"關於代位的補償上，以下哪兩項是正確的陳述？ (iii) i 代位權出現的收益歸於被保險人 ii 可以給提供彌償的保險人損失的補償 iii 若代位權出現於財產被委付後，保險人可以取多於損失的 100% iv 被保人及保險人可以各 50%分享索償","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, iii"},{"letter":"D","text":"iii, iv"}],"answer":"B"},{"id":566,"chapter":"4","ref":"4.1","question":"產品開發部門的主要功能可以是： i 公共關係 ii 個別產品的開發 iii 產品組合的開發 iv 產品的研究","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":567,"chapter":"4","ref":"4.1(a)","question":"保險新產品的「具競爭力的壽命」可以說是：","options":[{"letter":"A","text":"很短，可能只有數星期或幾個月"},{"letter":"B","text":"約一年"},{"letter":"C","text":"在競爭對手把焦點放於新產品前至少 2 年時間"},{"letter":"D","text":"沒有限制"}],"answer":"A"},{"id":568,"chapter":"4","ref":"4.1(a)","question":"對於保險人，產品的開發：","options":[{"letter":"A","text":"是一種延續不斷的過程"},{"letter":"B","text":"對大型保險人來說並無必要"},{"letter":"C","text":"對強制性的業務並無必要"},{"letter":"D","text":"在敲定了保單的用字後便不再需要"}],"answer":"A"},{"id":569,"chapter":"4","ref":"4.1(b)","question":"市場上以「組合」形式推出的產品很多，這是屬於產品發展的什麼過程？","options":[{"letter":"A","text":"個別產品的開發"},{"letter":"B","text":"產品組合的開發"},{"letter":"C","text":"產品的研究"},{"letter":"D","text":"獨立產品的開發"}],"answer":"B"},{"id":570,"chapter":"4","ref":"4.1(b)","question":"以「組合」形式出現的保險開發，尤其針對大型客戶而設的，可以理解為：","options":[{"letter":"A","text":"產品的開發"},{"letter":"B","text":"產品集體的開發"},{"letter":"C","text":"團體的開發"},{"letter":"D","text":"產品組合的開發"}],"answer":"D"},{"id":571,"chapter":"4","ref":"4.1(c)","question":"產品的研究應從以下哪方面作出考慮？","options":[{"letter":"A","text":"公司原有產品"},{"letter":"B","text":"競爭對手的產品"},{"letter":"C","text":"公司及競爭對手的產品"},{"letter":"D","text":"公司原有、競爭對手的產品以及市場趨勢"}],"answer":"D"},{"id":572,"chapter":"4","ref":"4.2","question":"客戶服務部若以職能界定來說也稱為：","options":[{"letter":"A","text":"顧客服務部"},{"letter":"B","text":"客戶投訴部"},{"letter":"C","text":"客戶諮詢中心"},{"letter":"D","text":"顧客溝通及投訴"}],"answer":"A"},{"id":573,"chapter":"4","ref":"4.2","question":"以下哪項屬於客戶服務部的職能範圍？ i 聯絡 ii 公共關係 iii 賠償的談判 iv 處理投訴","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"B"},{"id":574,"chapter":"4","ref":"4.2","question":"投訴、聯絡、提供文件及公共關係的職務屬於那個部門負責?","options":[{"letter":"A","text":"核保部"},{"letter":"B","text":"客戶服務部"},{"letter":"C","text":"行銷及推廣部"},{"letter":"D","text":"產品開發部"}],"answer":"B"},{"id":575,"chapter":"4","ref":"4.2","question":"為何「客戶服務」這麼重要？","options":[{"letter":"A","text":"對客戶有深遠的影響"},{"letter":"B","text":"受到傳媒及政府的關注"},{"letter":"C","text":"投訴可達到公司較高管理層"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":576,"chapter":"4","ref":"4.3","question":"對於公共關係、贊助及廣告是屬於下列哪個部門的職務？","options":[{"letter":"A","text":"核保"},{"letter":"B","text":"保單銷售"},{"letter":"C","text":"保單處理"},{"letter":"D","text":"市場行銷及促銷部門"}],"answer":"D"},{"id":577,"chapter":"4","ref":"4.3(a)","question":"一家典型保險公司的公共關係部負責處理頗多類型的事務，下列哪項則不屬於它的範圍之內？","options":[{"letter":"A","text":"協調對外的聯繫工作"},{"letter":"B","text":"參予繁多的產品的研究"},{"letter":"C","text":"召開記者招待會以作出發佈消息或解釋"},{"letter":"D","text":"工商界及其他雜誌報章準備新聞稿及副本"}],"answer":"B"},{"id":578,"chapter":"4","ref":"4.3(a)","question":"市場行銷及促銷部主要負責哪項或哪些職務?","options":[{"letter":"A","text":"協調對外的聯繫"},{"letter":"B","text":"協調媒介的查詢及採訪"},{"letter":"C","text":"準備新聞稿及副本予工商界及其他雜誌報章"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":579,"chapter":"4","ref":"4.3(c)","question":"廣告是很重要的環節，促銷及行銷部的廣告職能是：","options":[{"letter":"A","text":"挑選外面的代理機構"},{"letter":"B","text":"協調廣告活動"},{"letter":"C","text":"研究採用電視或其他媒介的程度"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":580,"chapter":"4","ref":"4.3(e)","question":"市場行銷部不斷地監察當前及潛在的市場，這過程稱為：","options":[{"letter":"A","text":"宣傳"},{"letter":"B","text":"市場調查"},{"letter":"C","text":"監察"},{"letter":"D","text":"服務提升"}],"answer":"B"},{"id":581,"chapter":"4","ref":"4.4","question":"保險銷售部就銷售成果和趨勢小心關注，這一過程常被稱為：","options":[{"letter":"A","text":"促銷"},{"letter":"B","text":"監察"},{"letter":"C","text":"市場調查"},{"letter":"D","text":"進度提升"}],"answer":"B"},{"id":582,"chapter":"4","ref":"4.4","question":"保險銷售的工作是：","options":[{"letter":"A","text":"產品的聯繫"},{"letter":"B","text":"與培訓及市場行銷部合作加強銷售計劃"},{"letter":"C","text":"掌握銷售成果及趨勢"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":583,"chapter":"4","ref":"4.4","question":"保險銷售部門較可能與以下哪個部門的聯繫最為密切？","options":[{"letter":"A","text":"市場行銷部門"},{"letter":"B","text":"核保部門"},{"letter":"C","text":"會計及投資部門"},{"letter":"D","text":"產品發展"}],"answer":"A"},{"id":584,"chapter":"4","ref":"4.5","question":"以下哪項或哪些有可能包括在給涉及核保風險之員工的指引和指示內？","options":[{"letter":"A","text":"拒絕名單"},{"letter":"B","text":"保費率指南"},{"letter":"C","text":"核保手冊"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":585,"chapter":"4","ref":"4.5","question":"以下哪項業務類形的核保通常是由總公司的一個部門集中起來的：","options":[{"letter":"A","text":"人壽"},{"letter":"B","text":"汽車"},{"letter":"C","text":"火險"},{"letter":"D","text":"僱員補償"}],"answer":"A"},{"id":586,"chapter":"4","ref":"4.5","question":"哪一類型保險是可以集中核保的？","options":[{"letter":"A","text":"人壽"},{"letter":"B","text":"旅遊"},{"letter":"C","text":"家居"},{"letter":"D","text":"意外"}],"answer":"A"},{"id":587,"chapter":"4","ref":"4.5","question":"以下哪項有關核保的陳述是不正確?","options":[{"letter":"A","text":"它包括選擇承保的風險"},{"letter":"B","text":"它包括應用於受保風險之條款"},{"letter":"C","text":"它包括非人壽業務的保單續保"},{"letter":"D","text":"於人壽保險中，是一種每年進行一次的過程"}],"answer":"D"},{"id":588,"chapter":"4","ref":"4.5","question":"對於保險公司的運作來說，核保可解作：","options":[{"letter":"A","text":"銷售行動"},{"letter":"B","text":"對任何未能出售的股票承擔責任"},{"letter":"C","text":"作爲保險目的而進行的風險評估"},{"letter":"D","text":"保單和其他合約文件的實際簽署"}],"answer":"C"},{"id":589,"chapter":"4","ref":"4.5","question":"以下哪項屬於核保的範疇？ i 評估風險的可保性 ii 釐定可保風險的條款 iii 製備核保手冊和保費率指南 iv 製備「拒絶名單」","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":590,"chapter":"4","ref":"4.5","question":"以下哪項不大可能屬於核保部門的職能範圍？","options":[{"letter":"A","text":"製備「拒絕名單」(不可授受的風險)"},{"letter":"B","text":"製備核保手冊"},{"letter":"C","text":"決定哪些是目標風險"},{"letter":"D","text":"處理涉及索償的投訴"}],"answer":"D"},{"id":591,"chapter":"4","ref":"4.5","question":"以下哪項屬於一般保險核保的特點？","options":[{"letter":"A","text":"它通常祇會在總部進行"},{"letter":"B","text":"它可能涉及多不勝數的類型"},{"letter":"C","text":"該動作祇會進行一次"},{"letter":"D","text":"以上各項皆正確"}],"answer":"B"},{"id":592,"chapter":"4","ref":"4.5(a)","question":"壽險保單核保工作尤為重要，以下哪項原因是正確的：","options":[{"letter":"A","text":"保險標的是人類"},{"letter":"B","text":"保險人不能單方取消保單"},{"letter":"C","text":"壽險保單的保額通常巨大"},{"letter":"D","text":"壽險保單牽涉的佣金較大"}],"answer":"B"},{"id":593,"chapter":"4","ref":"4.5(a)","question":"為何人壽保單在核保過程中不能出現錯誤？","options":[{"letter":"A","text":"因保險公司不能取消人壽保單，而且只可核保一次"},{"letter":"B","text":"因保單可能已轉讓予第三者"},{"letter":"C","text":"因保單可能已作抵押"},{"letter":"D","text":"以上各項皆是"}],"answer":"A"},{"id":594,"chapter":"4","ref":"4.5(b)","question":"以下哪項或哪些陳述有關一般保險核保是正確的？","options":[{"letter":"A","text":"它們會集中在總部核部"},{"letter":"B","text":"它們涉及保障類型多不勝數"},{"letter":"C","text":"在每一份保單只能發生一次"},{"letter":"D","text":"包括以上各項"}],"answer":"B"},{"id":595,"chapter":"4","ref":"4.5 (b)","question":"以下哪項不屬於核保部門的工作？","options":[{"letter":"A","text":"製備核保手冊及保費率指南"},{"letter":"B","text":"製訂拒絕名單"},{"letter":"C","text":"以集中形式處理一般保險的核保"},{"letter":"D","text":"以集中形式處理人壽保險的核保"}],"answer":"C"},{"id":596,"chapter":"4","ref":"4.5(b)","question":"以下哪項為一般保險業務的特點？ i 它們會收集於總部處理 ii 它們的處理保障類型多不勝數 iii 保單在續保時，條件可以檢討，在必要時保單甚至可以取消 iv 它們只能每年處理理賠一次","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"i, iv"}],"answer":"B"},{"id":597,"chapter":"4","ref":"4.5(d)","question":"火災保險中「目標風險」一詞指：","options":[{"letter":"A","text":"沒有什麼價值的投保物件"},{"letter":"B","text":"一項大的，很高的風險"},{"letter":"C","text":"一項普遍的風險"},{"letter":"D","text":"很低的保險費率"}],"answer":"B"},{"id":598,"chapter":"4","ref":"4.5(d)","question":"一個形容保險人極之希望爭取的壽險業務及極不想爭取的非壽險業務字眼為：","options":[{"letter":"A","text":"基本風險"},{"letter":"B","text":"特定風險"},{"letter":"C","text":"目標風險"},{"letter":"D","text":"投機風險"}],"answer":"C"},{"id":599,"chapter":"4","ref":"4.5(d)","question":"非人壽保險的目標風險較可能是指何種風險？","options":[{"letter":"A","text":"極低保額的風險"},{"letter":"B","text":"保險人極為合意的業務類型"},{"letter":"C","text":"保險人極不合意的業務類型"},{"letter":"D","text":"給予中介人最高佣金率的風險"}],"answer":"C"},{"id":600,"chapter":"4","ref":"4.5(e)","question":"在一個核保部門，「拒絶名單」是指","options":[{"letter":"A","text":"尤其應該鼓勵的風險"},{"letter":"B","text":"不鼓勵爭取或應拒絕的業務"},{"letter":"C","text":"給予代理人毋須在該年度內接受業務指示"},{"letter":"D","text":"直至繳付保費前不接受新業務的指示"}],"answer":"B"},{"id":601,"chapter":"4","ref":"4.5(e)","question":"保險公司可以指示保險代理人，不要從事專業類別的業務，這些指引可以包含在哪些文件中？","options":[{"letter":"A","text":"不良業務名單"},{"letter":"B","text":"「說不」名單"},{"letter":"C","text":"目標名單"},{"letter":"D","text":"拒絕名單"}],"answer":"D"},{"id":602,"chapter":"4","ref":"4.5(e)","question":"在保險人的「拒絕名單」上，代表的是以下哪項：","options":[{"letter":"A","text":"是指尤其鼓勵爭取的業務"},{"letter":"B","text":"代理人毋須在該年度取得更多業務"},{"letter":"C","text":"不鼓勵爭取或應拒絕的業務"},{"letter":"D","text":"在還沒收到保費之前，不應接受新業務"}],"answer":"C"},{"id":603,"chapter":"4","ref":"4.5(e)","question":"當代理人替委託人進行業務時，對於某些不鼓勵或應拒絶的業務的一份名單稱之為：","options":[{"letter":"A","text":"不接受名單"},{"letter":"B","text":"「說不」名單"},{"letter":"C","text":"拒絶名單"},{"letter":"D","text":"停止名單"}],"answer":"C"},{"id":604,"chapter":"4","ref":"4.6","question":"人壽保險公司內，負責核實、製備及簽發保單的部門是：","options":[{"letter":"A","text":"核保"},{"letter":"B","text":"保單處理"},{"letter":"C","text":"客戶服務"},{"letter":"D","text":"精算"}],"answer":"B"},{"id":605,"chapter":"4","ref":"4.6(a)","question":"實際保單文件對於以下哪種保險業務是最重要的:","options":[{"letter":"A","text":"責任保險"},{"letter":"B","text":"人壽保險"},{"letter":"C","text":"火險"},{"letter":"D","text":"汽車保險"}],"answer":"B"},{"id":606,"chapter":"4","ref":"4.6(b)","question":"在保單中出現錯誤是非常嚴重的，因為：","options":[{"letter":"A","text":"保單可以轉讓予其它人士"},{"letter":"B","text":"保險人不能取消保單"},{"letter":"C","text":"保單可以用作貸款抵押"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":607,"chapter":"4","ref":"4.6(d)","question":"保單處理的工作是：","options":[{"letter":"A","text":"處理誤差"},{"letter":"B","text":"內容，製備批單"},{"letter":"C","text":"保單續保"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":608,"chapter":"4","ref":"4.6(d)","question":"對很多險種來說，通常在收到保費之前保障已經開始生效，但是，以下哪業務種類幾乎總是根據第一筆 保費才能確定合約的存在？","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"火災保險"},{"letter":"C","text":"人身意外保險"},{"letter":"D","text":"以上各項皆是"}],"answer":"A"},{"id":609,"chapter":"4","ref":"4.7 / 3","question":"一般保險的理賠部門，不大考慮以下哪項？","options":[{"letter":"A","text":"分擔"},{"letter":"B","text":"尚未償還的貸款"},{"letter":"C","text":"代位權的可能性"},{"letter":"D","text":"比例分攤的應用"}],"answer":"B"},{"id":610,"chapter":"4","ref":"4.7","question":"人壽保險理賠部，不會負責處理以下哪項：","options":[{"letter":"A","text":"紅利"},{"letter":"B","text":"尙未清還的保單貸款"},{"letter":"C","text":"可能出現的保單轉讓"},{"letter":"D","text":"運用比例分攤"}],"answer":"D"},{"id":611,"chapter":"4","ref":"4.7","question":"保單持有人購買了一份意外死亡保險及汽車意外保險。若保單持有人在一次汽車意外中死亡，以下哪項 索償是正確的？","options":[{"letter":"A","text":"僅僅是首先生效的保單"},{"letter":"B","text":"僅僅是最大保額的保單"},{"letter":"C","text":"兩份保單也會作出賠償"},{"letter":"D","text":"由於是在汽車意外死亡，故只有汽車意外保險作出賠償"}],"answer":"C"},{"id":612,"chapter":"4","ref":"4.7","question":"在處理死亡索償時，有些要特別注意的地方，包括賠償利益及","options":[{"letter":"A","text":"權益的轉讓"},{"letter":"B","text":"紅利"},{"letter":"C","text":"保單中未清償的保單貸款的貸款數額"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":613,"chapter":"4","ref":"4.7","question":"以下哪項並不是一般保險理賠的範疇？","options":[{"letter":"A","text":"調查有否欺詐成份"},{"letter":"B","text":"責任的存在"},{"letter":"C","text":"決定有關索償應賠付的金額"},{"letter":"D","text":"處理未清償的保單貸款"}],"answer":"D"},{"id":614,"chapter":"4","ref":"4.7","question":"處理人壽及非人壽索償時有的共同特性是數額的問題及：","options":[{"letter":"A","text":"如何處理彌償的問題"},{"letter":"B","text":"分擔的問題"},{"letter":"C","text":"責任的問題"},{"letter":"D","text":"代位權的問題"}],"answer":"C"},{"id":615,"chapter":"4","ref":"4.7(a)","question":"以下哪項不是人壽保險理賠部所考慮的範圍？","options":[{"letter":"A","text":"退休策劃"},{"letter":"B","text":"紅利因素"},{"letter":"C","text":"保單轉讓"},{"letter":"D","text":"有否未清還之保單貸款"}],"answer":"A"},{"id":616,"chapter":"4","ref":"4.7(a)","question":"如果理賠部門涉及複雜的保單貸款情況，保單的權益轉讓及現金紅利/期末紅利的計算，那麼很明顯地， 它正在處理的理賠屬於：","options":[{"letter":"A","text":"人身意外保險"},{"letter":"B","text":"人壽保險"},{"letter":"C","text":"火險"},{"letter":"D","text":"汽車保險"}],"answer":"B"},{"id":617,"chapter":"4","ref":"4.7(a)","question":"以下哪些可能對人壽保險理賠造成一定的影響？ i. 還未清償的保費貸款 ii. 與受益人有關的複雜事項 iii 轉讓保單予第三者的可能性 iv 對死者死亡的真確性或身分存在不確定因素","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":618,"chapter":"4","ref":"4.7(a)","question":"保險人之理賠部門，在處理人壽索償時，不會考慮以下哪項或哪些事務？","options":[{"letter":"A","text":"紅利"},{"letter":"B","text":"保單轉讓"},{"letter":"C","text":"可能出現還未淸償的保單貸款"},{"letter":"D","text":"核保的過程"}],"answer":"D"},{"id":619,"chapter":"4","ref":"4.7(a)","question":"人壽保險中的理賠部不會處理以下哪項？","options":[{"letter":"A","text":"運用比例分攤"},{"letter":"B","text":"分紅/不分紅"},{"letter":"C","text":"轉讓"},{"letter":"D","text":"未繳清的保單貸款"}],"answer":"A"},{"id":620,"chapter":"4","ref":"4.7(a)","question":"以下哪三項有關人壽保險的理賠處理的描述是正確的？ i. 可能需要考慮尚未清償的保單貸款 ii. 可能需要考慮保單的轉讓 iii. 可能需要考慮代位權及損餘的問題 iv. 可能需要把分紅或期未紅利一併考慮","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":621,"chapter":"4","ref":"4.7(b)","question":"下列哪項不是一般保險理賠的考慮？","options":[{"letter":"A","text":"紅利的考慮"},{"letter":"B","text":"非集中形式的索償"},{"letter":"C","text":"理賠種類比人壽保險的來得廣泛"},{"letter":"D","text":"責任索償較可能是大額款項"}],"answer":"A"},{"id":622,"chapter":"4","ref":"4.7(c)","question":"在處理所有的保險理賠時，有兩個特別注意的地方，一為理賠責任，另一為：","options":[{"letter":"A","text":"數額"},{"letter":"B","text":"紅利的計算"},{"letter":"C","text":"保單貸款是否不清"},{"letter":"D","text":"失去索償折扣"}],"answer":"A"},{"id":623,"chapter":"4","ref":"4.7(c)","question":"對於保險理賠，應該注意的包括數額(索償時的賠付)及：","options":[{"letter":"A","text":"被保險人所承擔的法律責任"},{"letter":"B","text":"保險人對索償人的法律責任"},{"letter":"C","text":"保險人及被保險人共同上的法律責任"},{"letter":"D","text":"保險人及被保險人均不須上任何法律責任"}],"answer":"A"},{"id":624,"chapter":"4","ref":"4.7(c)","question":"處理人壽保險及一般保險理賠時出現的兩項主要共同的特點是責任及：","options":[{"letter":"A","text":"如何提供彌償"},{"letter":"B","text":"數額"},{"letter":"C","text":"分擔"},{"letter":"D","text":"代位權"}],"answer":"B"},{"id":625,"chapter":"4","ref":"4.7(c)","question":"大多數非人壽保險索償中，保險人對賠款必須認真核實，在描述索償支付數目的術語稱為:","options":[{"letter":"A","text":"數額"},{"letter":"B","text":"數量"},{"letter":"C","text":"恢復數額"},{"letter":"D","text":"保險人的分攤"}],"answer":"A"},{"id":626,"chapter":"4","ref":"4.8","question":"保險人所承受的風險責任很大，他可以將部分地通過保險轉移到其他保險人身上，這稱為:","options":[{"letter":"A","text":"再保險"},{"letter":"B","text":"重覆保險"},{"letter":"C","text":"重覆彌償"},{"letter":"D","text":"輔助保險"}],"answer":"A"},{"id":627,"chapter":"4","ref":"4.8","question":"以下哪項有關再保險的陳述是正確的？","options":[{"letter":"A","text":"這是當認為某風險的保險單不能提供足夠保障時，而再購買多一張保單的過程"},{"letter":"B","text":"大客戶通常要求其中小保險人購買再保險"},{"letter":"C","text":"由於再保險的費用高昂，再保險的使用只限於恐佈襲擊和核保風險"},{"letter":"D","text":"保險人有時會利用再保險來減低變現風險，試想像發生災禍後，於短時間內需要大量現金"}],"answer":"D"},{"id":628,"chapter":"4","ref":"4.8","question":"以下哪項有關再保險的陳述並不正確？","options":[{"letter":"A","text":"必須透過本港以外的再保險人進行再保險"},{"letter":"B","text":"再保險有時指與再保險人分擔一項風險"},{"letter":"C","text":"再保險不會直接影響原來的保單持有人"},{"letter":"D","text":"本港的保險人必須維持「足夠的再保險」"}],"answer":"A"},{"id":629,"chapter":"4","ref":"4.8","question":"以下哪項有關再保險的陳述是正確的？","options":[{"letter":"A","text":"再保險是當某風險的保障不足時購買另一份保險的過程"},{"letter":"B","text":"大客戶要求其中小保險人購買再保險"},{"letter":"C","text":"再保險的費用很高，所以只限於恐怖襲擊及核事故"},{"letter":"D","text":"保險通過一個或以上的保險合約把他已經受保的風險的部分或全部轉移給另一保險人"}],"answer":"D"},{"id":630,"chapter":"4","ref":"4.8","question":"以下哪項描述再保險是正確的？","options":[{"letter":"A","text":"當保險人分出再保險後，不用知會被保險人"},{"letter":"B","text":"再保險人需要承擔某程度的風險損失"},{"letter":"C","text":"為大規模的風險提供分擔賠償"},{"letter":"D","text":"以上所列各項"}],"answer":"D"},{"id":631,"chapter":"4","ref":"4.8","question":"以下哪三項屬於再保險的功能？ i. 足夠的再保險安排對保險人的財政穩健極為重要 ii. 保險人安排再保險，再保險人可以分擔保險 iii. 保險人安排再保險，再保險可以協助應付巨災 iv. 保險人無能力繳付賠償金，索償人可向再保險人追討","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":632,"chapter":"4","ref":"4.8(d)","question":"以下哪項對於再保險的描述是不正確的？","options":[{"letter":"A","text":"只是保險人與再保險人之間的事情"},{"letter":"B","text":"要向在香港註冊的公司購買"},{"letter":"C","text":"要維持足夠的再保險"},{"letter":"D","text":"對保單持有人沒有任何影響"}],"answer":"B"},{"id":633,"chapter":"4","ref":"4.9","question":"「精算師」角色在各類保險產品中日見重要，當中尤為與那類別至為緊密：","options":[{"letter":"A","text":"汽車保險"},{"letter":"B","text":"人身意外保險"},{"letter":"C","text":"人壽保險"},{"letter":"D","text":"家居保險"}],"answer":"C"},{"id":634,"chapter":"4","ref":"4.9","question":"以下哪些為精算師的職責？ i 計算儲備 ii 負債的估值 iii 預計利息收益 iv 保費率的釐定","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":635,"chapter":"4","ref":"4.9","question":"最可能涉及釐定保費率，計算儲備及債務估值的專業人士為：","options":[{"letter":"A","text":"損失公估人"},{"letter":"B","text":"精算師"},{"letter":"C","text":"會計師"},{"letter":"D","text":"核保人"}],"answer":"B"},{"id":636,"chapter":"4","ref":"4.9","question":"雖然越發覺精算師參與所有不同類別保險的工作，然而他們最可能涉及:","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"水險"},{"letter":"C","text":"家居保險"},{"letter":"D","text":"火險"}],"answer":"A"},{"id":637,"chapter":"4","ref":"4.9(a)","question":"保險業條例要求所有從事長期業務的保險人，委派一名合資格的精算師，並要求：","options":[{"letter":"A","text":"每年呈交一份屬於該保險人的獨立死亡率報告"},{"letter":"B","text":"對該保險人的所有資產及負債進行評估最少一年一次的"},{"letter":"C","text":"每年呈交一份索償報告"},{"letter":"D","text":"以上所列各項要求均要達致"}],"answer":"B"},{"id":638,"chapter":"4","ref":"4.9(b)","question":"對於在發生後的一段頗長時間內尚有所發展的一類索償， 精算師所作的計算實在居功不少。 這項索償 通常出現於：","options":[{"letter":"A","text":"長期責任業務"},{"letter":"B","text":"短期責任業務"},{"letter":"C","text":"長期保單"},{"letter":"D","text":"長期業務"}],"answer":"A"},{"id":639,"chapter":"4","ref":"4.10","question":"下列哪項屬於會計及投資部門的工作？ (a-d) i 紀錄保存 ii 款項收集 iii 付款 iv 投資","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":640,"chapter":"4","ref":"4.10","question":"以下哪項不大可能是保險公司會計部的責任？ (b-c) i 替還未清繳的賬單付款 ii 追收欠交的保費 iii 釐定各項風險是否可保 iv 安排把新的保險產品進出市場","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"iii, iv"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":641,"chapter":"4","ref":"4.10(d)","question":"以下哪項或哪些是會計及投資部門，對他們投資組合特別注意的?","options":[{"letter":"A","text":"安全性"},{"letter":"B","text":"流動性"},{"letter":"C","text":"收益性"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":642,"chapter":"4","ref":"4.11","question":"根據保險代理管理守則，對保險中介人的培訓(有所界定)：","options":[{"letter":"A","text":"由香港保險業聯會提供"},{"letter":"B","text":"由保險代理登記委員會提供"},{"letter":"C","text":"由保險人提供"},{"letter":"D","text":"由保險中介人自己支付"}],"answer":"C"},{"id":643,"chapter":"4","ref":"4.11","question":"培訓及發展部門提供培訓及教育，而兩者之間的關係是：","options":[{"letter":"A","text":"基本上是一樣"},{"letter":"B","text":"教育方面可視為較廣博知識的學習"},{"letter":"C","text":"培訓比教育更重要"},{"letter":"D","text":"祗為應付公開考試"}],"answer":"B"},{"id":644,"chapter":"4","ref":"4.11","question":"對於培訓及發展部門，以下哪項的描述是正確的？ i 培訓對於內勤及外勤的員工同樣重要 ii 它必須與公司的需要配合 iii 它必須由非職員提供 iv 資源及紀錄對提高該部門的運作效率是非常重要的","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":645,"chapter":"4","ref":"4.11(d)","question":"不論由培訓及發展部門主理或安排，當考慮培訓及教育時：","options":[{"letter":"A","text":"兩者所涉及的含義相同"},{"letter":"B","text":"培訓永不可由公司內部職員提供"},{"letter":"C","text":"培訓的目的是為預備公開考試"},{"letter":"D","text":"教育所涉及的是較為廣博知識的學習"}],"answer":"D"},{"id":646,"chapter":"5","ref":"5.1.1","question":"根據《保險業條例》中有關業務的分類，以下哪項被歸入不正確的分類：","options":[{"letter":"A","text":"聯合養老保險 - 歸入長期業務"},{"letter":"B","text":"船舶 - 歸入一般業務"},{"letter":"C","text":"永久健康 - 歸入一般業務"},{"letter":"D","text":"人壽及年金 - 歸入長期業務"}],"answer":"C"},{"id":647,"chapter":"5","ref":"5.1.1","question":"根據《保險業條例》，下列哪項屬長期業務範圍？","options":[{"letter":"A","text":"聯合養老保險"},{"letter":"B","text":"人壽及年金"},{"letter":"C","text":"永久健康"},{"letter":"D","text":"上述所有各項"}],"answer":"D"},{"id":648,"chapter":"5","ref":"5.1.1","question":"《保險業條例》把保險業務分為兩大類別，其中一種是一般業務，另一種是：","options":[{"letter":"A","text":"特殊業務"},{"letter":"B","text":"意外保險"},{"letter":"C","text":"長期責任業務"},{"letter":"D","text":"長期業務"}],"answer":"D"},{"id":649,"chapter":"5","ref":"5.1.1","question":"在保險法定類別中，保險以業務作為分類，可分為長期業務及一般業務，以下哪項陳述是正確的？","options":[{"letter":"A","text":"一般保險主要涉及人壽保險"},{"letter":"B","text":"長期保險主要涉及人壽保險"},{"letter":"C","text":"長期保險的種類比一般保險為多"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":650,"chapter":"5","ref":"5.1.1(a)","question":"在保險的法定類別中，長期業務包括：","options":[{"letter":"A","text":"壽險"},{"letter":"B","text":"海上保險"},{"letter":"C","text":"火險"},{"letter":"D","text":"人壽保險及人身意外"}],"answer":"A"},{"id":651,"chapter":"5","ref":"5.1.1(a)","question":"根據《保險業條例》的分類，以下哪項或哪些保險屬於長期保險的業務範圍？","options":[{"letter":"A","text":"火險"},{"letter":"B","text":"人壽及年金"},{"letter":"C","text":"財產損壞"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":652,"chapter":"5","ref":"5.1.1(a)","question":"在《保險業條例》中，以下哪些屬於長期業務？","options":[{"letter":"A","text":"火險"},{"letter":"B","text":"汽車"},{"letter":"C","text":"永久健康"},{"letter":"D","text":"水險"}],"answer":"C"},{"id":653,"chapter":"5","ref":"5.1.1(a)","question":"某種長期業務大致上就因意外喪失能力或健康欠佳提供利益的長期保單，這類長期業務是：","options":[{"letter":"A","text":"永久健康"},{"letter":"B","text":"疾病"},{"letter":"C","text":"喪失能力"},{"letter":"D","text":"永久喪失能力"}],"answer":"A"},{"id":654,"chapter":"5","ref":"5.1.1(b)","question":"根據《保險業條例》的保險類別分類，以下哪項保險屬於一般保險而非包括在長期業務的業務範圍內：","options":[{"letter":"A","text":"信貸"},{"letter":"B","text":"相連長期"},{"letter":"C","text":"永久健康"},{"letter":"D","text":"資本贖回"}],"answer":"A"},{"id":655,"chapter":"5","ref":"5.1.1 (b)","question":"根據《保險業條例》的分類，以下哪項或哪些保險屬於一般保險的業務範圍：","options":[{"letter":"A","text":"意外"},{"letter":"B","text":"汽車保險"},{"letter":"C","text":"船舶的法律責任"},{"letter":"D","text":"以上所列各項"}],"answer":"D"},{"id":656,"chapter":"5","ref":"5.1.1 (b)","question":"根據《保險業條例》對保險的兩種分類中，以下哪項屬於一般保險業務？","options":[{"letter":"A","text":"人壽及年金"},{"letter":"B","text":"相連長期"},{"letter":"C","text":"財產損壞"},{"letter":"D","text":"以上所有各項"}],"answer":"C"},{"id":657,"chapter":"5","ref":"5.1.1(b) 5.1.3(c)","question":"根據«保險業條例»中的保險業務分類，僱員補償保險：","options":[{"letter":"A","text":"它沒有獨立分類"},{"letter":"B","text":"屬於一般業務的範圍"},{"letter":"C","text":"屬於一般法律責任的保險"},{"letter":"D","text":"與上述的評論相符"}],"answer":"D"},{"id":658,"chapter":"5","ref":"5.1.2 (a)(ii)","question":"在香港，保險公司一般會採用英式或美式的保險分類，美式保險的特點是：","options":[{"letter":"A","text":"人壽與非人壽保險是分開的"},{"letter":"B","text":"一般保險分為：火險、海上保險、保證險和意外險"},{"letter":"C","text":"一般保險分為：火險和意外險"},{"letter":"D","text":"以上(a)(b)兩項"}],"answer":"D"},{"id":659,"chapter":"5","ref":"5.1.2(a)","question":"保險業務傳統分類方法分為四類：壽險、海上保險、火險及意外險，這些分類方法可描述為：","options":[{"letter":"A","text":"法定分類"},{"letter":"B","text":"功能分類"},{"letter":"C","text":"部門式分類"},{"letter":"D","text":"年代分類"}],"answer":"C"},{"id":660,"chapter":"5","ref":"5.1.2(a)(ii)","question":"香港的保險人可以自由地按照他認為合適的方式將其業務進行分類,其中有以下兩種主要部門式的的分類 方法,可分為英國形式和美國形式,而美國形式有一個清晰的界限,包括:","options":[{"letter":"A","text":"它通常分為人壽或非人壽業務"},{"letter":"B","text":"非人壽業務一般可分為火險、海上保險、保證及意外險"},{"letter":"C","text":"非人壽業務可分為火險、意外險"},{"letter":"D","text":"以上 A 及 B 皆正確"}],"answer":"D"},{"id":661,"chapter":"5","ref":"5.1.2(a)","question":"美式保險公司的部門分類包括： (ii) i 財產及意外險 ii 人壽及非人壽業務 iii 海上保險 iv 火險","options":[{"letter":"A","text":"i"},{"letter":"B","text":"ii"},{"letter":"C","text":"i, ii"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":662,"chapter":"5","ref":"5.1.2(a)","question":"根據英國部門式分類的制度，主要分為四大類(意外險、火險、壽險及海上保險) 。美國制度下，則分為兩 (ii) 大類，包括人壽及非人壽。後者亦經常進一步劃分為：","options":[{"letter":"A","text":"財產及非財產"},{"letter":"B","text":"火險及其他"},{"letter":"C","text":"海上保險，火險，保證及意外險"},{"letter":"D","text":"汽車及責任"}],"answer":"C"},{"id":663,"chapter":"5","ref":"5.1.2(b)","question":"保險人對其保險業務來源會作出分類，通常分為 3 類，以下哪項並不是其中一類？","options":[{"letter":"A","text":"來自保險代理人"},{"letter":"B","text":"來自保險經紀"},{"letter":"C","text":"來自公眾"},{"letter":"D","text":"來自現有客戶的推薦"}],"answer":"D"},{"id":664,"chapter":"5","ref":"5.1.2 (c)","question":"保險業務的一種分類方式是以客戶類型分類，這種分類慣常包括：","options":[{"letter":"A","text":"私人和業務"},{"letter":"B","text":"個人和非個人"},{"letter":"C","text":"個人和商業"},{"letter":"D","text":"業務和非業務"}],"answer":"C"},{"id":665,"chapter":"5","ref":"5.1.2 (c)","question":"客戶類型是保險分類方法之一，客戶對象為：","options":[{"letter":"A","text":"私人及業務"},{"letter":"B","text":"個人及非個人"},{"letter":"C","text":"個人/商號和機構"},{"letter":"D","text":"業務及非業務"}],"answer":"C"},{"id":666,"chapter":"5","ref":"5.1.3","question":"以下哪項屬於保險的學術上類別的分類？","options":[{"letter":"A","text":"火災保險"},{"letter":"B","text":"財產保險"},{"letter":"C","text":"僱傭保險"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":667,"chapter":"5","ref":"5.1.3","question":"保險的學術分類方法，主要用於專業保險考試的研習上。下列哪項屬於這類方法的通常種類？","options":[{"letter":"A","text":"責任保險"},{"letter":"B","text":"財產保險"},{"letter":"C","text":"人身保險"},{"letter":"D","text":"上述各項皆是"}],"answer":"D"},{"id":668,"chapter":"5","ref":"5.1.3","question":"以下哪項不屬於保險的功能式分類？","options":[{"letter":"A","text":"財產保險"},{"letter":"B","text":"責任保險"},{"letter":"C","text":"人身保險"},{"letter":"D","text":"個人保險"}],"answer":"D"},{"id":669,"chapter":"5","ref":"5.1.3(d)","question":"以下哪項或哪些是保險業中的學術分類？","options":[{"letter":"A","text":"工程保險"},{"letter":"B","text":"經濟權益保險"},{"letter":"C","text":"一籃子保險"},{"letter":"D","text":"以上各項都是"}],"answer":"B"},{"id":670,"chapter":"5","ref":"5.1.3(c)","question":"以下哪項屬於保險的學術類別的分類？","options":[{"letter":"A","text":"一籃子保險"},{"letter":"B","text":"責任保險"},{"letter":"C","text":"工程保險"},{"letter":"D","text":"以上各項都是"}],"answer":"B"},{"id":671,"chapter":"5","ref":"5.1.3(d)","question":"保險可按保險標的或功能作分類，以下哪項不屬於經濟權益保險的功能分類?","options":[{"letter":"A","text":"租金"},{"letter":"B","text":"信貸"},{"letter":"C","text":"火險"},{"letter":"D","text":"以上各項都是"}],"answer":"C"},{"id":672,"chapter":"5","ref":"5.1.3 註","question":"保險的學術分類可分為人身保險，財產保險及責任保險。這種分類又稱之為？","options":[{"letter":"A","text":"按客戶類型分類"},{"letter":"B","text":"按功能類別分類"},{"letter":"C","text":"按部門形式分類"},{"letter":"D","text":"按業務來源分類"}],"answer":"B"},{"id":673,"chapter":"5","ref":"5.1.4","question":"對於特定的保險公司，「分入再保險」與「分出再保險」的分別是：","options":[{"letter":"A","text":"分入再保險只涉及香港的再保險人"},{"letter":"B","text":"分出再保險只涉及非香港的再保險人"},{"letter":"C","text":"分入再保險以該公司作為再保險人"},{"letter":"D","text":"分出再保險以該公司作為再保險人"}],"answer":"C"},{"id":674,"chapter":"5","ref":"5.1.4","question":"對於特定的保險公司，「分出再保險」與「分入再保險」：","options":[{"letter":"A","text":"它們含有相同的意思"},{"letter":"B","text":"分出再保險以該公司作為再保險人"},{"letter":"C","text":"分入再保險為購買再保險的公司"},{"letter":"D","text":"以上所有各項皆不是"}],"answer":"D"},{"id":675,"chapter":"5","ref":"5.1.4","question":"只參與再保險業務的保險人稱為：","options":[{"letter":"A","text":"專屬再保險人"},{"letter":"B","text":"分出再保險人"},{"letter":"C","text":"分入再保險人"},{"letter":"D","text":"專業再保險人"}],"answer":"D"},{"id":676,"chapter":"5","ref":"5.1.4","question":"專業再保險人：","options":[{"letter":"A","text":"已取得專業評審資格"},{"letter":"B","text":"對大而危險的風險具備經驗"},{"letter":"C","text":"只經營單一類別的保險業務"},{"letter":"D","text":"只提供再保險"}],"answer":"D"},{"id":677,"chapter":"5","ref":"5.1.4","question":"以下哪項或哪些有關再保險的陳述是正確的？","options":[{"letter":"A","text":"替個人的風險進行再保險稱為分入再保險"},{"letter":"B","text":"替其他保險人進行再保險稱為分出再保險"},{"letter":"C","text":"專業再保險人只進行再保險業務"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":678,"chapter":"5","ref":"5.2.1","question":"就香港保險市場而言，以下哪項或哪些有關「綜合」業務保險人的描述是正確的？","options":[{"letter":"A","text":"純一般業務保險人數目多於綜合業務保險人"},{"letter":"B","text":"純長期業務保險人數目多於綜合業務保險人"},{"letter":"C","text":"綜合業務保險人進行一般及長期兩種業務"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":679,"chapter":"5","ref":"5.2.1","question":"以下哪項對「綜合」保險人的描述是正確的？","options":[{"letter":"A","text":"從事「純」長期業務保險人比從事「綜合」業務的保險人之數目為多"},{"letter":"B","text":"從事「純」一般業務保險人比從事「綜合」業務的保險人之數目為多"},{"letter":"C","text":"「綜合」是指同時從事長期及一般業務"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":680,"chapter":"5","ref":"5.2.1","question":"在獲授權的保險人，在香港保險業務是:","options":[{"letter":"A","text":"長期業務保險人數目多於一般業務保險人數目"},{"letter":"B","text":"一般業務保險人數目多於長期業務保險人數目"},{"letter":"C","text":"長期業務保險人數目與一般業務保險人數目是相等"},{"letter":"D","text":"綜合業務保險人數目多於長期業務保險人或一般業務保險人數目"}],"answer":"B"},{"id":681,"chapter":"5","ref":"5.2.1 &","question":"根據 2012 年資料數字顯示，以下哪項為正確？ 5.3(b) (ii)","options":[{"letter":"A","text":"從事長期業務的保險人數目比一般業務較少"},{"letter":"B","text":"從事一般業務的保險人數目比長期業務較多"},{"letter":"C","text":"名列首十位的長期保險業務的保險人佔市場佔有比率 75%"},{"letter":"D","text":"以上所列各項"}],"answer":"D"},{"id":682,"chapter":"5","ref":"5.2.1(c)","question":"香港「綜合保險人」的術語於現代使用意味著保險人:","options":[{"letter":"A","text":"對某一業務種類很專業化"},{"letter":"B","text":"代理一種以上的的業務"},{"letter":"C","text":"同時處理長期業務和一般業務"},{"letter":"D","text":"同時處理強制性業務和選擇性業務"}],"answer":"C"},{"id":683,"chapter":"5","ref":"5.2.2","question":"根據«保險業條例»，保險經紀必須是：","options":[{"letter":"A","text":"符合資格的保險經紀"},{"letter":"B","text":"已登記的保險經紀"},{"letter":"C","text":"經評審的保險經紀"},{"letter":"D","text":"獲授權的保險經紀"}],"answer":"D"},{"id":684,"chapter":"5","ref":"5.2.2","question":"在保險業中，中介人解作：","options":[{"letter":"A","text":"保險人"},{"letter":"B","text":"保險經紀"},{"letter":"C","text":"保險代理人或保險經紀"},{"letter":"D","text":"保險代理人"}],"answer":"C"},{"id":685,"chapter":"5","ref":"5.2.4","question":"從 2012 年保費收入統計數字中得知","options":[{"letter":"A","text":"一般業務所佔範圍最大"},{"letter":"B","text":"長期業務所佔範圍最大"},{"letter":"C","text":"兩種業務範圍相近"},{"letter":"D","text":"從保費收入數字比較, 團體保險業務範圍最大"}],"answer":"B"},{"id":686,"chapter":"5","ref":"5.3(a)","question":"香港是一個國際金融服務業中心，在眾多獲授權保險人中，有多少是在香港以外註冊？","options":[{"letter":"A","text":"約 10%"},{"letter":"B","text":"約 46.5%"},{"letter":"C","text":"約 75%"},{"letter":"D","text":"約 90%"}],"answer":"B"},{"id":687,"chapter":"5","ref":"5.3(b)","question":"根據可以獲取的數據，以下哪項些陳述對香港而言是正確的？ i 一般業務由相對少數的保險人支配 ii 長期業務由相對少數的保險人支配 iii 一般業務由保險人較為平均地分享 iv 長期業務由保險人較為平均地分享","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"C"},{"id":688,"chapter":"5","ref":"5.3(b)(ii)","question":"2012 年，本港名列頭十位的長期保險業務的保險人，所佔整體市場份額約為：","options":[{"letter":"A","text":"10%"},{"letter":"B","text":"20%"},{"letter":"C","text":"40%"},{"letter":"D","text":"75%"}],"answer":"D"},{"id":689,"chapter":"5","ref":"5.3(c)","question":"哪個歷史悠久的團體是保險人的代表？","options":[{"letter":"A","text":"香港保險業聯會"},{"letter":"B","text":"香港保險學會"},{"letter":"C","text":"保險業監管局保險業監管局"},{"letter":"D","text":"香港保險顧問聯會"}],"answer":"A"},{"id":690,"chapter":"5","ref":"5.4","question":"以下哪項或哪些有關本港「保險中介人」的規定的陳述是正確的？","options":[{"letter":"A","text":"他們必須正式註冊或獲授權"},{"letter":"B","text":"這個詞界定為包括銀行、汽車交易商和旅行社"},{"letter":"C","text":"他們必須符合若干規則"},{"letter":"D","text":"只有 A)和 C)是正確的"}],"answer":"D"},{"id":691,"chapter":"5","ref":"5.4(a)","question":"在香港必須註冊/獲授權的保險中介人為：","options":[{"letter":"A","text":"保險代理人而己"},{"letter":"B","text":"保險經紀而己"},{"letter":"C","text":"保險代理人及保險經紀"},{"letter":"D","text":"既非保險代理人也非保險經紀"}],"answer":"C"},{"id":692,"chapter":"5","ref":"5.5.1","question":"下面哪項是對保險業聯會的正確描述？","options":[{"letter":"A","text":"它的其中一個目標是推廣在香港從事保險業務的保險人及再保險人的共同利益"},{"letter":"B","text":"它的其中一個目標是推廣在香港從事保險業務的保險人及保險代理人的共同利益"},{"letter":"C","text":"它由保險代理登記委員會成立"},{"letter":"D","text":"它存在的目的是向香港人及世界各地推廣保險訊息"}],"answer":"A"},{"id":693,"chapter":"5","ref":"5.5.1","question":"下列哪項為「香港保險業聯會」之陳述？","options":[{"letter":"A","text":"為保險人爭取利益"},{"letter":"B","text":"為再保險人爭取利益"},{"letter":"C","text":"成立保險代理登記委員會"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":694,"chapter":"5","ref":"5.5.1","question":"以下哪項或哪些有關香港保險業聨會的陳述是合適的？","options":[{"letter":"A","text":"它代表本港投保大眾的利益"},{"letter":"B","text":"推廣及提升本港保險人及再保險人利益"},{"letter":"C","text":"向香港人推廣保險訊息"},{"letter":"D","text":"上述(B)及(C)"}],"answer":"D"},{"id":695,"chapter":"5","ref":"5.5.1(b)","question":"根據香港保險業聯會的使命聲明，這個組織致力在會員間提倡最高的道德標準及：","options":[{"letter":"A","text":"效力"},{"letter":"B","text":"能力"},{"letter":"C","text":"專業水平"},{"letter":"D","text":"業務誠信"}],"answer":"C"},{"id":696,"chapter":"5","ref":"5.5.1(c)","question":"保險代理登記委員會有個角色是負責辦理保險代理人的登記及","options":[{"letter":"A","text":"處理與保險代理有關的投訴"},{"letter":"B","text":"在香港的職員"},{"letter":"C","text":"監管代理人一般操守"},{"letter":"D","text":"維持保險中介人資格考試"}],"answer":"A"},{"id":697,"chapter":"5","ref":"5.5.1(c)","question":"根據〈保險代理管理守則〉成立的保險代理登記委員會，它的職能包括以下哪項或哪些？","options":[{"letter":"A","text":"轉介有關投訴予任何保險人"},{"letter":"B","text":"保存委任代理人登記冊"},{"letter":"C","text":"要求保險人採取紀律行動"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":698,"chapter":"5","ref":"5.5.1(c)","question":"保險代理登記委員會的工作是甚麼？ i 替保險代理人及其負責人和業務代表登記 ii 處理與保險代理人或其負責人或業務代表有關之投訴 iii 推廣在本港經營業務的保險人的共用利益 iv 爭取向無辜死傷的受害人提供補償","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"以上各項都是"}],"answer":"A"},{"id":699,"chapter":"5","ref":"5.5.2(a)&","question":"《保險業條例》第 70 條賦予保險業監管局保險業監管局批准保險經紀團體成立的權力。到目前為止，這 (b) 類經批准的 保險經紀團體有：","options":[{"letter":"A","text":"一個"},{"letter":"B","text":"兩個"},{"letter":"C","text":"三個"},{"letter":"D","text":"四個"}],"answer":"B"},{"id":700,"chapter":"5","ref":"5.5.2","question":"根據《保險業條例》第 70 條，認可保險經紀團體的權力賦予：","options":[{"letter":"A","text":"保險業監管局保險業監管局"},{"letter":"B","text":"香港特別行政區行政長官"},{"letter":"C","text":"香港保險顧問聯會"},{"letter":"D","text":"香港專業保險經紀協會有限公司"}],"answer":"A"},{"id":701,"chapter":"5","ref":"5.5.2","question":"申請成功認可保險經紀團體，必須遵守法定的要求並且達到以下哪個機構的標準？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"保險經紀委員會"},{"letter":"C","text":"香港保險業聯會"},{"letter":"D","text":"證券及期貨事務監察委員會"}],"answer":"A"},{"id":702,"chapter":"5","ref":"5.5.2","question":"下列哪個團體擁有批准保險經紀團體成立的權力？","options":[{"letter":"A","text":"保險業聯會"},{"letter":"B","text":"保險業監管局"},{"letter":"C","text":"香港保險學會"},{"letter":"D","text":"保險顧問聯會"}],"answer":"B"},{"id":703,"chapter":"5","ref":"5.5.2","question":"以下哪項對認可保險經紀團體的描述是正確的？","options":[{"letter":"A","text":"它們是香港專業保險經紀協會及保險中介人協會"},{"letter":"B","text":"它們是香港專業保險經紀協會及香港保險顧問聯會"},{"letter":"C","text":"根據《保險業條例》 ，香港祇可以有兩個有關團體"},{"letter":"D","text":"在香港有 3 個有關團體"}],"answer":"B"},{"id":704,"chapter":"5","ref":"5.5.2","question":"下列哪個團體的會員被視為獲授權的保險經紀？ i 香港保險業聯會 ii 香港保險顧問聯會 iii 保險代理登記委員會 iv 香港專業保險經紀協會","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"ii, iv"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":705,"chapter":"5","ref":"5.5.3 (b)","question":"以下哪項是香港汽車保險局的功用：","options":[{"letter":"A","text":"祗為車中的第三者提供賠償"},{"letter":"B","text":"專門提供汽車保險"},{"letter":"C","text":"為沒有購買法定保險的車輛提供傷亡保障"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":706,"chapter":"5","ref":"5.5.3(b)","question":"香港汽車保險局的工作包括：","options":[{"letter":"A","text":"維護汽車車主"},{"letter":"B","text":"售賣車險"},{"letter":"C","text":"維護公平保費"},{"letter":"D","text":"向無辜死傷的交通意外受害人提供補償"}],"answer":"D"},{"id":707,"chapter":"5","ref":"5.5.3(b)","question":"香港汽車保險局的經費是來自：","options":[{"letter":"A","text":"政府資助"},{"letter":"B","text":"私人損獻"},{"letter":"C","text":"汽車保險保費的附加徵費"},{"letter":"D","text":"香港保險業聯會"}],"answer":"C"},{"id":708,"chapter":"5","ref":"5.5.3(b)","question":"以下哪項是香港汽車保險局的主要功用：","options":[{"letter":"A","text":"為汽車保險人提供利益"},{"letter":"B","text":"裁決汽車保險賠償的糾紛"},{"letter":"C","text":"向無辜傷亡的交通意外受害人提供補償"},{"letter":"D","text":"確保賠償是公平的"}],"answer":"C"},{"id":709,"chapter":"6","ref":"6","question":"香港的保險業，保險代理人的管理是:","options":[{"letter":"A","text":"完全由政府負責"},{"letter":"B","text":"完全由保險業業界負責"},{"letter":"C","text":"既非政府亦非保險業業界負責"},{"letter":"D","text":"部份由政府和部份由保險業業界負責"}],"answer":"D"},{"id":710,"chapter":"6","ref":"6","question":"香港保險業規管架構是透過甚麼措施來達致的?","options":[{"letter":"A","text":"行業的自我規管"},{"letter":"B","text":"政府的法定規管"},{"letter":"C","text":"法定及行業的自我規管"},{"letter":"D","text":"毋須特別的措施來規管"}],"answer":"C"},{"id":711,"chapter":"6","ref":"6.1.1","question":"以下哪項是《保險業條例》條文的涵蓋範圍？ i 保險代理人 ii 保險經紀 iii 保險公司 iv 所有替保險經紀工作的人士","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":712,"chapter":"6","ref":"6.1.1","question":"保險業條例由以下哪個機構負責執行？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"香港保險業聯會"},{"letter":"C","text":"証券及期貨事務監督委員會"},{"letter":"D","text":"保險行業本身自律監管"}],"answer":"A"},{"id":713,"chapter":"6","ref":"6.1.1a","question":"為了確保一個申請做保險人的申請者的財務狀況是良好的或是是否適宜授權，一些指引(除卻《保險 公司條例》的最低要求)已經由以下哪個機構發出：","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"商業服務司"},{"letter":"C","text":"財經事務總監"},{"letter":"D","text":"香港證券和期貨協會"}],"answer":"A"},{"id":714,"chapter":"6","ref":"6.1.1b","question":"保險業條例中，對實繳股本的「最低要求」描述正確？ i 專屬自保保險人 200 萬 ii 長期業務 1000 萬 iii 一般及長期業務 2000 萬 iv 一般(加法定業務)保險 2000 萬","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":715,"chapter":"6","ref":"6.1.1b","question":"根據保險業條例，實繳股本的最低要求為︰","options":[{"letter":"A","text":"1,000 萬港元（經營一般及長期保險業務）"},{"letter":"B","text":"2,000 萬港元（經營一般保險業務）"},{"letter":"C","text":"2,000 萬港元（經營一般及長期保險業務）"},{"letter":"D","text":"200 萬港元（經營長期保險業務）"}],"answer":"C"},{"id":716,"chapter":"6","ref":"6.1.1b","question":"根據《保險業條例》的規定，以下哪項對本港保險人的最低股本金額要求並不正確？","options":[{"letter":"A","text":"專屬自保保險人為 1000 萬港元"},{"letter":"B","text":"從事法定保險業務的保險人為 2000 萬港元"},{"letter":"C","text":"只從事長期或一般業務的保險人為 1000 萬港元"},{"letter":"D","text":"同時從事一般及長期業務的保險人為 2000 萬港元"}],"answer":"A"},{"id":717,"chapter":"6","ref":"6.1.1b","question":"根據保險業條例中，以下哪些對實繳股本的「最低要求」之描述是正確的? i 專屬自保保險人 200 萬 ii 一般業務 1000 萬 iii 一般及長期業務 2000 萬 iv 鐵路車輛保險業務及汽車責任保險業務 2000 萬","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii ,iii"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":718,"chapter":"6","ref":"6.1.1b","question":"根據《保險業條例》 ，若保險人同時從事一般及長期業務，最低實繳股本為:","options":[{"letter":"A","text":"港幣 280 萬"},{"letter":"B","text":"港幣 1800 萬"},{"letter":"C","text":"港幣 2000 萬"},{"letter":"D","text":"港幣 4000 萬"}],"answer":"C"},{"id":719,"chapter":"6","ref":"5.1.1(b)","question":"i 專屬自保保險人為 200 萬元 ii 從事一般業務的保險人為 1000 萬元 iii 同時經營長期及一般業務的保險人為 2000 萬元 iv 從事船，飛機方面的法律責任及汽車方面的法律責任為 2000 萬元","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":720,"chapter":"6","ref":"6.1.1b(a)","question":"一千萬港元的實繳股本的最低要求適用於：","options":[{"letter":"A","text":"只經營一般業務或長期業務"},{"letter":"B","text":"經營一般業務及長期業務"},{"letter":"C","text":"任何法定保險業務"},{"letter":"D","text":"專屬自保保險人"}],"answer":"A"},{"id":721,"chapter":"6","ref":"6.1.1b(d)","question":"專屬自保保險人的實繳股本最低要求為：","options":[{"letter":"A","text":"50 萬港元"},{"letter":"B","text":"100 萬港元"},{"letter":"C","text":"200 萬港元"},{"letter":"D","text":"400 萬港元"}],"answer":"C"},{"id":722,"chapter":"6","ref":"6.1.1c","question":"償付準備金的計算方法為：","options":[{"letter":"A","text":"保險人的資產減以負債"},{"letter":"B","text":"保險人的負債減以資產"},{"letter":"C","text":"只適用於長期保險業務"},{"letter":"D","text":"不同類型保險公司有不同計算方法"}],"answer":"A"},{"id":723,"chapter":"6","ref":"6.1.1c","question":"以下哪項對《保險業條例》規定保險人之償付準備金描述是正確的？ i 數額至少是「相關數額」 ii 如經特別申請，償付準備金可低於規定 iii 對一般業務及長期業務之規定計算準則不同 iv 專屬自保保險人有較低的規定","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iv"}],"answer":"B"},{"id":724,"chapter":"6","ref":"6.1.1c(b)","question":"經營長期業務的保險人，最低的償付準備金為：","options":[{"letter":"A","text":"二百萬港元"},{"letter":"B","text":"一千萬港元"},{"letter":"C","text":"根據保費收益的數額而訂"},{"letter":"D","text":"根據保費收益及準賠償數額兩者而訂"}],"answer":"A"},{"id":725,"chapter":"6","ref":"6.1.1d","question":"擔當保險人的董事或行政總裁，必須：","options":[{"letter":"A","text":"有兩年的保險工作經驗"},{"letter":"B","text":"是適當人選"},{"letter":"C","text":"備存十萬港元的淨資產"},{"letter":"D","text":"最少有一個「客戶帳戶」"}],"answer":"B"},{"id":726,"chapter":"6","ref":"6.1.1d","question":"保險人的董事或控權人在上任前，必先得到以下哪項的認可？","options":[{"letter":"A","text":"保險業聯會"},{"letter":"B","text":"保險代理登記委員會"},{"letter":"C","text":"保險業監管局"},{"letter":"D","text":"保險業條例"}],"answer":"C"},{"id":727,"chapter":"6","ref":"6.1.1d","question":"保險公司的重要人仕必須是「適當人選」 ，以下哪項或哪些人仕須符合「適當人選」的準則？","options":[{"letter":"A","text":"總財務經理"},{"letter":"B","text":"任何保險中介人"},{"letter":"C","text":"保險公司的行政總裁"},{"letter":"D","text":"以上所有人士"}],"answer":"C"},{"id":728,"chapter":"6","ref":"6.1.1d","question":"根據「保險業條例」的條文，必須得到保險業監管局的授權才可委任：","options":[{"letter":"A","text":"公司的精算師"},{"letter":"B","text":"保險人的行政總裁"},{"letter":"C","text":"保險公司的任何一位財務總監"},{"letter":"D","text":"保險公司的理賠經理"}],"answer":"B"},{"id":729,"chapter":"6","ref":"6.1.1e","question":"對保險人的財政隱健，再保險安排起著極為重要作用，有關再保險安排的數量及素質，會影響保險人的：","options":[{"letter":"A","text":"有用價值"},{"letter":"B","text":"真實價值"},{"letter":"C","text":"收回應收賬款的能力"},{"letter":"D","text":"實際價值"}],"answer":"C"},{"id":730,"chapter":"6","ref":"6.1.1e","question":"以下哪項有關再保險的陳述是正確的？","options":[{"letter":"A","text":"它設有最高及最低的標準"},{"letter":"B","text":"只適用於一般保險上"},{"letter":"C","text":"刻意定得有彈性 (它描述為足夠的再保險)"},{"letter":"D","text":"根據上年保費而變化"}],"answer":"C"},{"id":731,"chapter":"6","ref":"6.1.1f(b)","question":"何種業務, 保險人必須根據《保險業條例》的要求，每年向保險業監管局呈交精算調查報告?","options":[{"letter":"A","text":"火險業務"},{"letter":"B","text":"長期業務"},{"letter":"C","text":"任何強制性保險"},{"letter":"D","text":"一般及長期業務"}],"answer":"B"},{"id":732,"chapter":"6","ref":"6.1.1f(b)(i)","question":"《保險業條例》擬定一般業務的資產及負債估值的規定，但以下哪項不受制於這規定：","options":[{"letter":"A","text":"汽車保險人"},{"letter":"B","text":"專屬自保保險人"},{"letter":"C","text":"僱員補償保險人"},{"letter":"D","text":"總部不在香港的保險人"}],"answer":"B"},{"id":733,"chapter":"6","ref":"6.1.1f(c)","question":"保險業條例（ICO)要求所有保險人根據（ICO)的要求呈交準備好的財務報表，呈交的頻率是:","options":[{"letter":"A","text":"每月"},{"letter":"B","text":"每年"},{"letter":"C","text":"每季度"},{"letter":"D","text":"每三年"}],"answer":"B"},{"id":734,"chapter":"6","ref":"6.1.1f(c)","question":"在《保險業條例》中，下列哪項呈報規定不正確？ i 每位保險人須每半年向保險業監管局呈交一份本身的財務報表 ii 每位保險人須每一年向保險業監管局呈交一份本身的財務報表 iii 長期業務保險人每年須向保險業監管局，呈交一份精算調查報告 iv 一般業務保險人每年須向保險業監管局，呈交一份經審計的一般業務報表","options":[{"letter":"A","text":"i"},{"letter":"B","text":"ii"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":735,"chapter":"6","ref":"6.1.1f(c)","question":"《保險業條例》要求參予一般業務的保險人定期繳交甚麼報表？ (ii) i 經審計的一般業務報表 ii 經審計的資產負債表 iii 經審計的精算報告表","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"i, ii, iii"}],"answer":"A"},{"id":736,"chapter":"6","ref":"6.1.1f(d)","question":"由 2000 年 6 月開始， 《保險業條例》准許保險業監管局在認為符合保單持有人或公衆利益的情況下， 披 露有關的資料, 這准許是為了提高以下哪方面:","options":[{"letter":"A","text":"市場透明度"},{"letter":"B","text":"反洗黑錢"},{"letter":"C","text":"資料自由"},{"letter":"D","text":"防止個人資料"}],"answer":"A"},{"id":737,"chapter":"6","ref":"6.1.1f(d)註","question":"在某種情況下，保險業監管局可以披露某些財務和統計資料予保單持有人。然而，保險業監管局不可披露 任何有關個別保單持有人的這種資料，除非:","options":[{"letter":"A","text":"在涉嫌詐騙中"},{"letter":"B","text":"在指明的法律程序下"},{"letter":"C","text":"在有關保單持有人去世後"},{"letter":"D","text":"在保單持有人宣佈破產"}],"answer":"B"},{"id":738,"chapter":"6","ref":"6.1.1g","question":"保險業條例中所指的干預權力指：","options":[{"letter":"A","text":"投資限制：對投資種類及地點作出限制"},{"letter":"B","text":"特定的精算調查：當對保險人應付債務的能力值得關注時，便需要去進行此項調查"},{"letter":"C","text":"將保險人清盤：在極度嚴重的情況時適用"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":739,"chapter":"6","ref":"6.1.1g","question":"根據《保險業條例》及相關法例，以下哪項或哪些屬於保險業監管局的干預權力：","options":[{"letter":"A","text":"嚴重情況下將保險人清盤"},{"letter":"B","text":"指令保單持有人退回過多的保費"},{"letter":"C","text":"指令提高法定保險保費"},{"letter":"D","text":"以上各項皆是"}],"answer":"A"},{"id":740,"chapter":"6","ref":"6.1.1g","question":"根據〈保險業條例〉及相關法例，以下哪項不屬於保險業監管局之干預權力？","options":[{"letter":"A","text":"行使對保險人的控制權"},{"letter":"B","text":"指令增加保費率"},{"letter":"C","text":"限制保費收入"},{"letter":"D","text":"要求特別的精算調查"}],"answer":"B"},{"id":741,"chapter":"6","ref":"6.1.1g","question":"《保險業條例》中干預權力，賦予規管機構有權力作出以下行動? i 特定精算調查 ii 限制保費收入 iii 將保險人清盤 iv 由認可受託人保管資產","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"i, ii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":742,"chapter":"6","ref":"6.1.2","question":"由保險業聯會執行的《承保商專業守則》適用於：","options":[{"letter":"A","text":"保險業聯會會員所發出之保單"},{"letter":"B","text":"保險業聯會會員所發出之商業保單"},{"letter":"C","text":"以香港居民個人作保單持有人的保單"},{"letter":"D","text":"以非香港居民個人作保單持有人的保單"}],"answer":"C"},{"id":743,"chapter":"6","ref":"6.1.2a","question":"《承保商專業守則》的目的是為索償、產品及核保等訂立事宜，這全部建立於那個標題上？","options":[{"letter":"A","text":"權益保証"},{"letter":"B","text":"誠實、誠信慣例"},{"letter":"C","text":"優良保險慣例"},{"letter":"D","text":"保險程序慣例"}],"answer":"C"},{"id":744,"chapter":"6","ref":"6.1.2a","question":"以下哪項的目的是在訂立與核保、索償、產品分析相關的符合標準的優良保險做法?","options":[{"letter":"A","text":"標準營業員合約"},{"letter":"B","text":"承保商專業守則"},{"letter":"C","text":"保險業條例"},{"letter":"D","text":"保險業監管局發出指引"}],"answer":"B"},{"id":745,"chapter":"6","ref":"6.1.2a","question":"優良保險慣例包括以下那項或那些標準？","options":[{"letter":"A","text":"承保及核保"},{"letter":"B","text":"保單比較分析"},{"letter":"C","text":"客戶權益及責任"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":746,"chapter":"6","ref":"6.1.2a","question":"《承保商專業守則》的目的是對核保、索償產品分析等訂立：","options":[{"letter":"A","text":"銷售慣例"},{"letter":"B","text":"優良保險慣例"},{"letter":"C","text":"投保的優良慣例"},{"letter":"D","text":"索償慣例"}],"answer":"B"},{"id":747,"chapter":"6","ref":"6.1.2a","question":"《承保商專業守則》旨在訂立應有水平的優良保險慣例，包括： i 產品分析 ii 保險合約下的顧客權益及須負的責任 iii 廣泛的顧客權利及權益 iv 提高行業的公眾形象以作為優秀企業公民","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":748,"chapter":"6","ref":"6.1.2b","question":"以下哪項或各項屬於承保商專業守則的提供建議及銷售的做法部份？","options":[{"letter":"A","text":"保單"},{"letter":"B","text":"銷售資料"},{"letter":"C","text":"投保書或建議書"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":749,"chapter":"6","ref":"6.1.2b","question":"以下那項不屬於《承保商專業守則》對提供建議及銷售詳情的要求？","options":[{"letter":"A","text":"提供最新的資料"},{"letter":"B","text":"不會誤導公眾"},{"letter":"C","text":"用淺白易明的文字"},{"letter":"D","text":"把所有競爭對手的產品資料詳細列出"}],"answer":"D"},{"id":750,"chapter":"6","ref":"6.1.2b(b)","question":"根據《承保商專業守則》 ，以下哪項是使用投保書/申請表的部份意見？ i 它應以淺白語言表達 ii 它應小心解釋最高誠信原則要求的重要性 iii 它應以清晰的問題提問重要事實 iv 它必須小心解釋任何附帶問卷的重要性","options":[{"letter":"A","text":"ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":751,"chapter":"6","ref":"6.1.2b(c)","question":"《承保商專業守則》要求保單合約：","options":[{"letter":"A","text":"應該力求清晰及易於理解"},{"letter":"B","text":"提供合約條款可見的證據"},{"letter":"C","text":"於續保時須要披露重要事實的最高誠信原則要求，都應予以小心地解釋"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":752,"chapter":"6","ref":"6.1.2b(c)","question":"保險合約之完整條款的書面證據，通常出現於：","options":[{"letter":"A","text":"保單"},{"letter":"B","text":"投保單"},{"letter":"C","text":"保險憑證"},{"letter":"D","text":"暫保單"}],"answer":"A"},{"id":753,"chapter":"6","ref":"6.1.2c","question":"以下那三項為《承保商專業守則》的索償部份： i 不應不合理地拒絕賠償 ii 應該公平、有效率及迅速地處理索償 iii 損失與違反保證之間應該有因果關係 iv 不涉及欺詐情況下應該通融賠付","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":754,"chapter":"6","ref":"6.1.2c","question":"《承保商專業守則》要求保險人處理索償時：","options":[{"letter":"A","text":"有效率地於合理時間內賠償"},{"letter":"B","text":"拒絕接受索償"},{"letter":"C","text":"發覺違反保證條款時，要提供通融賠款"},{"letter":"D","text":"發覺違反保證條款時，要與損失有因果關係"}],"answer":"A"},{"id":755,"chapter":"6","ref":"6.1.2c(b)","question":"根據《承保商專業守則》，符合兩項條件，違反保證也不應導致索償無效，它們是或包括：","options":[{"letter":"A","text":"損失的金額不超過 1000 元"},{"letter":"B","text":"被保人承認違反保證"},{"letter":"C","text":"損失與違反保證之間並無因果關係"},{"letter":"D","text":"上述任何一項"}],"answer":"C"},{"id":756,"chapter":"6","ref":"6.1.2d","question":"《承保商專業守則》中第四部分的保險代理管理，要求加強注意下列就哪項或哪些項目？","options":[{"letter":"A","text":"保險代理人適當的登記"},{"letter":"B","text":"處理針對保險代理人投訴的適當程序"},{"letter":"C","text":"為保險代理在執行職務上提供足夠的支援"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":757,"chapter":"6","ref":"6.1.2d","question":"根據《承保商專業守則》確保保險代理人遵守法律和一切由保險業聯會所發出的守則其責任在於：","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"保險代理登記委員會"},{"letter":"C","text":"有關保險公司的銷售管理行政主任"},{"letter":"D","text":"保險人，因他是其代理人的委託人"}],"answer":"D"},{"id":758,"chapter":"6","ref":"6.1.3","question":"由保險業聯會發出的「處理投訴的指引」涵蓋：","options":[{"letter":"A","text":"只訂立外部調解糾紛機制"},{"letter":"B","text":"只訂立對處理投訴的內部程序"},{"letter":"C","text":"僅包括正進行法律程序事宜"},{"letter":"D","text":"包括訂立處理投訴的內部程序及外部調解糾紛機制"}],"answer":"D"},{"id":759,"chapter":"6","ref":"6.1.3","question":"處理投訴指引與承保商專業守則之間的聯繫是怎樣的？","options":[{"letter":"A","text":"發出處理投訴指引的目的是更新承保商專業守則"},{"letter":"B","text":"發出處理投訴的指引的目的是補充承保商專業守則在處理查詢投訴和糾紛幾方面的要求"},{"letter":"C","text":"處理投訴指引是承保商專業守則的附件"},{"letter":"D","text":"處理投訴指引由保險代理人遵守，承保商專業守則由保險人遵守"}],"answer":"B"},{"id":760,"chapter":"6","ref":"6.1.3b","question":"根據處理投訴的指引，一名保險人在針對處理因其服務提供的投訴時，必須通知不滿的投訴人，有下列 哪些途徑作進一步的投訴？ i 保險業監理處 ii 香港保險業聨會 iii 保險投訴局 iv 保險代理登記委員會","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iv"}],"answer":"C"},{"id":761,"chapter":"6","ref":"6.1.4","question":"保險投訴局成員包括：","options":[{"letter":"A","text":"本港所有獲授權的保險人"},{"letter":"B","text":"本港獲授權一般業務的保險人而已"},{"letter":"C","text":"本港獲授權長期業務的保險人而已"},{"letter":"D","text":"本港所有承保個人壽險的獲授權保險人"}],"answer":"D"},{"id":762,"chapter":"6","ref":"6.1.4","question":"保險投訴局成立的基本目的是：","options":[{"letter":"A","text":"代表成員處理及給付理賠"},{"letter":"B","text":"處理各類針對保險人之投訴"},{"letter":"C","text":"處理來自以個人作保單持有人的索償投訴"},{"letter":"D","text":"處理來自第三者的法定保險索償"}],"answer":"C"},{"id":763,"chapter":"6","ref":"6.1.4","question":"保險投訴局的成員包括：","options":[{"letter":"A","text":"所有香港的保險人"},{"letter":"B","text":"所有在香港承保個人保險的保險人"},{"letter":"C","text":"所有在香港承保商業保險的保險人"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":764,"chapter":"6","ref":"6.1.4a(a)","question":"以下哪項的主席必須獨立於保險業以及於委任前徵得財經事務局局長的同意：","options":[{"letter":"A","text":"保險業聯會"},{"letter":"B","text":"保險索償投訴委員會"},{"letter":"C","text":"香港保險顧問聯會"},{"letter":"D","text":"證券及期貨事務監督委員會"}],"answer":"B"},{"id":765,"chapter":"6","ref":"6.1.4a(a)","question":"委派保險索償投訴委員會的是","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"香港保險學會"},{"letter":"C","text":"香港保險業聯會"},{"letter":"D","text":"保險投訴局"}],"answer":"D"},{"id":766,"chapter":"6","ref":"6.1.4a(b)","question":"以下哪兩項有關保險投訴局的陳述是正確的? i 一名代表消費者權益 ii 一名代表法律或會計界 iii 一名由保險業監管局保險業監管局委任 iv 一名由香港保險業聯會委任","options":[{"letter":"A","text":"i & ii"},{"letter":"B","text":"i & iii"},{"letter":"C","text":"ii & iii"},{"letter":"D","text":"iii & iv"}],"answer":"A"},{"id":767,"chapter":"6","ref":"6.1.4a(b)","question":"以下哪項對保險投訴局的委員會成員的描述是正確的： i 一個委員會成員是代表消費者權益； ii 一個委員會成員是代表法律/會計專業界； iii 一個委員會成員是由保險業監理專員委任； iv 一個委員會成員是由保險投訴局委任；","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"A"},{"id":768,"chapter":"6","ref":"6.1.4a(b)","question":"保險索償投訴委員會屬於一個獨立組織，由一名主席及多少名委員組成？","options":[{"letter":"A","text":"二名委員"},{"letter":"B","text":"三名委員"},{"letter":"C","text":"四名委員"},{"letter":"D","text":"五名委員"}],"answer":"C"},{"id":769,"chapter":"6","ref":"6.1.4a(b)","question":"保險索償投訴委員會中共有五位成員，當中有多少位委員是由保聨提名？","options":[{"letter":"A","text":"一名委員"},{"letter":"B","text":"二名委員"},{"letter":"C","text":"三名委員"},{"letter":"D","text":"四名委員"}],"answer":"B"},{"id":770,"chapter":"6","ref":"6.1.4b","question":"保險投訴局職權範圍的條件與提出申索人有關，以下哪項不是符合申索的人士？","options":[{"letter":"A","text":"保險合約的第三者"},{"letter":"B","text":"保單的共同持有人"},{"letter":"C","text":"保單的受益人"},{"letter":"D","text":"被轉讓保單的合法索償人"}],"answer":"A"},{"id":771,"chapter":"6","ref":"6.1.4b","question":"以下哪項或哪些最有可能是屬於保險投訴局的職權範圍？","options":[{"letter":"A","text":"續保保費太高"},{"letter":"B","text":"一宗涉及一件完全毀爛價值港元 200 萬的物件的索償糾紛"},{"letter":"C","text":"一宗涉及一名個人受保人的一輛價值港元 30 萬的受保汽車的盜竊索償糾紛"},{"letter":"D","text":"以上三項皆不是"}],"answer":"C"},{"id":772,"chapter":"6","ref":"6.1.4b","question":"以下哪項不屬保險投訴局的職能範圍：","options":[{"letter":"A","text":"索償金額達四百萬"},{"letter":"B","text":"涉及索償的保險人並非保險投訴局會員"},{"letter":"C","text":"索償人已為該糾紛展開法律程序"},{"letter":"D","text":"以上各項皆不屬保險投訴局的職能範圍"}],"answer":"D"},{"id":773,"chapter":"6","ref":"6.1.4b","question":"以下哪項是在保險投訴局的職權範圍內可處理的個案？","options":[{"letter":"A","text":"索償金額不超過一百萬保險投訴局港元"},{"letter":"B","text":"由第三者引起之索償糾紛"},{"letter":"C","text":"正在進行仲裁之索償案件"},{"letter":"D","text":"涉案保單乃團體壽險保單"}],"answer":"A"},{"id":774,"chapter":"6","ref":"6.1.4b","question":"保險投訴局只能處理： i 涉案的保單乃個人保單 ii 由商業、工業及第三者保險引起之索償糾紛 iii 投訴與索償有關的個案 iv 索償金額不超過一百萬港元","options":[{"letter":"A","text":"i, iii, iv"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iv"}],"answer":"A"},{"id":775,"chapter":"6","ref":"6.1.4b","question":"以下哪項屬於保險投訴局的職權範圍？","options":[{"letter":"A","text":"已進入訴訟程序的索償"},{"letter":"B","text":"金額為四十萬港元的索償"},{"letter":"C","text":"道路交通意外中第三者提出的投訴"},{"letter":"D","text":"涉及取消保單後的「不充份」退款的投訴"}],"answer":"B"},{"id":776,"chapter":"6","ref":"6.1.4b","question":"以下哪三項不是保險投訴局的職權範圍？ i 已進入訴訟程序的索償 ii 個人保險索償金額為港元 40 萬 iii 道路交通意外中第三者提出的投訴 iv 涉及取消保單的「不充份」退保的投訴","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":777,"chapter":"6","ref":"6.1.4b","question":"以下哪項是保險投訴局最有可能處理的：","options":[{"letter":"A","text":"涉及續保保費的糾紛"},{"letter":"B","text":"被保險人涉及縱火，保險人拒絕一項 300 萬的火險索償"},{"letter":"C","text":"第三者控告被保險人因疏忽而導致他人受傷"},{"letter":"D","text":"因違犯家居保單中的條件，保險人拒絕一筆 2 萬元的索償"}],"answer":"D"},{"id":778,"chapter":"6","ref":"6.2","question":"以下哪項關於保險代理人的陳述是不正確的：","options":[{"letter":"A","text":"與保險經紀不同，代理人對提供意見不當的風險略為較輕"},{"letter":"B","text":"代理人在執行職務時的不當行為，會負上法律責任"},{"letter":"C","text":"代理人執行職務時必須謹慎"},{"letter":"D","text":"代理人合約中必須要備有專業賠償保險"}],"answer":"D"},{"id":779,"chapter":"6","ref":"6.2","question":"在本港，保險中介人的規管：","options":[{"letter":"A","text":"完全由政府執行"},{"letter":"B","text":"完全由保險業自身執行"},{"letter":"C","text":"即非由政府又並非由保險自身執行"},{"letter":"D","text":"部份由政府，部份由保險業自身執行"}],"answer":"D"},{"id":780,"chapter":"6","ref":"6.2.1","question":"香港保險中介人在角色及職責上的法定參考刊載於：","options":[{"letter":"A","text":"《保險業條例》"},{"letter":"B","text":"《保險中介人(香港)條例》"},{"letter":"C","text":"《保險代理人及經紀條例》"},{"letter":"D","text":"《保險代理人及經紀規例》"}],"answer":"A"},{"id":781,"chapter":"6","ref":"6.2.1","question":"以下哪項或哪些是在香港對保險代理人的法定定義","options":[{"letter":"A","text":"他是代表保單持有人的一名代理人"},{"letter":"B","text":"他是代表一名或多名保險人的代理人"},{"letter":"C","text":"他是負責洽談保險合約的人"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":782,"chapter":"6","ref":"6.2.1(a)","question":"根據《保險業條例》條文，代表一名或多名保險人在香港或從香港就保險合約提供意見或安排該等 合約的人，稱為保險：","options":[{"letter":"A","text":"代理人"},{"letter":"B","text":"經紀"},{"letter":"C","text":"僱員"},{"letter":"D","text":"顧問"}],"answer":"A"},{"id":783,"chapter":"6","ref":"6.2.1(a)","question":"以下哪項內容屬於本港保險代理人的法定定義？","options":[{"letter":"A","text":"出任保單持有人或潛在的保單持有人的代理人"},{"letter":"B","text":"以代理人的身份替一名或多於一名的保險人安排保險合約"},{"letter":"C","text":"從事洽談或安排保險合約的業務"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":784,"chapter":"6","ref":"6.2.1(a)","question":"《保險業條例》禁止任何人擔任「保險代理人」 ，除非他已經：","options":[{"letter":"A","text":"獲發牌"},{"letter":"B","text":"適當通過評審"},{"letter":"C","text":"獲委任"},{"letter":"D","text":"經評審"}],"answer":"C"},{"id":785,"chapter":"6","ref":"6.2.1(a)","question":"委任保險代理人的申請須由下列何人提出確認？","options":[{"letter":"A","text":"該名準代理人本人"},{"letter":"B","text":"該名準代理人的保險公司"},{"letter":"C","text":"該名準代理人所挑選的保薦人"},{"letter":"D","text":"一名與該家保險公司無關的獨立人士"}],"answer":"B"},{"id":786,"chapter":"6","ref":"6.2.1(a)","question":"保險代理人法定定義是：","options":[{"letter":"A","text":"向保單持有人或潛在的保單持有人提供意見"},{"letter":"B","text":"可代表一間或多間保險人"},{"letter":"C","text":"在香港或從香港安排保險合約的人士"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":787,"chapter":"6","ref":"6.2.1(b)","question":"在《保險業條例》中，哪一項是保險經紀必需條件，否則不能行使保險經紀的職責？","options":[{"letter":"A","text":"合資格的保險經紀"},{"letter":"B","text":"已登記的保險經紀"},{"letter":"C","text":"已批核的保險經紀"},{"letter":"D","text":"獲授權的保險經紀"}],"answer":"D"},{"id":788,"chapter":"6","ref":"6.2.1(b)","question":"以下哪項有關保險代理人及經紀的描述是正確的：","options":[{"letter":"A","text":"保險代理人必須獲得委任才可成為保險代理人"},{"letter":"B","text":"保險經紀必須獲得授權才可成為保險經紀"},{"letter":"C","text":"同一個人不得同時作為獲委任的保險代理人及獲授權的保險經紀"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":789,"chapter":"6","ref":"6.2.1(b)","question":"如果是代表保單持有人或潛在保單持有人的代理人經營在香港或從香港洽談或安排保險合約業務的人是：","options":[{"letter":"A","text":"保險經紀"},{"letter":"B","text":"保險代理"},{"letter":"C","text":"保險中間人"},{"letter":"D","text":"保險代表"}],"answer":"A"},{"id":790,"chapter":"6","ref":"6.2.1(b)","question":"保險經紀是指： i 經營在香港或從香港洽談或安排保險合約的業務的人 ii 作為保單持有人或潛在的保單持有人的代理人 iii 經營就有關保險的事宜提供意見的業務的人 iv 一名或多於一名保險人的代理人或分代理人，在香港或從香港就保險合約提供意見或安排該等 合約的人","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"A"},{"id":791,"chapter":"6","ref":"6.2.1(d)","question":"違反《保險業條例》中的保險中介人條文：","options":[{"letter":"A","text":"僅僅是民事過失"},{"letter":"B","text":"可能被判罰款，但不會被判入獄"},{"letter":"C","text":"可能被判入獄，但不會被判罰款"},{"letter":"D","text":"可能被判罰款及入獄"}],"answer":"D"},{"id":792,"chapter":"6","ref":"6.2.1(d)","question":"根據保險業條例的第 X 部分，以下哪一項是正確的？","options":[{"letter":"A","text":"保險代理人及保險經紀是相同的"},{"letter":"B","text":"可以同時作為獲委任的保險代理人及獲授權的保險經紀"},{"letter":"C","text":"保險代理人及保險經紀兩者的角色和職責相當獨立"},{"letter":"D","text":"任何人可同時成為兩位獨立保險代理人的東主"}],"answer":"C"},{"id":793,"chapter":"6","ref":"6.2.1(d)","question":"任何保險代理人的東主或合夥人，不得作為： i 另一保險代理人的僱員 ii 另一保險經紀的東主 iii 另一保險經紀的僱員 iv 另一保險經紀的合夥人","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":794,"chapter":"6","ref":"6.2.1(d)","question":"以下哪項不屬保險業條例的禁止項目？","options":[{"letter":"A","text":"任何保險經紀的東主，不得成為任何保險代理人的東主、僱員或代理"},{"letter":"B","text":"仼何保險代理人的東主不得是另一間保險代理人的東主、僱員或代理"},{"letter":"C","text":"任何保險代理人的僱員，如向任何保單持有人或準保單持人提供意見，該保險代理人不得成為 另一間保險代理人的僱員"},{"letter":"D","text":"任何保險代理人的東主只有在以下情況才可成為另一間保險代理人的董事。該東主不會為該公司"}],"answer":"B"},{"id":795,"chapter":"6","ref":"6.2.1(d)","question":"向保單持有人提供意見 以下哪項不是保險業條例的禁止項目：","options":[{"letter":"A","text":"保險代理人的東主或合夥人，不得作為另一保險代理人或保險經紀的東主，僱員或合夥人"},{"letter":"B","text":"保險經紀的東主或合夥人，如要為保單持有人或潛在保單持有人提供保險意見，不得作為該保險 公司的股東"},{"letter":"C","text":"保險代理人的僱員，如要為保單持有人或潛在保單持有人提供保險意見，不得作為另一保險代理人 或保險經紀的東主、僱員或合夥人"},{"letter":"D","text":"保險代理人的東主、僱員或合夥人，除以下情況不得作為另一保險代理人或保險經紀的董事；"}],"answer":"B"},{"id":796,"chapter":"6","ref":"6.2.1 註","question":"該東主、僱員或合夥人並不會為該公司向保單持有人或潛在保單持有人提供保險意見 在《保險業條例》中，訛稱為保險經紀屬於：","options":[{"letter":"A","text":"刑事罪行，只需罰款，但不需監禁"},{"letter":"B","text":"刑事罪行，只需監禁，但不需罰款"},{"letter":"C","text":"刑事罪行，需要罰款及監禁"},{"letter":"D","text":"不重要行為，只需罰款"}],"answer":"C"},{"id":797,"chapter":"6","ref":"6.2.2","question":"根據《保險代理管理守則》，針對有關保險代理人的條文包括下列哪項或哪些聲明？","options":[{"letter":"A","text":"代理人必須以書面形式委任"},{"letter":"B","text":"代理人必須遵守該守則"},{"letter":"C","text":"代理人必須受一份書面的代理合約約束"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":798,"chapter":"6","ref":"6.2.2a(a)","question":"在《保險代理管理守則》中負責處理保險代理人的保險代理業務的人是：","options":[{"letter":"A","text":"公司要員"},{"letter":"B","text":"負責人"},{"letter":"C","text":"委託人"},{"letter":"D","text":"業務代表"}],"answer":"B"},{"id":799,"chapter":"6","ref":"6.2.2a(a)","question":"《保險代理管理守則》指的保險公司是：","options":[{"letter":"A","text":"正執行任務的保險代理人的直接僱主"},{"letter":"B","text":"保單持有人"},{"letter":"C","text":"受《保險業條例》規範的保險人或勞合社"},{"letter":"D","text":"保險經紀"}],"answer":"C"},{"id":800,"chapter":"6","ref":"6.2.2a(a)","question":"《保險代理管理守則》中所指的「業務代表」包括:","options":[{"letter":"A","text":"—名負責處理某保險人的代理部門的人"},{"letter":"B","text":"就保險事宜代表保險代理人向保單持有人提供意見的人士(不包括保險分代理人)"},{"letter":"C","text":"與保險人有代理合約的保險代理人"},{"letter":"D","text":"保險分代理人"}],"answer":"B"},{"id":801,"chapter":"6","ref":"6.2.2a(b)","question":"若《保險業條例》與《保險代理管理守則》有抵觸時，須以：","options":[{"letter":"A","text":"條例為準"},{"letter":"B","text":"守則為準"},{"letter":"C","text":"法庭為準"},{"letter":"D","text":"保險業聯會解釋為準"}],"answer":"A"},{"id":802,"chapter":"6","ref":"6.2.2a(b)","question":"保險代理管理守則(該守則) 與保險業條例有抵觸之處, 應以那項爲準?","options":[{"letter":"A","text":"須以守則爲準"},{"letter":"B","text":"保險業條例爲準"},{"letter":"C","text":"以兩者較先發行者爲準"},{"letter":"D","text":"以兩者較後發行者爲準"}],"answer":"B"},{"id":803,"chapter":"6","ref":"6.2.2b(a)","question":"根據〈保險代理管理守則〉成立的保險代理登記委員會，它的職能包括以下哪項或哪些？","options":[{"letter":"A","text":"轉介有關投訴予任何保險人"},{"letter":"B","text":"保存委任保險代理人的登記冊"},{"letter":"C","text":"要求保險人採取紀律行動"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":804,"chapter":"6","ref":"6.2.2b(b)","question":"保險代理登記委員會怎樣解釋它如何運作？","options":[{"letter":"A","text":"發信通知保單持有人"},{"letter":"B","text":"於憲報刊登"},{"letter":"C","text":"隨時於中英文報紙刊登"},{"letter":"D","text":"發出指引"}],"answer":"D"},{"id":805,"chapter":"6","ref":"6.2.2b(c)","question":"《保險代理管理守則》之中英文版本如出現分歧，最終由哪個團體決定守則中的含義？","options":[{"letter":"A","text":"法庭"},{"letter":"B","text":"保險業監管局"},{"letter":"C","text":"保險代理登記委員會"},{"letter":"D","text":"香港保險業聯會"}],"answer":"D"},{"id":806,"chapter":"6","ref":"6.2.2c(a)","question":"《保險代理管理守則》丙部規定，聲明保險代理人獲保險公司委任的確認：","options":[{"letter":"A","text":"必須待至保險代理登記委員會的確認之後"},{"letter":"B","text":"毋須待至保險代理登記委員會的確認之後"},{"letter":"C","text":"毋須理會保險代理登記委員會是否批准"},{"letter":"D","text":"即時生效，但受到保險代理登記委員會其後批准所約束"}],"answer":"A"},{"id":807,"chapter":"6","ref":"6.2.2c(a)","question":"根據《保險代理管理守則》丙部規定，保險代理人的委任確認：","options":[{"letter":"A","text":"由保險代理登記委員會直接向保險代理人申請確認"},{"letter":"B","text":"由保險人向保險代理登記委員會提交保險代理人申請並即日確認"},{"letter":"C","text":"由保險人向保險代理登記委員會提交保險代理人申請並於七日後確認"},{"letter":"D","text":"保險代理登記委員會通知保險人確認保險代理人申請，保險人通知保險代理人確認委任"}],"answer":"D"},{"id":808,"chapter":"6","ref":"6.2.2c(i)","question":"在《保險代理管理守則》中，有關對保險代理人進行的培訓必須：","options":[{"letter":"A","text":"由保險業聯會提供"},{"letter":"B","text":"由保險代理登記委員會提供"},{"letter":"C","text":"由保險公司提供"},{"letter":"D","text":"由自己支付"}],"answer":"C"},{"id":809,"chapter":"6","ref":"6.2.2c(b)(i)","question":"根據《保險代理管理守則》，保險代理登記委員會對保險代理人的登記：","options":[{"letter":"A","text":"是自動的"},{"letter":"B","text":"會於申請後盡早生效"},{"letter":"C","text":"於申請後的一年生效"},{"letter":"D","text":"於申請後的一個月生效"}],"answer":"B"},{"id":810,"chapter":"6","ref":"6.2.2c(d)","question":"如代理人想代理綜合保險人的一般和長期業務，按《保險代理管理守則》的規則是：","options":[{"letter":"A","text":"不允許雙重的代表"},{"letter":"B","text":"當作代理一個單一的委託人"},{"letter":"C","text":"當作代理兩個委託人"},{"letter":"D","text":"如得到保險業監理專員同意，可允許代理"}],"answer":"C"},{"id":811,"chapter":"6","ref":"6.2.2c(d)","question":"以下哪項有關保險代理人代表保險人的描述是不正確的？","options":[{"letter":"A","text":"一名保險代理人最多可以代表四間保險公司"},{"letter":"B","text":"一名保險代理人最多可以代表一名長期保險公司"},{"letter":"C","text":"綜合保險人計算為兩間保險公司"},{"letter":"D","text":"一個保險公司集團構成一間單一保險公司"}],"answer":"B"},{"id":812,"chapter":"6","ref":"6.2.2c(d)(i)","question":"《保險代理管理守則》規定，保險代理人可代表保險公司的數目為：","options":[{"letter":"A","text":"最少 4 間"},{"letter":"B","text":"最少一間一般保險"},{"letter":"C","text":"最少一間長期保險"},{"letter":"D","text":"長期保險不得超過 2 間"}],"answer":"D"},{"id":813,"chapter":"6","ref":"6.2.2c(d)(i)","question":"任何代理人最多可以代表：","options":[{"letter":"A","text":"四間保險公司"},{"letter":"B","text":"一間保險公司"},{"letter":"C","text":"兩間保險公司"},{"letter":"D","text":"任何數目之保險公司"}],"answer":"A"},{"id":814,"chapter":"6","ref":"6.2.2c(f)","question":"對保險代理人的要求是：","options":[{"letter":"A","text":"代理合約必須要求代理人遵守守則"},{"letter":"B","text":"代理合約須以書面形式"},{"letter":"C","text":"遵守守則規定"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":815,"chapter":"6","ref":"6.2.2c(g)","question":"根據《保險代理管理守則》保險代理人要確保以下哪類人仕符合「適當人選」準則：","options":[{"letter":"A","text":"它的委託人"},{"letter":"B","text":"它的負責人，但不包括業務代表"},{"letter":"C","text":"它的業務代表，但不包括負責人"},{"letter":"D","text":"它的業務代表及負責人"}],"answer":"D"},{"id":816,"chapter":"6","ref":"6.2.2d(a)","question":"由「保險代理登記委員會」所存放的「保險代理登記冊」 ：","options":[{"letter":"A","text":"可供市民查閱"},{"letter":"B","text":"必須符合保險業監管局的規定"},{"letter":"C","text":"會置放於保險業聯會辦事處"},{"letter":"D","text":"以上各項描述皆正確"}],"answer":"D"},{"id":817,"chapter":"6","ref":"6.2.2d(a)","question":"以下哪項對保險代理人登記冊的描述是正確的：","options":[{"letter":"A","text":"登記冊是由保險業監管局保管的"},{"letter":"B","text":"登記冊是保存在保險業監管局的辦公室"},{"letter":"C","text":"登記冊必須根據保險業監管局的要求保存"},{"letter":"D","text":"屬於機密文件，故不可供公眾參閱"}],"answer":"C"},{"id":818,"chapter":"6","ref":"6.2.2d(a)","question":"保險代理登記委員會確認的保險代理人的登記冊：","options":[{"letter":"A","text":"存放於保險業監管局辦事處內"},{"letter":"B","text":"由保險業監管局管理"},{"letter":"C","text":"存放於保險業聯會辦事處"},{"letter":"D","text":"屬於高度私隱文件，不可對外公開"}],"answer":"C"},{"id":819,"chapter":"6","ref":"6.2.2d(b)(i)","question":"委任保險代理人的申請須由下列那人士提出確認？","options":[{"letter":"A","text":"該名準代理人本人"},{"letter":"B","text":"該名準代理人的保險人"},{"letter":"C","text":"該名準代理人所選擇的保薦人"},{"letter":"D","text":"一名與該保險人無關的獨立人士"}],"answer":"B"},{"id":820,"chapter":"6","ref":"6.2.2d(b)","question":"如果申請人令保險代理登記委員會不信納他符合適當人選準則出任或繼續出任為登記人士: (vi)","options":[{"letter":"A","text":"委員會不得確認委任該人為登記人士"},{"letter":"B","text":"委員會須向保險業聯會呈交報告"},{"letter":"C","text":"向公眾公開事件"},{"letter":"D","text":"按照以上所有程序"}],"answer":"A"},{"id":821,"chapter":"6","ref":"6.2.2d(d)","question":"代理人不滿對其投訴的判決，可以向誰提出上訴？","options":[{"letter":"A","text":"保險投訴局"},{"letter":"B","text":"香港保險學會"},{"letter":"C","text":"保險業監管局"},{"letter":"D","text":"上訴裁判處"}],"answer":"D"},{"id":822,"chapter":"6","ref":"6.2.2d(d)","question":"由保險代理登記委員會對保險代理人作出判決後，該代理人可經由以下哪個機構作出上訴？","options":[{"letter":"A","text":"保險業監理處"},{"letter":"B","text":"上訴裁判處"},{"letter":"C","text":"保險業聯會"},{"letter":"D","text":"有關之保險人"}],"answer":"B"},{"id":823,"chapter":"6","ref":"6.2.2e(a)","question":"以下那項不應與保險代理人的適當人選有關?","options":[{"letter":"A","text":"破產"},{"letter":"B","text":"婚姻狀況"},{"letter":"C","text":"資格"},{"letter":"D","text":"不遵守保險代理管理守則"}],"answer":"B"},{"id":824,"chapter":"6","ref":"6.2.2e(a)","question":"以下哪項或哪些對保險中介人「適當人選準則」會有不良影響？","options":[{"letter":"A","text":"相關的定罪"},{"letter":"B","text":"過往的不當職業行為"},{"letter":"C","text":"未能符合最低資格的要求"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":825,"chapter":"6","ref":"6.2.2e(d)(i)","question":"保險代理人的適當人選不包括：","options":[{"letter":"A","text":"年滿 18 歲"},{"letter":"B","text":"完成中五課程或同等學歷"},{"letter":"C","text":"擁有兩年相關之商務工作經驗"},{"letter":"D","text":"香港永久居民"}],"answer":"C"},{"id":826,"chapter":"6","ref":"6.2.2e(d)(i)","question":"要成為保險代理人，他必須年滿：","options":[{"letter":"A","text":"18 歲"},{"letter":"B","text":"21 歲"},{"letter":"C","text":"25 歲"},{"letter":"D","text":"30 歲"}],"answer":"A"},{"id":827,"chapter":"6","ref":"6.2.2g(b)","question":"銷售長期業務有關的保單時，代理人必須向客人： (v) i 解釋保證收益及預計收益的分別 ii 解釋有投資成份的保單單位值及保單持有人的收益價值可能有波動 iii 解釋所有收益均是有保證的 iv 解釋提早終止合約/退保的後果","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":828,"chapter":"6","ref":"6.2.2g(b)","question":"作為長期業務的保險代理人，在銷售與長期業務有關的保單時，必須： (v) i 解釋合約的長遠性質 ii 解釋保單的保證收益及預計收益的分別 iii 說明預計收益並不是必然的 iv 解釋紅利／股息或會高於或低於現時列出的數據","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":829,"chapter":"6","ref":"6.2.2h(a)","question":"以下那項屬於違規行為指引的內容？","options":[{"letter":"A","text":"不得要求客戶簽署空白的表格"},{"letter":"B","text":"任何內容的改動需由客戶加簽作實"},{"letter":"C","text":"公正地披露所有新舊保單的事實，以便保單持有人全面瞭解轉換保單可能帶來的預計損失"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":830,"chapter":"6","ref":"6.2.2h(a)","question":"銷售人壽保單時，保險代理人必須完成一份由香港保險業聯會不時修訂，稱為’CPD’ 的表格，並提醒 (iii) 顧客留意內容，這英文縮寫為：","options":[{"letter":"A","text":"客戶保單文件 (Client’s Policy Document)"},{"letter":"B","text":"客戶保單聲明書 (Customer Policy Declaration)"},{"letter":"C","text":"客戶保障文件 (Client’s Protection Document)"},{"letter":"D","text":"客戶保障聲明書 (Customer Protection Declaration)"}],"answer":"D"},{"id":831,"chapter":"6","ref":"6.2.2h(c)","question":"保險代理登記委員會發出的「保險代理人、負責人及業務代表的登記生效日期指引」中，說明任何人士 (ii) 於委員會發出的登記確認通知書訂明的日期前，不應出任或顯示自己為任何正在替其委員會辦理登記的 保險公司的保險代理人。以下哪機構是負責訂明該日期的？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"申請人"},{"letter":"C","text":"香港保險業聯會"},{"letter":"D","text":"保險代理登記委員會"}],"answer":"D"},{"id":832,"chapter":"6","ref":"6.2.2h(d)","question":"當一個人取得了所需的學歷和專業考試資格及成為了一個保險代理人：","options":[{"letter":"A","text":"他必須繼續他的教育直到達到大學學位水平"},{"letter":"B","text":"他沒有必要進行進一步的培訓和教育"},{"letter":"C","text":"他必須參與由保險業監管局指明的方式和形式進行的持續專業培訓計劃"},{"letter":"D","text":"沒有需要符合其他要求以持續作為一個保險代理人"}],"answer":"C"},{"id":833,"chapter":"6","ref":"6.2.3","question":"以下哪項或哪些有關香港保險經紀的陳述是正確的？","options":[{"letter":"A","text":"他們必須經保險業監管局授權或是經保險業監管局認可的保險經紀團體的會員"},{"letter":"B","text":"他們的活動受《保險業條例》規限"},{"letter":"C","text":"他們只需自稱「保險顧問」而非「保險經紀」便可避開法定規管"},{"letter":"D","text":"以上(a) 及(b)項都正確"}],"answer":"D"},{"id":834,"chapter":"6","ref":"6.2.3","question":"根據《保險業條例》第 x 部的要求，除非是以下哪項人士，否則不得使用保險經紀的名稱？","options":[{"letter":"A","text":"符合資格的保險經紀"},{"letter":"B","text":"已登記的保險經紀"},{"letter":"C","text":"經評審的保險經紀"},{"letter":"D","text":"獲授權的保險經紀"}],"answer":"D"},{"id":835,"chapter":"6","ref":"6.2.3","question":"當保險經紀符合保險業監管局指明的最低五項限度規定，他還需","options":[{"letter":"A","text":"是保險代理人"},{"letter":"B","text":"擁有大學學位水平"},{"letter":"C","text":"最少已滿 25 歲"},{"letter":"D","text":"成為一個保險經紀團體的會員"}],"answer":"D"},{"id":836,"chapter":"6","ref":"6.2.3","question":"申請成功認可保險經紀團體的團體，必須遵守有關法定要求，並且達到令下列哪個機關滿意的程度？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"保險經紀授權委員會"},{"letter":"C","text":"香港保險業聯會"},{"letter":"D","text":"證卷及期貨事務監察委員會"}],"answer":"A"},{"id":837,"chapter":"6","ref":"6.2.3","question":"要成為一個保險經紀，要獲得那方面授權？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"保險代理登記委員會"},{"letter":"C","text":"香港保險顧問聯會"},{"letter":"D","text":"證券及期貨事務監察委員會"}],"answer":"A"},{"id":838,"chapter":"6","ref":"6.2.3a","question":"保險業監管局指明「保險經紀」的會員之最低限度要求項目是：","options":[{"letter":"A","text":"股本與淨資產"},{"letter":"B","text":"專業賠償保險"},{"letter":"C","text":"備存獨立客戶賬目"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":839,"chapter":"6","ref":"6.2.3a","question":"保險業監管局指明保險經紀團體符合下列哪項最低限度規定？ i 資格及經驗 ii 股本及淨資產 iii 備存妥善的簿冊及賬目 iv 專業賠償保險","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":840,"chapter":"6","ref":"6.2.3a","question":"在申請成為保險經紀業務的人時,須附合以下哪項最低限度規定：","options":[{"letter":"A","text":"資格及經驗"},{"letter":"B","text":"股本及淨資產"},{"letter":"C","text":"須購買專業賠償保險"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":841,"chapter":"6","ref":"6.2.3a 註","question":"申請人如要獲授權成為保險經紀，他必須符合一些規定，並由誰發出的指引所規限？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"香港保險業聯會"},{"letter":"C","text":"保險經紀授權委員會"},{"letter":"D","text":"保險經紀登記委員會"}],"answer":"A"},{"id":842,"chapter":"6","ref":"6.2.3a&d","question":"以下哪三項有關保險經紀的陳述是正確的？ i 他們被視為保險業務的專家 ii 在通常情況下，有關經紀是保險人的代理人 iii 他們必須具備專業賠償保險 iv 保險經紀必須至少符合有關的「最低限度」規定","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":843,"chapter":"6","ref":"6.2.3b(c)","question":"一名保險經紀，必須設有一名須符合若干最低要求的行政總裁，該名行政總裁亦必須屬於:","options":[{"letter":"A","text":"完全獨立於該保險經紀"},{"letter":"B","text":"適當人選"},{"letter":"C","text":"健康良好"},{"letter":"D","text":"最少年滿 30 歲"}],"answer":"B"},{"id":844,"chapter":"6","ref":"6.2.3b(a)","question":"保險經紀申請人可以是：","options":[{"letter":"A","text":"獨資經營"},{"letter":"B","text":"合夥商行"},{"letter":"C","text":"有限公司"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":845,"chapter":"6","ref":"6.2.3c(c)","question":"作為保險經紀，必須附合「最低限度規定」規則包括：","options":[{"letter":"A","text":"會員資格"},{"letter":"B","text":"入會規則"},{"letter":"C","text":"紀律程序"},{"letter":"D","text":"附合以上各項"}],"answer":"D"},{"id":846,"chapter":"6","ref":"6.2.3d(a)","question":"對法團保險經紀的行政總裁之最低要求是：","options":[{"letter":"A","text":"中五程度"},{"letter":"B","text":"年滿 30 歲"},{"letter":"C","text":"身體健康"},{"letter":"D","text":"以上所有各項"}],"answer":"A"},{"id":847,"chapter":"6","ref":"6.2.3d(a)","question":"保險經紀行政總裁適當人選為：","options":[{"letter":"A","text":"從事保險業五年或以上的經驗"},{"letter":"B","text":"核准保險專業資格"},{"letter":"C","text":"認可保險專業資格及 2 年保險業管理經驗"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":848,"chapter":"6","ref":"6.2.3d(a)","question":"保險經紀的業務代表最少為:","options":[{"letter":"A","text":"18 歲"},{"letter":"B","text":"21 歲"},{"letter":"C","text":"25 歲"},{"letter":"D","text":"30 歲"}],"answer":"A"},{"id":849,"chapter":"6","ref":"6.2.3d(a)","question":"成為保險經紀業務代表的條件: i 十八歲以上 ii 二十一歲以上 iii 完成中五或同等學歷 iv 具保險專業認可資格","options":[{"letter":"A","text":"i, iii, iv"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, ii"},{"letter":"D","text":"ii, iv"}],"answer":"A"},{"id":850,"chapter":"6","ref":"6.2.3d(a)","question":"作為保險經紀業務代表，以下哪項描述不正確？","options":[{"letter":"A","text":"必須參與持續專業培訓計劃"},{"letter":"B","text":"大學畢業"},{"letter":"C","text":"18 歲"},{"letter":"D","text":"除非獲得豁免，否則，必須考取有關中介人資格考試並取得及格成績"}],"answer":"B"},{"id":851,"chapter":"6","ref":"6.2.3d(a)","question":"保險經紀及其提名的行政總裁，必須符合以下哪項或哪些最低要求：","options":[{"letter":"A","text":"不論任何職位，從事保險業最少五年"},{"letter":"B","text":"擁有批准的保險資格，無需任何保險工作經驗"},{"letter":"C","text":"擁有認可的保險專業資格，最少兩年保險業管理經驗"},{"letter":"D","text":"以上所有各項皆是"}],"answer":"C"},{"id":852,"chapter":"6","ref":"6.2.3d(a)","question":"根據保險業監管局指明保險經紀〈最低限度規定〉 ，其中兩項有關保險經紀的業務代表的規定為 i 他們必須年滿 18 歲或以上 ii 他們必須大學畢業 iii 除非獲得豁免，他們必須通過保險業監管局認可的保險中介人資格考試並取得及格成績 iv 他們必須取得保險代理登記委員會登記","options":[{"letter":"A","text":"i, iii"},{"letter":"B","text":"i, iv"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"i, ii"}],"answer":"A"},{"id":853,"chapter":"6","ref":"6.2.3d(b)","question":"對於保險經紀的要求，他的淨資產備存必須要達：","options":[{"letter":"A","text":"港幣十萬元"},{"letter":"B","text":"港幣五萬元"},{"letter":"C","text":"港幣一百萬元"},{"letter":"D","text":"港幣二百萬元"}],"answer":"A"},{"id":854,"chapter":"6","ref":"6.2.3d(c)","question":"有關保險經紀必須備有的專業賠償保險，以下哪項或哪些項目正確?","options":[{"letter":"A","text":"最低金額是三百萬"},{"letter":"B","text":"最高金額是七千五百萬"},{"letter":"C","text":"保險經紀可自行訂定最高的彌償限額"},{"letter":"D","text":"以上各項均是"}],"answer":"A"},{"id":855,"chapter":"6","ref":"6.2.3d(c)","question":"有關保險經紀必須備有的專業賠償保險，以下哪項或哪些項目正確?","options":[{"letter":"A","text":"最低金額是三百萬"},{"letter":"B","text":"不必高於七千五百萬"},{"letter":"C","text":"過去 12 個月內佣金收入總額的兩倍"},{"letter":"D","text":"以上各項均是"}],"answer":"D"},{"id":856,"chapter":"6","ref":"6.2.3d(c)","question":"保險經紀需擁有的專業彌償保險限額是不固定的，但是限額不必高於：","options":[{"letter":"A","text":"10 萬"},{"letter":"B","text":"300 萬"},{"letter":"C","text":"1000 萬"},{"letter":"D","text":"7500 萬"}],"answer":"D"},{"id":857,"chapter":"6","ref":"6.2.3d(c)","question":"保險經紀必須備有「專業賠償保險」，最低的賠償限額為：","options":[{"letter":"A","text":"港幣 10 萬元"},{"letter":"B","text":"港幣 200 萬元"},{"letter":"C","text":"港幣 300 萬元"},{"letter":"D","text":"港幣 400 萬元"}],"answer":"C"},{"id":858,"chapter":"6","ref":"6.2.3d(c)","question":"在港的保險經紀必須備有的專業彌償保險的最高限額是 7500 萬，此保險限額：","options":[{"letter":"A","text":"只適用於在香港成立為法團或登記的保險經紀"},{"letter":"B","text":"只適用於為法團的保險經紀"},{"letter":"C","text":"可由保險經紀自行決定增加"},{"letter":"D","text":"可以減少，如保險經紀並非法團"}],"answer":"A"},{"id":859,"chapter":"6","ref":"6.2.3d(e)","question":"針對保險經紀妥善處理簿冊及帳目，以下哪三項是適用的？ i 備存資料要足夠以作審核 ii 備存資料必須從電腦化作儲存 iii 備存資料足以解釋作業交易之紀錄 iv 備存資料能顯示財務狀況","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iv"}],"answer":"B"},{"id":860,"chapter":"6","ref":"6.2.3d(d)","question":"保險經紀必須備存獨立的客戶帳戶，以下哪項或哪些要求適用於處理客戶的款項？","options":[{"letter":"A","text":"應毫無拖延地存放於銀行之內"},{"letter":"B","text":"只能用於有關客戶的用途"},{"letter":"C","text":"保險經紀手上必須最少有一個「客戶賬戶」"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":861,"chapter":"6","ref":"6.2.3d(e)","question":"所有保險經紀必須備存會計及其他紀錄的目的是為了： (i) i 足以解釋各項交易 ii 足以反映業務的財務狀況 iii 可以藉此製備「真實與公平」的財務報表 iv 利用電腦儲存資料","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"A"},{"id":862,"chapter":"6","ref":"6.2.3d(f)","question":"下列哪項不是保險經紀的「適當人選」測試？","options":[{"letter":"A","text":"遵照最高誠信及以正直的方式行事"},{"letter":"B","text":"把客戶的利益放在自己利益之上"},{"letter":"C","text":"不得披露任何從客戶取得的資料"},{"letter":"D","text":"為客人經常選擇最平保費的產品"}],"answer":"D"},{"id":863,"chapter":"6","ref":"6.2.3d(f)","question":"對於保險經紀的「適當人選」測試包括：","options":[{"letter":"A","text":"該保險經紀必須遵守最高誠信的要求"},{"letter":"B","text":"保險經紀及僱員必須本著適當謹慎及努力行事"},{"letter":"C","text":"客戶利益置於保險經紀的利益之上"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":864,"chapter":"6","ref":"6.2.3e","question":"保險經紀團體需：","options":[{"letter":"A","text":"必須向保險業監管局呈交一份核數師報告"},{"letter":"B","text":"財務報表必須於有關限期完結後的六個月內呈交"},{"letter":"C","text":"必須在本身的會員規例中要求會員完成以上兩項"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":865,"chapter":"6","ref":"6.2.3e","question":"保險經紀每年均需提交財務報表及核數師報告，以下哪項陳述是不正確的?","options":[{"letter":"A","text":"報告內保證賬目內的紀錄大致真實"},{"letter":"B","text":"根據核數師意見，所有適用的法定要求已經符合"},{"letter":"C","text":"報告必須於有關財政年度結束後 6 個月內呈交"},{"letter":"D","text":"報告內所示有關業務的盈虧的真實及公平狀況"}],"answer":"A"},{"id":866,"chapter":"6","ref":"6.2.3e(a)","question":"根據《保險業條例》第 69 條獲授權的保險經紀必須向以下哪個機構呈交每年度的財務報表及核數師 報告？","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"香港保險業聯會"},{"letter":"C","text":"證券及期貨事務監察委員會"},{"letter":"D","text":"香港保險經紀業聯會"}],"answer":"A"},{"id":867,"chapter":"6","ref":"6.2.3e(e)","question":"在有關限期完結後的 6 個月內，任何認可之保險經紀團體必須向保險業監管局呈交一份核數師報告，說明","options":[{"letter":"A","text":"它是否已妥善收到了其會員的財務報表及核數師報告"},{"letter":"B","text":"它的財務報表已真實及公平地反映其事務"},{"letter":"C","text":"有否它的會員已經清盤"},{"letter":"D","text":"有否它的會員違反其職員操守"}],"answer":"A"},{"id":868,"chapter":"7","ref":"7.1","question":"下列哪項有關保險中介人對保單持有人的責任是正確的？ i 認識到違反一項條例要求可能牽涉刑事程序 ii 尊重法律的精神及良好的保險慣例 iii 不得從身體上、精神上或教育上有缺憾的人獲取好處 iv 只擔任諮詢人","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":869,"chapter":"7","ref":"7.1","question":"保險中介人對保單持有人的責任不包括：","options":[{"letter":"A","text":"沒有詐騙成分"},{"letter":"B","text":"不得獲取不公平的好處"},{"letter":"C","text":"擔任客戶的決策者"},{"letter":"D","text":"所有行動必須合法"}],"answer":"C"},{"id":870,"chapter":"7","ref":"7.1","question":"以下那項不是保險中介人的共同責任為：","options":[{"letter":"A","text":"不詐騙"},{"letter":"B","text":"行為必須合理及公平"},{"letter":"C","text":"明白違反某些責任，可遭刑事檢控"},{"letter":"D","text":"保險中介人為客人選擇最適合的決定"}],"answer":"D"},{"id":871,"chapter":"7","ref":"7.1","question":"保險代理人及保險經紀對保單持有人的共同責任為：","options":[{"letter":"A","text":"所有行動必須合法"},{"letter":"B","text":"行為必須合理及公平"},{"letter":"C","text":"不應向客戶加諸不必要的影響"},{"letter":"D","text":"包括以上各項"}],"answer":"D"},{"id":872,"chapter":"7","ref":"7.1.1","question":"以下哪三項有關保險經紀的陳述是正確的？ i 他們被視為保險業務上的專家 ii 在通常情況下，有關經紀是保險人的代理人 iii 他們必須具備專業賠償保險 iv 保險經紀必須至少符合有關的「最低限度規定」","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":873,"chapter":"7","ref":"7.1.2","question":"以下哪項不是保險代理人正確陳述？","options":[{"letter":"A","text":"對比保險經紀，保險代理人承擔失實陳述的法律責任較低"},{"letter":"B","text":"必須以書面獲得委任"},{"letter":"C","text":"委託人是保險人"},{"letter":"D","text":"需要購買專業責任保險"}],"answer":"D"},{"id":874,"chapter":"7","ref":"7.1.1(c)","question":"如果中介人是保險經紀，他的一般職責是：","options":[{"letter":"A","text":"將保險人的利益放在首要地位"},{"letter":"B","text":"必須獨立於任何一位保單持有人"},{"letter":"C","text":"令保險公司得到不偏不倚的意見"},{"letter":"D","text":"令保單持有人得到不偏不倚的意見"}],"answer":"D"},{"id":875,"chapter":"7","ref":"7.1.1(d)","question":"以下哪項有關保險經紀的錯誤及遺漏的陳述是正確的？","options":[{"letter":"A","text":"保險經紀有可能被裁定專業疏忽"},{"letter":"B","text":"保險經紀受到專業彌償保險的保障"},{"letter":"C","text":"他們的委托人及有關的被保險人可能有權向他們提出訴訟"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":876,"chapter":"7","ref":"7.1.1(d)","question":"以下

哪項或哪些有關獲授權的保險經紀錯誤及疏忽的描述是正確的？","options":[{"letter":"A","text":"經紀可能被裁定專業疏忽"},{"letter":"B","text":"經紀就僅僅因是獲受權的保險經紀，所以必須對錯誤疏忽付上法律責任"},{"letter":"C","text":"經紀的委托人，即有關的被保險人，可能有權向保險經紀提出訴訟"},{"letter":"D","text":"只有(A)及(C)"}],"answer":"D"},{"id":877,"chapter":"7","ref":"7.1.2(c)","question":"以下哪項有關保險代理人的描述是不正確的?","options":[{"letter":"A","text":"與保險經紀不同，他們須就不當履行責任而負上的機會是小的"},{"letter":"B","text":"他們須就在執行業務時的疏忽而承擔法律責任"},{"letter":"C","text":"他們在執行業務時必須合理謹慎"},{"letter":"D","text":"他們必須根據本身合約而購買專業責任保險"}],"answer":"D"},{"id":878,"chapter":"7","ref":"7.2","question":"以下哪一條法例是用來保障個人資料的呢？","options":[{"letter":"A","text":"個人資料（私人）條例"},{"letter":"B","text":"個人資料（私隱）條例"},{"letter":"C","text":"私人資料（私隱）條例"},{"letter":"D","text":"私人資料（個人）條例"}],"answer":"B"},{"id":879,"chapter":"7","ref":"7.2.1(a)","question":"以下哪項對《個人資料(私隱)條例》範圍的陳述是不正確的?","options":[{"letter":"A","text":"它既涉及自動化資料及人工作業資料"},{"letter":"B","text":"它既涉及公營機構及私營機構"},{"letter":"C","text":"它有法定組織監管整個法例程序"},{"letter":"D","text":"它只涉及私營機構但不包括公營機構"}],"answer":"D"},{"id":880,"chapter":"7","ref":"7.2.1(a)","question":"監察及執行個人資料(私隱)條例的專責人為：","options":[{"letter":"A","text":"保險業監管局"},{"letter":"B","text":"個人資料私人專員"},{"letter":"C","text":"私人資料個人專員"},{"letter":"D","text":"個人資料私隱專員"}],"answer":"D"},{"id":881,"chapter":"7","ref":"7.2.1(b)(i)","question":"《個人資料（私隱）條例》中的「資料」的定義包括以下哪項或哪些元素？","options":[{"letter":"A","text":"個人特徵"},{"letter":"B","text":"任何文件中之任何表示訊息的方式"},{"letter":"C","text":"表示訊息的方式可能包括意見的表達"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":882,"chapter":"7","ref":"7.2.1(c)","question":"以下哪項是正確的資料保障原則？","options":[{"letter":"A","text":"私隱權是絕對的，所以在任何情況下都不能獲得豁免"},{"letter":"B","text":"個人資料只能按照收集時的目的來使用"},{"letter":"C","text":"個人資料的保留時間可過於所需的"},{"letter":"D","text":"資料所屬人沒有權利更正他們的個人資料"}],"answer":"B"},{"id":883,"chapter":"7","ref":"7.2.1(c)(i)","question":"《個人資料(私隱)條例》中的資料保障原則包括以下哪項或哪些項目?","options":[{"letter":"A","text":"公平的個人資料收集"},{"letter":"B","text":"合法的個人資料收集"},{"letter":"C","text":"資料所屬人有權接觸及更正他們的資料"},{"letter":"D","text":"上述所有各項"}],"answer":"D"},{"id":884,"chapter":"7","ref":"7.2.1(c)(ii)","question":"保障資料原則2必須按照個人資料(私隱)條例內列明進行公平資訊行為,如資料使用者聘用資料處理者, 以 代該資料使用者處理個人資料:","options":[{"letter":"A","text":"該資料使用者須採取合約規範方法或其他方法,以防止轉移予該資料處理者的個人資料的保存時間 超過30天"},{"letter":"B","text":"該資料使用者須確保該資料處理者是以香港,澳門或中國居藉"},{"letter":"C","text":"該資料使用者須確保該資料處理者是居於香港"},{"letter":"D","text":"該資料使用者須採取合約規範方法或其他方法,以防止轉移予該資料處理者的個人資料的保存時間"}],"answer":"D"},{"id":885,"chapter":"7","ref":"7.2.1(c)(iii)","question":"超過處理該資料所需的時間 根據《個人資料(私隱)條例》所收集的個人資料只能按收集時的目的或直接有關的目的來使用，除非 當事人：","options":[{"letter":"A","text":"同意"},{"letter":"B","text":"不是香港居民"},{"letter":"C","text":"有犯罪紀錄"},{"letter":"D","text":"所屬人是健康的成年人"}],"answer":"A"},{"id":886,"chapter":"7","ref":"7.2.1(h)","question":"在《個人資料（私隱）條例》中，私隱權並非是絕對的，在下列哪些情況是可豁免呢？","options":[{"letter":"A","text":"在一些合理的法則上"},{"letter":"B","text":"在家居或娛樂的個人資料上"},{"letter":"C","text":"在僱傭條例上的個人資料"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":887,"chapter":"7","ref":"7.2.1(h)","question":"根據《個人資料(私隱)條例》 ，以下那些是私隱權豁免的正確描述： i 公眾利益 ii 國際關係 iii 僱傭關係 iv 涉及風險評估","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"iii, iv"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":888,"chapter":"7","ref":"7.2.1(h)","question":"根據《個人資料(私隱)條例》 ，以下哪項資料之發放可獲豁免：","options":[{"letter":"A","text":"涉及防止罪案的資料"},{"letter":"B","text":"涉及公眾利益的資料"},{"letter":"C","text":"涉及國家安全的資料"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":889,"chapter":"7","ref":"7.3","question":"下列哪項是屬於平等機會事宜？","options":[{"letter":"A","text":"性別"},{"letter":"B","text":"婚姻狀況"},{"letter":"C","text":"殘疾"},{"letter":"D","text":"包括以上各項，但不在此限"}],"answer":"D"},{"id":890,"chapter":"7","ref":"7.3.1","question":"以下哪項不是在香港的不公平歧視有關的法則？","options":[{"letter":"A","text":"性別歧視條例"},{"letter":"B","text":"年齡歧視條例"},{"letter":"C","text":"殘疾歧視條例"},{"letter":"D","text":"家庭崗位歧視條例"}],"answer":"B"},{"id":891,"chapter":"7","ref":"7.3.1","question":"下列哪項在平等機會委員會中屬於平等機會事宜?","options":[{"letter":"A","text":"性別歧視而已"},{"letter":"B","text":"未婚狀況而已"},{"letter":"C","text":"殘疾歧視而已"},{"letter":"D","text":"上述所有各項"}],"answer":"D"},{"id":892,"chapter":"7","ref":"7.3.1","question":"香港有 4 條條例為針對不公平歧視而訂立，它們包括殘疾、家庭崗位、性別及：","options":[{"letter":"A","text":"種族"},{"letter":"B","text":"年齡"},{"letter":"C","text":"身高体重"},{"letter":"D","text":"財務狀況"}],"answer":"A"},{"id":893,"chapter":"7","ref":"7.3.2","question":"對保險業而言，以下那項屬於公平歧視(即合法)的情況：","options":[{"letter":"A","text":"向女性收取較高的汽車保險保費"},{"letter":"B","text":"向女性加設較苛刻的汽車保險條款"},{"letter":"C","text":"向男性收取比同一年齡的女性較高的人壽保險保費"},{"letter":"D","text":"拒絕爲離婚婦女提供家居保險"}],"answer":"C"},{"id":894,"chapter":"7","ref":"7.3.2","question":"對保險業而言，以下那項屬於公平歧視(即合法)的情況：","options":[{"letter":"A","text":"向女性收取較低的人壽保險保費"},{"letter":"B","text":"向男性付出年金款項比同一年齡的女性較多"},{"letter":"C","text":"向殘疾人士的保單加設特定條款"},{"letter":"D","text":"以上所有各項"}],"answer":"D"},{"id":895,"chapter":"7","ref":"7.3.2","question":"以下哪三項較為被保險人視為「公平歧視」： i 為女性提供較低的年金收益 ii 向男性收取較高的人壽保險保費 iii 向女性收取較高的汽車保險保費 iv 在提供人身意外保險時向殘疾人仕收取較高保費","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":896,"chapter":"7","ref":"7.4","question":"以下哪個有關機構向保險人與保險中介人發出防止洗黑錢的指引?","options":[{"letter":"A","text":"保險業聯會"},{"letter":"B","text":"保險業監理處"},{"letter":"C","text":"香港保險顧問聯會"},{"letter":"D","text":"以上三種機構"}],"answer":"B"},{"id":897,"chapter":"7","ref":"7.4.3","question":"容易被利用作爲進行洗錢或恐怖分子籌資活動工具的長期保險合約包括：","options":[{"letter":"A","text":"單位相連或可分紅的整付保費合約"},{"letter":"B","text":"固定及變額年金"},{"letter":"C","text":"(二手)儲蓄壽險保險單"},{"letter":"D","text":"以上各項皆正確"}],"answer":"D"},{"id":898,"chapter":"7","ref":"7.4.3","question":"以下哪些屬於洗錢中常被利用的保險類別？ i 火險 ii 買入年金 iii 汽車保險 iv 單位相連整付保費合約","options":[{"letter":"A","text":"i 及 ii 而已"},{"letter":"B","text":"ii 及 iii 而已"},{"letter":"C","text":"ii 及 iv 而已"},{"letter":"D","text":"i, iii 及 iv 而已"}],"answer":"C"},{"id":899,"chapter":"7","ref":"7.4.4","question":"下列哪項不是洗黑錢的階段？","options":[{"letter":"A","text":"存放"},{"letter":"B","text":"分層交易"},{"letter":"C","text":"整合"},{"letter":"D","text":"配合"}],"answer":"D"},{"id":900,"chapter":"7","ref":"7.4.4","question":"下列哪階段是保險人應該警覺可能洗錢活動發生的階段？","options":[{"letter":"A","text":"以實物方式處置來自非法活動的現金收益"},{"letter":"B","text":"透過複雜多層的金融交易， 將非法得益及其來源分開"},{"letter":"C","text":"整合計劃便實際地把經清洗的得益回流到一般金融體系，令人以為有關收益來自合法的商業活動"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":901,"chapter":"7","ref":"7.4.5","question":"《販毒（追討得益）條例》及《有組織及嚴重罪行條例》 ，都有一個保險人也必須關心的共同應用。這個 應用是：","options":[{"letter":"A","text":"洗錢活動"},{"letter":"B","text":"違反保險中的最高誠信"},{"letter":"C","text":"在香港夜總會使用毒品"},{"letter":"D","text":"對保險索償職員使用暴力"}],"answer":"A"},{"id":902,"chapter":"7","ref":"7.4.5","question":"香港特別行政區政府為打擊恐佈份子活動的措施包括：","options":[{"letter":"A","text":"《香港〈反恐佈主義措施〉條例》"},{"letter":"B","text":"《聯合國〈反恐佈主義措施〉條例》"},{"letter":"C","text":"《聯合國〈反洗黑錢〉條例》"},{"letter":"D","text":"上述所有各項"}],"answer":"B"},{"id":903,"chapter":"7","ref":"7.4.6a","question":"保險業監理處發出《打擊洗錢及恐怖分子資金籌集指引》，此《指引》的目的在於:","options":[{"letter":"A","text":"對恐怖分子資金籌集立法"},{"letter":"B","text":"提供有關洗錢及恐怖分子資金籌集的一般背景資料"},{"letter":"C","text":"制訂相關經營領域的政策、程序及管控措施,以符合打擊洗錢/恐怖分子資金籌集的法定及監管規定"},{"letter":"D","text":"制訂相關經營領域的程序，以符合打擊洗錢/恐怖分子資金籌集的法定及監管規定"}],"answer":"B"},{"id":904,"chapter":"7","ref":"7.4.6a","question":"保險業監理處向某些人發出恐怖分子資金籌集的正式指引，當中不包括:","options":[{"letter":"A","text":"再保險人"},{"letter":"B","text":"由銀行業條例設立的金融機構"},{"letter":"C","text":"獲授權保險經紀"},{"letter":"D","text":"獲委任保險代理人"}],"answer":"C"},{"id":905,"chapter":"7","ref":"7.4.6b","question":"保險業監理處發出《打擊洗錢及恐怖分子資金籌集指引》。金融機構在設立打擊洗錢/恐怖分子資金籌集制 度時， 必須考慮《指引》中指出的因素，所制訂的管控措施應涵蓋的範疇包括：","options":[{"letter":"A","text":"使用外國貨幣"},{"letter":"B","text":"一名法律主任"},{"letter":"C","text":"一名洗錢報告主任"},{"letter":"D","text":"一名代理行政主任"}],"answer":"C"},{"id":906,"chapter":"7","ref":"7.5","question":"下面哪項構成貪污，必須避免觸犯？","options":[{"letter":"A","text":"個人在沒有獲授權的情況謀取私利，從而引致他人利益受損"},{"letter":"B","text":"個人為謀取私利從而濫用職權"},{"letter":"C","text":"個人不惜損害他人的利益，為謀取私利而濫用職權"},{"letter":"D","text":"個人挪用他人的財產"}],"answer":"C"},{"id":907,"chapter":"7","ref":"7.5","question":"以下哪項是防止賄賂條例中規定代理人須遵守或避免的行為?","options":[{"letter":"A","text":"代理人(通常是僱員)在處理主事人的業務或事務時，如無主事人的允許，不得私下創業"},{"letter":"B","text":"代理人(通常是僱員)在處理主事人的業務或事務時，儘管代理關係已終止，不得私下創業"},{"letter":"C","text":"代理人(通常是僱員)在處理主事人的業務或事務時，如無主事人的允許，不得收受利益"},{"letter":"D","text":"代理人(通常是僱員)在處理主事人的業務或事務時，如無主事人的允許，不得委託分代理人行事"}],"answer":"C"},{"id":908,"chapter":"7","ref":"7.6","question":"有關保險事宜的詐騙：","options":[{"letter":"A","text":"可循不同途徑及索償時產生"},{"letter":"B","text":"只出現在索償時"},{"letter":"C","text":"不會出現於人壽保險"},{"letter":"D","text":"只出現於損害索償過程中"}],"answer":"A"},{"id":909,"chapter":"7","ref":"7.6.1","question":"如果保險代理人協助保單持有人進行詐騙，該保險代理人將被視為：","options":[{"letter":"A","text":"保險人的代理人"},{"letter":"B","text":"投保人／被保人的從犯"},{"letter":"C","text":"保單持有人的合伙人"},{"letter":"D","text":"保險經紀"}],"answer":"B"},{"id":910,"chapter":"7","ref":"7.6.1","question":"協助保單持有人向保險人進行詐騙性索償的中介人：","options":[{"letter":"A","text":"因該索償而須向該保單持有人負上法律責任"},{"letter":"B","text":"對這項行動沒有法律責任"},{"letter":"C","text":"總會被視為該保險人的代理人"},{"letter":"D","text":"將被視為該保單持有人的從犯"}],"answer":"D"},{"id":911,"chapter":"7","ref":"7.6.2","question":"對保險代理人而言，以下哪項或哪些技術性地構成詐騙？","options":[{"letter":"A","text":"建議客戶不要透露某些重要事實"},{"letter":"B","text":"在詐騙索償中，沒有將明確的資料交給保險人"},{"letter":"C","text":"在安排保險過程中，故意隱瞞一些不良影響的資料"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":912,"chapter":"7","ref":"7.6.3","question":"有甚麼實際步驟可以防止詐騙？","options":[{"letter":"A","text":"對每位客戶應存有懷疑"},{"letter":"B","text":"盡量減少與保險人聯絡"},{"letter":"C","text":"保持警覺"},{"letter":"D","text":"以上各項都是"}],"answer":"C"},{"id":913,"chapter":"7","ref":"7.6.3(a)","question":"在各種防止詐騙的實際方法中，保險業職員值得考慮的其中最重要一項為：","options":[{"letter":"A","text":"保持警覺，它可以在任何情況下出現"},{"letter":"B","text":"對任何索償人士投以極大懷疑"},{"letter":"C","text":"瞭解到它只會於大額索償時出現"},{"letter":"D","text":"對每一極小的細節均要求嚴格的證明及確認"}],"answer":"A"}];

    function readStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (error) {
        return false;
      }
    }

    function hasStorageValue(key) {
      try {
        return localStorage.getItem(key) !== null;
      } catch (error) {
        return false;
      }
    }

    function migrateStorage() {
      const oldWrong = readStorage("p1masterWrongQuestions", null);
      if (oldWrong && !hasStorageValue(STORAGE_KEYS.wrong)) writeStorage(STORAGE_KEYS.wrong, oldWrong);
      const oldChecklist = readStorage("p1masterChecklist", null);
      if (oldChecklist && !hasStorageValue(STORAGE_KEYS.checklist)) writeStorage(STORAGE_KEYS.checklist, oldChecklist);
    }

      neighbors.get(edge.target).add(edge.source);
    });

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"

    }

      const term = searchInput.value.trim().toLowerCase();

      const haystack = [node.label, node.sub, detail.title, detail.chapter, detail.summary, ...(detail.bullets || []), ...(detail.mistakes || [])].join(" ").toLowerCase();
      const chapterPass = activeChapter === "all" || node.id === activeChapter || node.group === activeChapter || node.parent === activeChapter;
      const searchPass = !term || haystack.includes(term);
      return chapterPass && searchPass;
    }

    function renderGraph() {
      svg.innerHTML = "";
      const width = stage.clientWidth;
      const height = Math.max(stage.clientHeight, window.innerHeight - 84);
      const centerX = width / 2;
      const centerY = height / 2;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const linkGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.append(linkGroup, nodeGroup);

      const toScreen = node => ({
        x: centerX + node.x * scale,
        y: centerY + node.y * scale
      });

      edges.forEach(edge => {
        const source = toScreen(nodeById.get(edge.source));
        const target = toScreen(nodeById.get(edge.target));
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.classList.add("link");
        line.dataset.source = edge.source;
        line.dataset.target = edge.target;
        line.setAttribute("x1", source.x);
        line.setAttribute("y1", source.y);
        line.setAttribute("x2", target.x);
        line.setAttribute("y2", target.y);
        linkGroup.appendChild(line);
      });

      nodes.forEach(node => {
        const point = toScreen(node);
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.classList.add("node");
        group.dataset.id = node.id;
        group.style.setProperty("--node-color", colorFor(node.group));
        group.setAttribute("transform", `translate(${point.x},${point.y})`);

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", node.size || 19);
        circle.setAttribute("aria-hidden", "true");
        group.appendChild(circle);

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.textContent = node.label;
        label.setAttribute("y", node.sub ? -4 : 0);
        group.appendChild(label);

        if (node.sub) {
          const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
          sub.textContent = node.sub;
          sub.classList.add("subtext");
          sub.setAttribute("y", 12);
          group.appendChild(sub);
        }

        group.addEventListener("mouseenter", event => {
          selectedId = node.id;
          updateGraph();
          showTooltip(node.id, event);
        });
        group.addEventListener("mousemove", event => moveTooltip(event));
        group.addEventListener("mouseleave", () => {
          tooltip.classList.remove("visible");
        });
        group.addEventListener("click", () => {
          selectedId = node.id;
          renderDetail(node.id);
          updateGraph();
        });

        nodeGroup.appendChild(group);
      });

      updateGraph();
    }

    function updateGraph() {
      const visibleIds = new Set(nodes.filter(currentMatches).map(n => n.id));
      document.querySelectorAll(".node").forEach(el => {
        const id = el.dataset.id;
        const visible = visibleIds.has(id);
        el.classList.toggle("hidden", !visible);
        el.classList.toggle("selected", id === selectedId);
        el.classList.toggle("focused", isFocused(id));
        el.classList.toggle("dim", visible && selectedId && !isFocused(id));
      });
      document.querySelectorAll(".link").forEach(el => {
        const source = el.dataset.source;
        const target = el.dataset.target;
        const visible = visibleIds.has(source) && visibleIds.has(target);
        const focused = selectedId && (source === selectedId || target === selectedId);
        el.classList.toggle("hidden", !visible);
        el.classList.toggle("focused", focused);
        el.style.opacity = visible ? (focused ? ".92" : ".45") : "0";
      });
    }

    function showTooltip(id, event) {
      const detail = nodeDetails[id] || {};
      tooltip.innerHTML = `<strong>${escapeHTML(detail.title || nodeById.get(id).label)}</strong><p>${escapeHTML(detail.summary || "")}</p>`;
      moveTooltip(event);
      tooltip.classList.add("visible");
    }

    function moveTooltip(event) {
      const rect = stage.getBoundingClientRect();
      const x = Math.min(event.clientX - rect.left + 14, rect.width - 330);
      const y = Math.min(event.clientY - rect.top + 14, rect.height - 160);
      tooltip.style.left = `${Math.max(10, x)}px`;
      tooltip.style.top = `${Math.max(10, y)}px`;
    }

          writeStorage(STORAGE_KEYS.checklist, saved);
          input.nextElementSibling.classList.toggle("done", input.checked);

      const history = Object.values(getAnswerHistory());
      const answered = history.length;
      const correct = history.filter(item => item.correct).length;
      const rate = answered ? Math.round((correct / answered) * 100) : 0;
      return { answered, correct, rate };
    }

    function resetProgressData() {
      practiceState = { ...DEFAULT_PRACTICE_STATE };
      setWrongStore({});
      setAnswerHistory({});
      savePracticeState();
    }

    function exportProgressData() {
      const payload = {
        version: 1,
        app: "iiqe-paper1-study-web",
        exportedAt: new Date().toISOString(),
        practiceState,
        wrongQuestions: getWrongStore(),
        answerHistory: getAnswerHistory(),
        checklist: readStorage(STORAGE_KEYS.checklist, {})
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "iiqe-paper1-study-progress.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    function importProgressData(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const payload = JSON.parse(reader.result);
          practiceState = {
            ...DEFAULT_PRACTICE_STATE,
            ...(payload.practiceState || {})
          };
          setWrongStore(payload.wrongQuestions || payload.wrongStore || {});
          setAnswerHistory(payload.answerHistory || {});
          writeStorage(STORAGE_KEYS.checklist, payload.checklist || {});
          savePracticeState();
          renderPractice();
        } catch (error) {
          window.alert("导入失败，请确认文件是从本页面导出的学习记录。");
        }
      });
      reader.readAsText(file);
    }

    function chapterLabel(chapter) {
      if (chapter === "all") return "全部章节";
      const found = chapters.find(item => item.id === `c${chapter}`);
      return found ? found.short : `第 ${chapter} 章`;
    }

    function nodeForQuestion(question) {
      const ref = question.ref || "";
      if (ref.startsWith("1.1.1")) return "risk_definition";
      if (ref.startsWith("1.1.2")) return "risk_types";
      if (ref.startsWith("1.1.3")) return "risk_management";
      if (ref.startsWith("1.2")) return "insurance_functions";
      if (ref.startsWith("2.1.3")) return "contract_elements";
      if (ref.startsWith("2.1")) return "contract_law";
      if (ref.startsWith("2.2.3")) return "agency_authority";
      if (ref.startsWith("2.2.4") || ref.startsWith("2.2.5")) return "agency_duties";
      if (ref.startsWith("2.2.6")) return "agency_end";
      if (ref.startsWith("2.2")) return "agency_law";
      if (ref.startsWith("3.1")) return "insurable_interest";
      if (ref.startsWith("3.2")) return "utmost_good_faith";
      if (ref.startsWith("3.3")) return "proximate_cause";
      if (ref.startsWith("3.4")) return "indemnity";
      if (ref.startsWith("3.5")) return "contribution";
      if (ref.startsWith("3.6")) return "subrogation";
      if (ref.startsWith("4.5")) return "underwriting";
      if (ref.startsWith("4.7")) return "claims";
      if (ref.startsWith("4.8")) return "reinsurance";
      if (ref.startsWith("4.9")) return "actuarial";
      if (ref.startsWith("5.1")) return "business_classes";
      if (ref.startsWith("5.5")) return "industry_bodies";
      if (ref.startsWith("6.1.1")) return "insurance_ordinance";
      if (ref.startsWith("6.1.2") || ref.startsWith("6.1.3")) return "codes_guidelines";
      if (ref.startsWith("6.1.4")) return "complaints";
      if (ref.startsWith("6.2")) return "intermediary_regulation";
      if (ref.startsWith("7.1")) return "client_duties";
      if (ref.startsWith("7.2")) return "privacy";
      if (ref.startsWith("7.3")) return "equality";
      if (ref.startsWith("7.4")) return "aml";
      if (ref.startsWith("7.5") || ref.startsWith("7.6")) return "bribery_fraud";
      return `c${question.chapter}`;
    }

    function getPracticeQuestions() {
      const wrongStore = getWrongStore();
      const term = practiceState.query.trim().toLowerCase();
      return questionBank.filter(question => {
        const chapterPass = practiceState.chapter === "all" || question.chapter === practiceState.chapter;
        const wrongPass = !practiceState.wrongOnly || wrongStore[question.id];
        const text = `${question.ref} ${question.question} ${question.options.map(option => option.text).join(" ")}`.toLowerCase();
        const searchPass = !term || text.includes(term);
        return chapterPass && wrongPass && searchPass;
      });
    }

    function renderPractice() {
      const wrongStore = getWrongStore();
      const filtered = getPracticeQuestions();
      if (practiceState.index >= filtered.length) practiceState.index = 0;
      if (practiceState.index < 0) practiceState.index = 0;
      savePracticeState();
      const question = filtered[practiceState.index] || null;
      const chapterCounts = questionBank.reduce((acc, item) => {
        acc[item.chapter] = (acc[item.chapter] || 0) + 1;
        return acc;
      }, {});
      const wrongCount = Object.keys(wrongStore).length;
      const progress = getProgressStats();

      detailPanel.innerHTML = `
        <h2>刷题模式</h2>
        <div class="meta">
          <span class="tag">题库 ${questionBank.length} 题</span>
          <span class="tag">当前 ${filtered.length} 题</span>
          <span class="tag">已做 ${progress.answered} 题</span>
          <span class="tag">正确率 ${progress.rate}%</span>
          <span class="tag">错题 ${wrongCount} 题</span>
        </div>
        <div class="detail-block practice-controls">
          <div class="practice-filter-row">
            <button class="practice-chip ${practiceState.chapter === "all" ? "active" : ""}" data-practice-chapter="all">全部 ${questionBank.length}</button>
            ${["1","2","3","4","5","6","7"].map(chapter => `<button class="practice-chip ${practiceState.chapter === chapter ? "active" : ""}" data-practice-chapter="${chapter}">第 ${chapter} 章 ${chapterCounts[chapter] || 0}</button>`).join("")}
          </div>
          <input class="practice-search" id="questionSearch" type="search" value="${escapeHTML(practiceState.query)}" placeholder="搜索题干、选项或参考章节，例如 3.6、近因、经纪">
          <label class="check-item">
            <input type="checkbox" id="wrongOnly" ${practiceState.wrongOnly ? "checked" : ""}>
            <span>只看错题本</span>
          </label>
          <div class="practice-storage-row">
            <button class="mode-button" id="exportProgress">导出记录</button>
            <button class="mode-button" id="importProgress">导入记录</button>
            <button class="mode-button" id="clearProgress">清空进度</button>
            <input class="hidden" id="importProgressFile" type="file" accept="application/json">
          </div>
        </div>
        ${question ? renderQuestionCard(question, filtered.length, wrongStore) : renderEmptyPractice()}
        <p class="source-note">题库共 ${questionBank.length} 条选择题，覆盖 IIQE 试卷一常见章节。刷题进度、答题记录和错题本会保存在当前浏览器；换设备时可用“导出记录 / 导入记录”迁移。</p>
      `;
      bindPracticeEvents(filtered);
    }

    function renderQuestionCard(question, total, wrongStore) {
      const hiddenAnswers = practiceState.hiddenAnswers || {};
      const savedAnswer = hiddenAnswers[question.id] ? null : getAnswerHistory()[question.id];
      const selected = practiceState.selected ?? savedAnswer?.selected ?? null;
      const answered = selected !== null || practiceState.revealed;
      const correct = selected === question.answer;
      const answerOption = question.options.find(option => option.letter === question.answer);
      const relatedNode = nodeForQuestion(question);
      const relatedTitle = nodeDetails[relatedNode]?.title || nodeById.get(relatedNode)?.label || "相关知识点";

      return `
        <div class="detail-block question-card">
          <div class="meta">
            <span class="tag">第 ${practiceState.index + 1} / ${total} 题</span>
            <span class="tag">${escapeHTML(chapterLabel(question.chapter))}</span>
            <span class="tag">参考章节 ${escapeHTML(question.ref)}</span>
            ${wrongStore[question.id] ? `<span class="tag" style="border-color: var(--red); color: var(--red)">错题本</span>` : ""}
          </div>
          <div class="question-title">${escapeHTML(question.question)}</div>
          <div class="option-list">
            ${question.options.map(option => {
              const isCorrect = answered && option.letter === question.answer;
              const isWrong = selected === option.letter && option.letter !== question.answer;
              return `
                <button class="option-button ${isCorrect ? "correct" : ""} ${isWrong ? "wrong" : ""}" data-answer="${option.letter}">
                  <span class="letter">${option.letter}</span>${escapeHTML(option.text)}
                </button>
              `;
            }).join("")}
          </div>
          ${answered ? `
            <div class="answer-note">
              ${selected ? (correct ? "答对了。" : `答错了，你选的是 ${selected}。`) : "已显示答案。"}
              正确答案是 ${question.answer}：${escapeHTML(answerOption?.text || "")}
              <br>关联知识点：<button class="practice-chip" data-open-node="${relatedNode}">${escapeHTML(relatedTitle)}</button>
            </div>
          ` : ""}
          <div class="practice-actions">
            <button class="mode-button" id="prevQuestion">上一题</button>
            <button class="mode-button" id="nextQuestion">下一题</button>
            <button class="mode-button" id="randomQuestion">随机题</button>
            <button class="mode-button" id="revealAnswer">${answered ? "隐藏答案" : "显示答案"}</button>
            <button class="mode-button" id="toggleWrong">${wrongStore[question.id] ? "移出错题本" : "加入错题本"}</button>
          </div>
        </div>
      `;
    }

    function renderEmptyPractice() {
      return `
        <div class="detail-block">
          <h3>没有匹配题目</h3>
          <p>调整章节、搜索词，或关闭“只看错题本”。</p>
        </div>
      `;
    }

    function resetPracticeAnswer() {
      practiceState.selected = null;
      practiceState.revealed = false;
    }

    function bindPracticeEvents(filtered) {
      detailPanel.querySelectorAll("[data-practice-chapter]").forEach(button => {
        button.addEventListener("click", () => {
          practiceState.chapter = button.dataset.practiceChapter;
          practiceState.index = 0;
          resetPracticeAnswer();
          savePracticeState();
          renderPractice();
        });
      });
      const search = document.getElementById("questionSearch");
      if (search) {
        search.addEventListener("input", () => {
          practiceState.query = search.value;
          practiceState.index = 0;
          resetPracticeAnswer();
          savePracticeState();
          window.clearTimeout(practiceSearchTimer);
          practiceSearchTimer = window.setTimeout(renderPractice, 220);
        });
      }
      const wrongOnly = document.getElementById("wrongOnly");
      if (wrongOnly) {
        wrongOnly.addEventListener("change", () => {
          practiceState.wrongOnly = wrongOnly.checked;
          practiceState.index = 0;
          resetPracticeAnswer();
          savePracticeState();
          renderPractice();
        });
      }
      detailPanel.querySelectorAll("[data-answer]").forEach(button => {
        button.addEventListener("click", () => {
          const question = filtered[practiceState.index];
          if (!question) return;
          practiceState.selected = button.dataset.answer;
          practiceState.revealed = true;
          if (!practiceState.hiddenAnswers) practiceState.hiddenAnswers = {};
          delete practiceState.hiddenAnswers[question.id];
          recordAnswer(question, practiceState.selected);
          const wrongStore = getWrongStore();
          if (practiceState.selected !== question.answer) {
            wrongStore[question.id] = true;
          } else {
            delete wrongStore[question.id];
          }
          setWrongStore(wrongStore);
          savePracticeState();
          renderPractice();
        });
      });
      const prev = document.getElementById("prevQuestion");
      if (prev) prev.addEventListener("click", () => {
        practiceState.index = (practiceState.index + filtered.length - 1) % filtered.length;
        resetPracticeAnswer();
        savePracticeState();
        renderPractice();
      });
      const next = document.getElementById("nextQuestion");
      if (next) next.addEventListener("click", () => {
        practiceState.index = (practiceState.index + 1) % filtered.length;
        resetPracticeAnswer();
        savePracticeState();
        renderPractice();
      });
      const random = document.getElementById("randomQuestion");
      if (random) random.addEventListener("click", () => {
        practiceState.index = Math.floor(Math.random() * filtered.length);
        resetPracticeAnswer();
        savePracticeState();
        renderPractice();
      });
      const reveal = document.getElementById("revealAnswer");
      if (reveal) reveal.addEventListener("click", () => {
        const question = filtered[practiceState.index];
        if (!question) return;
        const savedAnswer = getAnswerHistory()[question.id];
        const isShowing = practiceState.revealed || practiceState.selected !== null || Boolean(savedAnswer && !practiceState.hiddenAnswers?.[question.id]);
        if (!practiceState.hiddenAnswers) practiceState.hiddenAnswers = {};
        if (isShowing) {
          practiceState.revealed = false;
          practiceState.selected = null;
          practiceState.hiddenAnswers[question.id] = true;
        } else {
          practiceState.revealed = true;
          delete practiceState.hiddenAnswers[question.id];
        }
        savePracticeState();
        renderPractice();
      });
      const toggleWrong = document.getElementById("toggleWrong");
      if (toggleWrong) toggleWrong.addEventListener("click", () => {
        const question = filtered[practiceState.index];
        if (!question) return;
        const wrongStore = getWrongStore();
        if (wrongStore[question.id]) delete wrongStore[question.id];
        else wrongStore[question.id] = true;
        setWrongStore(wrongStore);
        renderPractice();
      });
      const exportButton = document.getElementById("exportProgress");
      if (exportButton) exportButton.addEventListener("click", exportProgressData);
      const importButton = document.getElementById("importProgress");
      const importInput = document.getElementById("importProgressFile");
      if (importButton && importInput) {
        importButton.addEventListener("click", () => importInput.click());
        importInput.addEventListener("change", () => importProgressData(importInput.files?.[0]));
      }
      const clearProgress = document.getElementById("clearProgress");
      if (clearProgress) clearProgress.addEventListener("click", () => {
        if (!window.confirm("确定清空当前浏览器里的刷题进度、答题记录和错题本吗？")) return;
        resetProgressData();
        renderPractice();
      });
      detailPanel.querySelectorAll("[data-open-node]").forEach(button => {
        button.addEventListener("click", () => {
          selectedId = button.dataset.openNode;
          setMode("map");
          updateGraph();
        });
      });
    }

    function applyModeChrome() {
      appShell.classList.toggle("solo-view", mode === "outline" || mode === "practice" || mode === "quiz");
      appShell.classList.toggle("practice-view", mode === "practice");
      appShell.classList.toggle("quiz-view", mode === "quiz");
      document.querySelectorAll("[data-mode]").forEach(item => item.classList.toggle("active", item.dataset.mode === mode));
    }

    function setMode(nextMode) {
      mode = nextMode;
      if (location.hash.replace("#", "") !== mode) {
        history.replaceState(null, "", `#${mode}`);
      }
      applyModeChrome();
      if (mode === "quiz") {
        renderQuiz();
      } else if (mode === "outline") {
        renderOutline();
      } else if (mode === "practice") {
        renderPractice();
      } else {
        renderDetail(selectedId);
      }
    }

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    document.getElementById("zoomIn").addEventListener("click", () => {
      scale = Math.min(1.45, scale + .12);
      renderGraph();
    });
    document.getElementById("zoomOut").addEventListener("click", () => {
      scale = Math.max(.62, scale - .12);
      renderGraph();
    });
    document.getElementById("resetView").addEventListener("click", () => {
      scale = 1;
      activeChapter = "all";
      selectedId = "root";
      searchInput.value = "";
      [...chapterList.querySelectorAll(".chapter-button")].forEach(item => item.classList.toggle("active", item.dataset.chapter === "all"));
      setMode("map");
      renderGraph();
      renderDetail("root");
    });
    searchInput.addEventListener("input", () => {
      if (searchInput.value.trim() && activeChapter !== "all") {
        activeChapter = "all";
        [...chapterList.querySelectorAll(".chapter-button")].forEach(item => item.classList.toggle("active", item.dataset.chapter === "all"));
      }
      updateGraph();
    });
    window.addEventListener("resize", renderGraph);

    renderChapters();
    renderGraph();
    const initialMode = location.hash.replace("#", "");
    if (["map", "outline", "practice", "quiz"].includes(initialMode)) {
      setMode(initialMode);
    } else {
      applyModeChrome();
      renderDetail("root");
    }
  </script>
</body>
</html>

er":"D","text":"彌償"}],"answer":"C"},{"id":258,"chapter":"3","ref":"3.1.1","question":"對飛機的可保權益來自？","options":[{"letter":"A","text":"對該飛機的財務價值"},{"letter":"B","text":"對該飛機的購買意欲"},{"letter":"C","text":"對該飛機的法律認可關係"},{"letter":"D","text":"所需繳付的保費"}],"answer":"C"},{"id":259,"chapter":"3","ref":"3.1.2","question":"沒有可保權益的情況下，以下那項處理方法是不正確的？","options":[{"letter":"A","text":"已繳交的保費一定不獲退還"},{"letter":"B","text":"保單合約無效"},{"letter":"C","text":"有關損失不獲賠償"},{"letter":"D","text":"在不知悉無效情況下支付的保費可獲退回"}],"answer":"A"},{"id":260,"chapter":"3","ref":"3.1.2","question":"如沒有可保權益的保險，以下的處理方法是正確的？","options":[{"letter":"A","text":"該份保險合約從索償產生時開始被視為無效"},{"letter":"B","text":"保險人可從沒有可保權益所產生的損失不提供賠償"},{"letter":"C","text":"該份保險屬於可使無效"},{"letter":"D","text":"己支付的保費和保險金一般是可退回的"}],"answer":"D"},{"id":261,"chapter":"3","ref":"3.1.2","question":"下列哪項有關沒有可保權益的保險的陳述是正確的？","options":[{"letter":"A","text":"可以宣佈該項保險從索償產生時開始無效"},{"letter":"B","text":"保險人不須根據該分保險合約承擔賠償責任"},{"letter":"C","text":"只是那些由缺乏可保權益導致的損失才不獲賠償"},{"letter":"D","text":"該項保險屬於何使無效"}],"answer":"D"},{"id":262,"chapter":"3","ref":"3.1.3","question":"以下哪項有關可保權益的描述是不正確？","options":[{"letter":"A","text":"所有類型的保險都必須有的"},{"letter":"B","text":"通常存在著與保險標的之間有一種財務關係"},{"letter":"C","text":"這是就保險標的的生命購買保障時無所須的"},{"letter":"D","text":"這是一種對保險標的的法律認可關係"}],"answer":"C"},{"id":263,"chapter":"3","ref":"3.1.3","question":"以下哪三項一般被視為可保權益的要素? i 一些可以受保的東西 ii 與保險標的的法律認可關係 iii 以該東西作為保險標的 iv 保險標的必須為實質物體(例如：建築物)","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":264,"chapter":"3","ref":"3.1.3","question":"以下哪項不屬於可保權益的必要條件？","options":[{"letter":"A","text":"可保標的必須是購買回來的，不可以是偷回來的"},{"letter":"B","text":"必須要有可保標的"},{"letter":"C","text":"可保標的是可受保的"},{"letter":"D","text":"與保險標的的一種法律認可關係"}],"answer":"A"},{"id":265,"chapter":"3","ref":"3.1.3","question":"可保權益需要符合甚麼條件？","options":[{"letter":"A","text":"需要先有可受保的人"},{"letter":"B","text":"有關的人和物必須為保險的標的"},{"letter":"C","text":"當投保事件發生時，對打算投買保險的人必須構成財務損失"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":266,"chapter":"3","ref":"3.1.3","question":"以下哪項是可保權益的非必要條件?","options":[{"letter":"A","text":"保險標的必須具有可被保的條件"},{"letter":"B","text":"投保人與保險標的必須具有法律認可的關係"},{"letter":"C","text":"投保人必須為該國公民"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":267,"chapter":"3","ref":"3.1.3","question":"以下其中三項擁有可保權益，那麼哪一項是沒有可保權益的？","options":[{"letter":"A","text":"使用非法抄錄電腦軟件的人(「全險」保險)"},{"letter":"B","text":"借入銀行按揭貸款的人(火險)"},{"letter":"C","text":"單位的業權人(家居保險)"},{"letter":"D","text":"把生命投保的被保險人的丈夫(人壽保險)"}],"answer":"A"},{"id":268,"chapter":"3","ref":"3.1.3","question":"以下哪項不太可能屬於可保權益的先決條件?","options":[{"letter":"A","text":"與保險標的的一種法律認可關係"},{"letter":"B","text":"有可保的標的"},{"letter":"C","text":"標的是可受保的"},{"letter":"D","text":"被保險人與保險標的之間的一種法律擁有權"}],"answer":"D"},{"id":269,"chapter":"3","ref":"3.1.3","question":"在香港，下列哪項可構成可保權益(為自己的利益而購買保險)","options":[{"letter":"A","text":"自己"},{"letter":"B","text":"自己的配偶"},{"letter":"C","text":"自己精神錯亂的配偶"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":270,"chapter":"3","ref":"3.1.3","question":"以下哪項有關可保權益的描述是不正確？","options":[{"letter":"A","text":"它是每類保險都需要有的原則"},{"letter":"B","text":"通常存在與保險標的的一種財務關係"},{"letter":"C","text":"它只可應用於某人自身或某人的個人財物"},{"letter":"D","text":"與保險標的有一種法律認可關係"}],"answer":"C"},{"id":271,"chapter":"3","ref":"3.1.3(a)","question":"一種作為投保保險標的屬於可受保的事物，是屬於產生下列哪項原則的準則？","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"可保權益"},{"letter":"C","text":"分擔"},{"letter":"D","text":"最高誠信的原則"}],"answer":"B"},{"id":272,"chapter":"3","ref":"3.1.4","question":"以下哪項購買財產保險的關係中不會出現可保權益？","options":[{"letter":"A","text":"手錶的受託保管人"},{"letter":"B","text":"遺囑執行人打算投保已逝者的建築物"},{"letter":"C","text":"承按人打算投保按揭保障"},{"letter":"D","text":"以上各項均可構成可保權益"}],"answer":"D"},{"id":273,"chapter":"3","ref":"3.1.4","question":"以下哪項/哪些符合可保權益的要求？","options":[{"letter":"A","text":"一名男子希望自己擁有的建築物投買保險"},{"letter":"B","text":"一名盜賊希望為自己所偷竊得來的財物投買保險"},{"letter":"C","text":"一名男子為自己的利益，希望為他一位粗心大意的朋友的手錶投買保險"},{"letter":"D","text":"以上所有各項"}],"answer":"A"},{"id":274,"chapter":"3","ref":"3.1.4","question":"以下哪項所投保的財產保險不具備有可保權益？","options":[{"letter":"A","text":"破產案中破產者擁有的財產的受託人"},{"letter":"B","text":"遺囑執行人打算投保已去世者的建築物"},{"letter":"C","text":"一部數碼相機的擁有者的父親"},{"letter":"D","text":"承按人打算投保的按揭財產"}],"answer":"C"},{"id":275,"chapter":"3","ref":"3.1.4","question":"以下哪項在財產上具有可保權益？","options":[{"letter":"A","text":"財產擁有人"},{"letter":"B","text":"貸款予購買該財產的銀行人"},{"letter":"C","text":"財產受託人"},{"letter":"D","text":"以上各項皆有可保權益"}],"answer":"D"},{"id":276,"chapter":"3","ref":"3.1.4(a)","question":"以下哪三項可存在可保權益？ i 配偶 ii 債權人 iii 欠債人 iv 年屆十五歲的子女","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, ii, iv"},{"letter":"D","text":"i, iii, iv"}],"answer":"D"},{"id":277,"chapter":"3","ref":"3.1.4(a)","question":"以下哪項或哪些對可保權益的陳述是正確的?","options":[{"letter":"A","text":"可就配偶的生命投買保險"},{"letter":"B","text":"可就繼父(或後父)的生命投買保險"},{"letter":"C","text":"可就 10 歲的孫女的生命投買保險"},{"letter":"D","text":"以上所有各項"}],"answer":"A"},{"id":278,"chapter":"3","ref":"3.1.4(a)","question":"在香港，每一名人士對以下哪項或哪些人士的生命不具有可保權益(為個人本身的利益購買人壽保險)?","options":[{"letter":"A","text":"其本身"},{"letter":"B","text":"其配偶"},{"letter":"C","text":"其未滿 18 歲的子女或監護人"},{"letter":"D","text":"其 17 歲剛於數天前喪失父親的姪兒(或外甥)"}],"answer":"D"},{"id":279,"chapter":"3","ref":"3.1.4(a)","question":"以下哪項關係可構成可保權益關係：","options":[{"letter":"A","text":"大過 18 歲的子女"},{"letter":"B","text":"我的母親"},{"letter":"C","text":"法院裁定下的被監護人關係(大於 18 歲)"},{"letter":"D","text":"法定夫妻關係"}],"answer":"D"},{"id":280,"chapter":"3","ref":"3.1.4(a)","question":"以人壽保險而言，對以下哪類人士並無可保權益？","options":[{"letter":"A","text":"保單持有人本身"},{"letter":"B","text":"保單持有人商業夥伴"},{"letter":"C","text":"保單持有人前度配偶(離婚後)"},{"letter":"D","text":"保單持有人貸款欠款人"}],"answer":"C"},{"id":281,"chapter":"3","ref":"3.1.4(a)","question":"在香港，與下列哪項人士可構成可保權益(為自己的利益而購買保險)?","options":[{"letter":"A","text":"其本身"},{"letter":"B","text":"其配偶"},{"letter":"C","text":"其精神錯亂的配偶"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":282,"chapter":"3","ref":"3.1.4(a)","question":"以個人而言，對以下哪類人士不可享有可保權益？","options":[{"letter":"A","text":"個人自己"},{"letter":"B","text":"個人的配偶"},{"letter":"C","text":"剛喪失父母的未滿 15 歲姪兒(或外甥)"},{"letter":"D","text":"未滿 18 歲的子女"}],"answer":"C"},{"id":283,"chapter":"3","ref":"3.1.4(b)","question":"以下哪項最能描述財產保險的可保權益？","options":[{"letter":"A","text":"財產的管有"},{"letter":"B","text":"購買保險的欲望"},{"letter":"C","text":"投保標的價值"},{"letter":"D","text":"與財產的法律認可關係"}],"answer":"D"},{"id":284,"chapter":"3","ref":"3.1.4(b)","question":"以下哪項或哪些人士，儘管不是絕對所有人，但仍然對某項財產具有可保權益？","options":[{"letter":"A","text":"一名擁有一幢建築物的男子的太太"},{"letter":"B","text":"一項私人信託的信託人，對該項有關信託財產"},{"letter":"C","text":"一名獲准許使用一名朋友的相機的人士"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":285,"chapter":"3","ref":"3.1.4(b)","question":"財產的可保權益可按下列哪項產生？","options":[{"letter":"A","text":"財產擁有權"},{"letter":"B","text":"代理關係"},{"letter":"C","text":"已有保險計劃的轉讓"},{"letter":"D","text":"以上各項皆不正確"}],"answer":"A"},{"id":286,"chapter":"3","ref":"3.1.4(b)","question":"以下哪類人仕及其身份可構成可保權益關係：","options":[{"letter":"A","text":"遺產執行人"},{"letter":"B","text":"財產託管人"},{"letter":"C","text":"遺產代理人"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":287,"chapter":"3","ref":"3.1.4(b)","question":"以下哪三種具有可保權益屬於不是自己絕對擁有的財產？ i 受託人(以信託形式托管財產) ii 戶主的兒子(母親的房屋) iii 遺產執行人(死者遺下的物業) iv 一家銀行借錢給按揭人(按揭建築物)","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, iii, iv"}],"answer":"D"},{"id":288,"chapter":"3","ref":"3.1.4(b)","question":"以下哪些財產可投買保險？ i 從偷竊中得來之財產 ii 以持有人名義投買的財產 iii 信託人保管的財產 iv 遺囑執行人保管的財產","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, ii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"B"},{"id":289,"chapter":"3","ref":"3.1.4(b)","question":"下列哪項關係構成可保權益？ i 自己與太太的財產 ii 遺囑執行人與所保管的財產 iii 信託人與所保管的財產 iv 與被保險人一起居住的家人所擁有的財產","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":290,"chapter":"3","ref":"3.1.4 (b)","question":"以下哪項對於財產上的可保權益是並非必要的？","options":[{"letter":"A","text":"與該財產必須有法律認可關係"},{"letter":"B","text":"必須對該財產有擁有權"},{"letter":"C","text":"購買的保險必須是與該財產有關的"},{"letter":"D","text":"與該財產必須要有財務上的關係"}],"answer":"B"},{"id":291,"chapter":"3","ref":"3.1.4(b)","question":"阿倫容許他的朋友玫瑰在一個他擁有的單位免費住兩個月。請問玫瑰有權就該單位購買保險嗎？理由何 在？","options":[{"letter":"A","text":"有，合法地佔用單位的任何人均有權以所有人的代理人身份就該單位購買保險"},{"letter":"B","text":"沒有，因為她沒有付出代價"},{"letter":"C","text":"有，她是以受託保管人身份對該單位具有權益的"},{"letter":"D","text":"沒有，因為她並非擁有該單位"}],"answer":"C"},{"id":292,"chapter":"3","ref":"3.1.4(b)","question":"以下哪項或哪些有關財產保險中的可保權益的陳述是正確的?","options":[{"letter":"A","text":"單單管有貨物不足以構成可保權益"},{"letter":"B","text":"與保險標的有法律認可的關係"},{"letter":"C","text":"不一定對標的有絕對擁有權亦有可保權益"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":293,"chapter":"3","ref":"3.1.4(b)","question":"以下哪項並不存在法律責任上的可保權益？","options":[{"letter":"A","text":"自己的疏忽"},{"letter":"B","text":"自己的代理人的疏忽"},{"letter":"C","text":"自己的職員的疏忽"},{"letter":"D","text":"盜賊駕駛被盜竊者所擁有的汽車的疏忽"}],"answer":"D"},{"id":294,"chapter":"3","ref":"3.1.4(c)","question":"以下哪項有關直接責任及轉承責任的陣述一是錯誤的？","options":[{"letter":"A","text":"直接責任是指個人因自身行為所引致的法律責任"},{"letter":"B","text":"直接責任於個人須為他人行為承擔法律責任而產生"},{"letter":"C","text":"轉承責任於僱傭關係中產生"},{"letter":"D","text":"轉承責任於委託人/代理人關係中產生"}],"answer":"B"},{"id":295,"chapter":"3","ref":"3.1.4(c)","question":"以下哪項對首要責任及轉承責任的描述是正確的： i 首要責任是個人對他人的作為或不作為負上責任 ii 首要責任是個人本身的作為或不作為所引致的法律責任 iii 轉承責任經常在代理關係上產生 iv 轉承責任可能在僱傭關係上產生","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, ii, iii"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":296,"chapter":"3","ref":"3.1.4(c)","question":"一間育兒院要求每一位家長必須簽署一份協議書，當中訂明其孩子在育兒院內所受之傷害，家長不得向育 兒院追究。儘管如此，育兒院營運人就其所照顧的孩子在其處所所受之傷害的潛在法律責任購買了一份責 任保險。請問育兒院是否有權購買此份保險，理由何在？","options":[{"letter":"A","text":"他不必購買此份保險，因政府註冊的育兒院不須承擔責任"},{"letter":"B","text":"保險無效；因大部份的責任保險將「受保處所之傷害」列為除外責任"},{"letter":"C","text":"保險有效；育兒院營運人需為其作為或不作為負擔其潛在的法律責任"},{"letter":"D","text":"保險無效；因沒有法律責任，在欠缺可保權益下不能購買保險"}],"answer":"C"},{"id":297,"chapter":"3","ref":"3.1.4(c)","question":"以下哪項構成法律責任? i 自己本身的疏忽 ii 第三者的疏忽 iii 承擔某人的僱員的疏忽 iv 承擔某人的代理人的轉承責任","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":298,"chapter":"3","ref":"3.1.4(d)","question":"可保權益可以在合法權利受到侵犯或損失/開支間接產生的情況下形成，以下哪項或哪些是屬於這類？","options":[{"letter":"A","text":"房東，火災後的租金損失"},{"letter":"B","text":"汽車意外引到另行租用其他車輛的費用"},{"letter":"C","text":"就船東碰撞事故遭受的運費損失購買的保險"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":299,"chapter":"3","ref":"3.1.4(d)","question":"以下哪項存在法律責任上的可保權益，而非人身上，財產上，責任上？","options":[{"letter":"A","text":"業主為自己建築物購買保險"},{"letter":"B","text":"就船東在碰撞事故發生後在運費中的損失購買保險"},{"letter":"C","text":"債權人就欠債人購買保險"},{"letter":"D","text":"就應支付受傷職員的僱員補償購買保險"}],"answer":"B"},{"id":300,"chapter":"3","ref":"3.1.4(d)","question":"符合法律認可關係的可保權益，以下那項為非人身、財物或法律責任的可保權益？","options":[{"letter":"A","text":"為酒樓電力中斷後，營業利潤損失購買保險"},{"letter":"B","text":"為自己的建築物購買火險"},{"letter":"C","text":"債主為自己的債務購買保險"},{"letter":"D","text":"僱主為受僱職員的損傷購買保險"}],"answer":"A"},{"id":301,"chapter":"3","ref":"3.1.4(d)","question":"可保權益可以在合法權利可能受到侵犯或未來收入存在損失的情況下出現。以下哪項或哪些屬於這一類？","options":[{"letter":"A","text":"酒樓經營者就供電中斷後產生的利潤損失購買保險"},{"letter":"B","text":"汽車意外後而需租用另一輪汽車"},{"letter":"C","text":"酒樓經營者就禽流感爆發後產生的利潤損失購買保險"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":302,"chapter":"3","ref":"3.1.4(d)","question":"以下哪項構成可保權益的關係中，不屬於財產上，個人上及責任上的？","options":[{"letter":"A","text":"貨主為船上貨物購買水險"},{"letter":"B","text":"債主為負債人購買人壽保險"},{"letter":"C","text":"業主為其所收租金購買租金保險"},{"letter":"D","text":"僱主為僱員購買僱傭保險"}],"answer":"C"},{"id":303,"chapter":"3","ref":"3.1.4(d)","question":"根據合約法，下列哪項在非人身、非財產及非責任的情況下，仍構成可保權益？","options":[{"letter":"A","text":"貨主為本身的海貨投保"},{"letter":"B","text":"債主為欠債人投保"},{"letter":"C","text":"屋主為本身的租金投保"},{"letter":"D","text":"為了要支付可能受傷的員工，作出僱員補償保險"}],"answer":"C"},{"id":304,"chapter":"3","ref":"3.1.4(d)","question":"可保權益的產生，可以是因本身的合法權利受到侵犯或當費用損失因受保範圍間接引致的，以下哪項屬於 該範圍：","options":[{"letter":"A","text":"房東─因火災後損失租金"},{"letter":"B","text":"汽車意外引致另行租用其它車輛的費用"},{"letter":"C","text":"商舖爆炸以引致利潤的損失"},{"letter":"D","text":"以上各項皆正確"}],"answer":"D"},{"id":305,"chapter":"3","ref":"3.1.4(d)","question":"以下哪項存在法律權利上的可保權益，而並非人身上，財產上或法律責任上？","options":[{"letter":"A","text":"業主購買建築物保險"},{"letter":"B","text":"酒樓經營者在禽流感過後所產生的利潤損失購買保險"},{"letter":"C","text":"債主就其欠債人購買保險"},{"letter":"D","text":"就應支付予受傷職員而購買的僱員補償保險"}],"answer":"B"},{"id":306,"chapter":"3","ref":"3.1.5","question":"人壽保險可保權益有別於一般業務，壽險可保權益在什麼時候需要：","options":[{"letter":"A","text":"保單開始時"},{"letter":"B","text":"索償出現時"},{"letter":"C","text":"保單轉讓時"},{"letter":"D","text":"保單開始及索償時"}],"answer":"A"},{"id":307,"chapter":"3","ref":"3.1.5","question":"人壽保險是保單持有人的一項資產，由於有「末期利益」，換句話說，保單持有人何時享用此權益？","options":[{"letter":"A","text":"於將來的任何時間"},{"letter":"B","text":"目前在法律上已存在擁有權，但保單持有人並未完全擁有處置權"},{"letter":"C","text":"於最後一期保費繳交後"},{"letter":"D","text":"繳交到期保費後"}],"answer":"B"},{"id":308,"chapter":"3","ref":"3.1.5","question":"一種對標的的法律認可關係稱為「可保權益」，在香港購買哪類保險合約不需要「可保權益」？","options":[{"letter":"A","text":"為想擁有的物業購買保險"},{"letter":"B","text":"替一個粗心大意的朋友的手錶購買保險"},{"letter":"C","text":"偷回來的財產"},{"letter":"D","text":"以上各項皆不需要"}],"answer":"D"},{"id":309,"chapter":"3","ref":"3.1.5","question":"下列哪項是有關人壽保險的特性？ i 被保險人在這類保險中被視為擁有期末利益 ii 它是一種長期業務 iii 保險人不能取消人壽保險單 iv 可保權益只在保單開始時需要","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":310,"chapter":"3","ref":"3.1.5","question":"在實際情況下，除人壽保險外，下列哪類保險在索償時才需要證明可保權益？","options":[{"letter":"A","text":"必然出現於損失發生時"},{"letter":"B","text":"只出現於保險安排妥當時"},{"letter":"C","text":"只出現於繳交首次保費的時候"},{"letter":"D","text":"只限於保單上有清晰描述時才需要"}],"answer":"A"},{"id":311,"chapter":"3","ref":"3.1.5","question":"那一類保險保障只需在保單開始時存在可保權益便可以：","options":[{"letter":"A","text":"汽車保險"},{"letter":"B","text":"家居保險"},{"letter":"C","text":"人壽保險"},{"letter":"D","text":"醫療保險"}],"answer":"C"},{"id":312,"chapter":"3","ref":"3.1.5","question":"以下哪項保險只有在合約辦妥時(保單開始)才需要可保權益？","options":[{"letter":"A","text":"火險"},{"letter":"B","text":"人壽保險"},{"letter":"C","text":"水險"},{"letter":"D","text":"航空保險"}],"answer":"B"},{"id":313,"chapter":"3","ref":"3.1.5","question":"不同類形的保單會於不同時間需要具有可保權益，下列哪項保單會於索償出現時需要具有可保權益？ i 人壽保險 ii 鐵路車輛保險 iii 任何形式的責任保險 iv 海上貨物保險","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"ii, iii, iv"}],"answer":"D"},{"id":314,"chapter":"3","ref":"3.1.5","question":"被保險人在人壽保險中被視為擁有期末利益因為：","options":[{"letter":"A","text":"保險人不能取消人壽保險單"},{"letter":"B","text":"保險人能取消人壽保險單"},{"letter":"C","text":"人壽保險單提供的金錢在一開始的時間便可獲取"},{"letter":"D","text":"人壽保險單提供的金錢在未來的時間都不能獲取"}],"answer":"A"},{"id":315,"chapter":"3","ref":"3.1.5","question":"以下哪項或哪些情況出現之損失或索償，在沒有構成可保權益下，都不會形成拒絕損失索償的理由：","options":[{"letter":"A","text":"人壽保險（被保險人為前配偶，現已離婚）"},{"letter":"B","text":"火險，由「前承按人」購買（欠款已於火災前清還）"},{"letter":"C","text":"車險（汽車於意外摧毀前已買出）"},{"letter":"D","text":"以上各項"}],"answer":"A"},{"id":316,"chapter":"3","ref":"3.1.6","question":"「將根據合約所需給付的金額，轉付予保單持有人以外的人」 。此句子是指：","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"權益轉讓"},{"letter":"C","text":"委付"},{"letter":"D","text":"保單收益轉讓"}],"answer":"D"},{"id":317,"chapter":"3","ref":"3.1.6","question":"以下哪項屬於轉讓保險合約所帶來的影響？","options":[{"letter":"A","text":"承讓人成為了保單保管人"},{"letter":"B","text":"承讓人成為了保單受益的受託人"},{"letter":"C","text":"不論轉讓人或承讓人所作的違反，都不會對承讓人構成影響"},{"letter":"D","text":"保險合約從此保障承讓人可能遭受到的損失"}],"answer":"D"},{"id":318,"chapter":"3","ref":"3.1.6","question":"以下哪項對轉讓的陳述是正確的？ i 人壽保險可以不經保險人同意自由轉讓 ii 海上貨物保險可以不經保險人同意自由轉讓 iii 商業「全險」保單不可以沒有保險人同意便轉讓 iv 人壽保險不可以沒有保險人同意便轉讓","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":319,"chapter":"3","ref":"3.1.6","question":"以下哪種保險在沒有徵得保險人同意下，仍然可以進行轉讓？ i 火險 ii 人壽保險 iii 汽車保險 iv 船上貨物保險","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iv"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"B"},{"id":320,"chapter":"3","ref":"3.1.6","question":"有兩種保險合約被視為可以自由轉讓的，它們是：","options":[{"letter":"A","text":"人壽與火險"},{"letter":"B","text":"人壽與水險"},{"letter":"C","text":"水險與公眾責任"},{"letter":"D","text":"水險與忠實保險"}],"answer":"B"},{"id":321,"chapter":"3","ref":"3.1.6(a)","question":"下列哪項是轉讓保險合約所帶來的影響？","options":[{"letter":"A","text":"承讓人成為保單受託人"},{"letter":"B","text":"承讓人成為保單收益的受託人"},{"letter":"C","text":"轉讓人在轉讓前的違約行為不會構成影響"},{"letter":"D","text":"保險合約從此保障承讓人可能遭受到的損失"}],"answer":"D"},{"id":322,"chapter":"3","ref":"3.1.6(b)","question":"就保險金權利轉讓，意思是：","options":[{"letter":"A","text":"必須就保險單應支付的金錢轉予指定的第三者"},{"letter":"B","text":"把保單轉讓於另一家保險公司"},{"letter":"C","text":"把保單擁有權轉讓予他人"},{"letter":"D","text":"讓另一人代替原本的被保險人"}],"answer":"A"},{"id":323,"chapter":"3","ref":"3.1.6(d)","question":"實務上，以下哪項或哪些保險類型不可以在沒有保險人同意下轉讓？","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"海上貨物保險"},{"letter":"C","text":"家居保險"},{"letter":"D","text":"(A)及(C)項均不可以在沒有保險人同意下轉讓"}],"answer":"C"},{"id":324,"chapter":"3","ref":"3.1.6(d)","question":"以下哪項或哪些保險類型不能在沒有保險人同意下轉讓","options":[{"letter":"A","text":"運費的保險"},{"letter":"B","text":"人壽保險"},{"letter":"C","text":"海上貨物保險"},{"letter":"D","text":"(b)及(c)項均不可以在沒有保險人同意下轉讓"}],"answer":"A"},{"id":325,"chapter":"3","ref":"3.1.6(d)","question":"保單轉讓是把附於保險合約的權利轉移，令另一人成為了同一保險標的的保單持有人, 以下哪項或哪些 保險類型需要得到保險人同意下轉讓？","options":[{"letter":"A","text":"僱員補償保險"},{"letter":"B","text":"盜竊保險"},{"letter":"C","text":"汽車保險"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":326,"chapter":"3","ref":"3.1.6(d)","question":"保險合約的轉讓是指同一個保險標的給另一個被保險人，實務上，以下哪項或那些情況需要保險公司事前 同意才可轉讓的保單：","options":[{"letter":"A","text":"營業中斷保險"},{"letter":"B","text":"盜竊保險"},{"letter":"C","text":"汽車保險"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":327,"chapter":"3","ref":"3.2","question":"下列哪項當然不會影響保險合約的存在與否或合約條款？","options":[{"letter":"A","text":"重要事實"},{"letter":"B","text":"陳述"},{"letter":"C","text":"非重要事實"},{"letter":"D","text":"以上各項皆不是"}],"answer":"C"},{"id":328,"chapter":"3","ref":"3.2","question":"以下哪項或哪些有關最高誠信和保險在香港的情況是不正確的？","options":[{"letter":"A","text":"最高誠信只有在詢問時需要提供合理答案"},{"letter":"B","text":"最高誠信只有在保單條款要求時才需要"},{"letter":"C","text":"所有保險保單條款均修改最高誠信責任"},{"letter":"D","text":"以下各項均不正確"}],"answer":"D"},{"id":329,"chapter":"3","ref":"3.2","question":"以下哪項不屬於對「最高誠信」的不正確描述？","options":[{"letter":"A","text":"在一般保險中，通常會降低「最高誠信」的責任"},{"letter":"B","text":"「最高誠信」只適用於保單條款中所訂明的事項"},{"letter":"C","text":"「最高誠信」只涉及所提問的須以誠實態度回答"},{"letter":"D","text":"以上各項皆不正確"}],"answer":"D"},{"id":330,"chapter":"3","ref":"3.2","question":"以下哪項或哪些有關最高誠信及香港的保險的陳述是不正確的？","options":[{"letter":"A","text":"所有一般保險均包含某些條款，更改最高誠信責任"},{"letter":"B","text":"最高誠信只在保單條款指明下才適用"},{"letter":"C","text":"最高誠信只要求就發問的問題提供真實答案"},{"letter":"D","text":"以上所有各項都不正確"}],"answer":"D"},{"id":331,"chapter":"3","ref":"3.2","question":"最高誠信的責任適用於：","options":[{"letter":"A","text":"被保險人而非保險人"},{"letter":"B","text":"保險人而非被保險人"},{"letter":"C","text":"任何情況下的被保險人及保險人"},{"letter":"D","text":"被保險人及保險人，但只限於保單有這要求"}],"answer":"C"},{"id":332,"chapter":"3","ref":"3.2","question":"以下那三項屬於違反最高誠信： i 忘記了以往被爆竊的經歷(盜竊險) ii 畜意地欺詐性不披露以往的索償經驗(火險) iii 有意地提供健康的醫療報告，顯然明知事實是相反的(人壽保險) iv 不知道的身體內在毛病(人身意外保險)","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":333,"chapter":"3","ref":"3.2","question":"如在保險保障期間，風險上有重大的轉變：","options":[{"letter":"A","text":"很明顯地對保險人極其重要"},{"letter":"B","text":"某些保險合約可能要求被保險人作出披露"},{"letter":"C","text":"普通法要求在續約時方須要提出"},{"letter":"D","text":"以上各項皆正確"}],"answer":"D"},{"id":334,"chapter":"3","ref":"3.2","question":"下列哪項當然不會影響保險合約的存在與否或合約條款？","options":[{"letter":"A","text":"重要事實"},{"letter":"B","text":"陳述"},{"letter":"C","text":"非重要事實"},{"letter":"D","text":"以上各項皆不是"}],"answer":"C"},{"id":335,"chapter":"3","ref":"3.2.1","question":"誠實行事以及就所問的問題提供真實答案的責任稱為：","options":[{"letter":"A","text":"一般誠信"},{"letter":"B","text":"最高誠信"},{"letter":"C","text":"內在誠信"},{"letter":"D","text":"合約誠信"}],"answer":"A"},{"id":336,"chapter":"3","ref":"3.2.1","question":"有別於最高誠信，一般誠信的意思是：","options":[{"letter":"A","text":"不論有否問及必需披露重要事實"},{"letter":"B","text":"所披露的必需確保百分百真實"},{"letter":"C","text":"所提及的需承諾及保證完全真實"},{"letter":"D","text":"本著誠信的態度行事，而資訊必須是實質上真實"}],"answer":"D"},{"id":337,"chapter":"3","ref":"3.2.1","question":"一般誠信可以被描述為？","options":[{"letter":"A","text":"作為揭露所有事情的責任"},{"letter":"B","text":"不說謊的消極責任"},{"letter":"C","text":"把所有重要事實揭露的積極責任"},{"letter":"D","text":"適用於所有保險合約的法定要求"}],"answer":"B"},{"id":338,"chapter":"3","ref":"3.2.1","question":"如果合約各方對他方須負上忠實披露資料的責任，但他可以對沒有直接提問的事件保持緘默，這種責任 稱為：","options":[{"letter":"A","text":"最高誠信"},{"letter":"B","text":"有限誠信"},{"letter":"C","text":"一般誠信"},{"letter":"D","text":"有保留誠信"}],"answer":"C"},{"id":339,"chapter":"3","ref":"3.2.1","question":"大部分商業合約均受到:","options":[{"letter":"A","text":"一般誠信的約束而已"},{"letter":"B","text":"最高誠信的約束"},{"letter":"C","text":"簡單誠信的約束"},{"letter":"D","text":"揭露所有重要事實的法定要求約束"}],"answer":"A"},{"id":340,"chapter":"3","ref":"3.2.1","question":"有別於最高誠信，一般誠信要求：","options":[{"letter":"A","text":"保証所作出的陳述是百分百真實"},{"letter":"B","text":"不論有否被問及，也須陳述"},{"letter":"C","text":"應用於整個保險合約過程"},{"letter":"D","text":"忠誠並確保所有陳述是實質上真實"}],"answer":"D"},{"id":341,"chapter":"3","ref":"3.2.1","question":"若一方本著誠實態度行事，所提供的資訊是實質上真實的，而對於另一方沒有詢問的事情保持緘默，這種 誠信責任屬於︰","options":[{"letter":"A","text":"一般誠信"},{"letter":"B","text":"最高誠信"},{"letter":"C","text":"有限誠信"},{"letter":"D","text":"部份誠信"}],"answer":"A"},{"id":342,"chapter":"3","ref":"3.2.2","question":"以下哪項或哪些有關最高誠信和保險在香港的情況下是不正確的：","options":[{"letter":"A","text":"最高誠信只要求就所發問的問題給予合理的答案"},{"letter":"B","text":"最高誠信只在保單條款的規定下才適用"},{"letter":"C","text":"所有保險保單均包含某些條款，更改最高誠信責任"},{"letter":"D","text":"以上各項皆不正確"}],"answer":"D"},{"id":343,"chapter":"3","ref":"3.2.2","question":"如果保險人要求保證所有披露資料，不論重要與否，均需完全真實，這表示：","options":[{"letter":"A","text":"違反法例並不能強制執行"},{"letter":"B","text":"延伸普通法中的最高誠信的要求"},{"letter":"C","text":"這合約受制於一般誠信而非最高誠信"},{"letter":"D","text":"這合約受制於最高誠信"}],"answer":"B"},{"id":344,"chapter":"3","ref":"3.2.2","question":"以下哪項是對最高誠信應用於保險的不正確描述","options":[{"letter":"A","text":"只就所發問的問題以誠實及實質上真實的態度處理"},{"letter":"B","text":"在保單條款上必定是可以寬免的"},{"letter":"C","text":"只有在保單條款上規定才須遵守"},{"letter":"D","text":"以上所有各項均不正確"}],"answer":"D"},{"id":345,"chapter":"3","ref":"3.2.2","question":"假如保險人提出要求投保人披露所有重要及非重要的事實，這表示：","options":[{"letter":"A","text":"是違法的，不能強制執行"},{"letter":"B","text":"這令到最高誠信原則不致太嚴謹"},{"letter":"C","text":"這延伸了最高誠信的應用"},{"letter":"D","text":"應用了一般誠信而非最高誠信"}],"answer":"C"},{"id":346,"chapter":"3","ref":"3.2.2","question":"以下哪三項是對最高誠信的描述？ i 它涉及主動的披露 ii 披露責任不能基於對方主動要求 iii 最高誠信源自普通法，但可能被保單措詞修改 iv 保險人必須承擔違反最高誠信法律責任","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":347,"chapter":"3","ref":"3.2.2","question":"最高誠信在普通法中，要求投保人所提供的資料是：","options":[{"letter":"A","text":"百分百真實"},{"letter":"B","text":"大部份真實"},{"letter":"C","text":"百分之九十真實"},{"letter":"D","text":"比一般誠信嚴謹"}],"answer":"A"},{"id":348,"chapter":"3","ref":"3.2.2","question":"就保險合約而言，延伸最高誠信的根據是：","options":[{"letter":"A","text":"欺詐性索償"},{"letter":"B","text":"有關保險屬長期性質"},{"letter":"C","text":"法定要求"},{"letter":"D","text":"以上各項皆不是"}],"answer":"D"},{"id":349,"chapter":"3","ref":"3.2.2","question":"保險需要最高誠信因為：","options":[{"letter":"A","text":"普通法不適用於保險"},{"letter":"B","text":"保險的受信性質"},{"letter":"C","text":"一般誠信在保險中太嚴謹"},{"letter":"D","text":"以上各項都是"}],"answer":"B"},{"id":350,"chapter":"3","ref":"3.2.2","question":"在香港保險最常出現的條款：","options":[{"letter":"A","text":"最高誠信伸延至保單合約有效期"},{"letter":"B","text":"取消最高誠信"},{"letter":"C","text":"將最高誠信有效期為一段有限時間內"},{"letter":"D","text":"以上各項不常出現"}],"answer":"A"},{"id":351,"chapter":"3","ref":"3.2.2","question":"下列哪項是「最高誠信」的描述？ i 在普通法出現 ii 保險人把普通法中的最高誠信延伸至要求投保人發出聲明 iii 無論有否被問及，也要揭露重要事實 iv 受信性質","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":352,"chapter":"3","ref":"3.2.2","question":"下列哪項有關最高誠信是不正確的？","options":[{"letter":"A","text":"投保人所提供的資料必須百分百真實"},{"letter":"B","text":"無論他人有否問及有關資料，合約各方必須揭露所有重要的資料"},{"letter":"C","text":"最高誠信是在普通法中出現"},{"letter":"D","text":"最高誠信是保險人發明的"}],"answer":"D"},{"id":353,"chapter":"3","ref":"3.2.2","question":"保險中「最高誠信」原則，以下哪項描述為正確的？ i 它是一項披露責任 ii 無論有否提及，必須披露所有重要資料 iii 源自普通法，可以以保單措詞修改 iv 任何情況下保險人必須承擔違反最高誠信法律責任","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":354,"chapter":"3","ref":"3.2.2 註 1","question":"保險人有時會把投保人在普通法中的最高誠信責任延伸，要求後者在投保書上作出特定之聲明。這種做法 被稱為延伸，原因是：","options":[{"letter":"A","text":"通過此聲明，投保人保證，無論是否與重要事實有關連，所有提供的資料必須實質地真實"},{"letter":"B","text":"通過此聲明，投保人保證所有披露的資料必須完全真實的"},{"letter":"C","text":"通過此聲明，投保人保證所有披露的資料必須實質地真實"},{"letter":"D","text":"通過此聲明，投保人保證，無論是否與重要事實有關連，所有提供的資料必須完全真實的"}],"answer":"D"},{"id":355,"chapter":"3","ref":"3.2.3","question":"就最高誠信的責任而言，以下哪些對重要事實的陳述是正確的? i 它會影響審慎的承保人在某些方面的判斷 ii 它們只適用於涉及實質物件的保險 iii 它們只影響訂立保費 iv 改善風險事實毋須披露","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"i, iv"},{"letter":"D","text":"ii, iv"}],"answer":"B"},{"id":356,"chapter":"3","ref":"3.2.3","question":"根據最高誠信，以下哪項事實必須披露予保險人？","options":[{"letter":"A","text":"已爆發的戰爭"},{"letter":"B","text":"保險人已知的事實"},{"letter":"C","text":"與常識有關的事情"},{"letter":"D","text":"被保險人以往的病歷"}],"answer":"D"},{"id":357,"chapter":"3","ref":"3.2.3(a)","question":"重要事實指：","options":[{"letter":"A","text":"填寫投保書時要求申報的事實"},{"letter":"B","text":"影響一名審慎保險人決定是否承保的事實"},{"letter":"C","text":"購買財產保險時要求申報的事實"},{"letter":"D","text":"屬於常識一類的事實"}],"answer":"B"},{"id":358,"chapter":"3","ref":"3.2.3(a)","question":"一個足以影響一名審慎的保險人決定是否承保可能面對的風險，或釐定承保條件的事實，可稱為：","options":[{"letter":"A","text":"非重要事實"},{"letter":"B","text":"重要事實"},{"letter":"C","text":"代位權"},{"letter":"D","text":"最高誠信"}],"answer":"B"},{"id":359,"chapter":"3","ref":"3.2.3(a)","question":"根據最高誠信，以下哪項是被保險人必須向保險人披露的事實？","options":[{"letter":"A","text":"保險人已知的事實"},{"letter":"B","text":"與常識有關的事件"},{"letter":"C","text":"會提高被保險人風險的事實"},{"letter":"D","text":"會改善被保險人風險的事實"}],"answer":"C"},{"id":360,"chapter":"3","ref":"3.2.3(b)","question":"無須披露的事實可理解為：","options":[{"letter":"A","text":"投保時保險人無興趣了解的資料"},{"letter":"B","text":"投保人是否需要作体檢的考慮安排"},{"letter":"C","text":"投保人投報工作/職業狀況的風險基數"},{"letter":"D","text":"保險人一些已知或當作已知的事實"}],"answer":"D"},{"id":361,"chapter":"3","ref":"3.2.3(b)","question":"無須披露的事實包括：","options":[{"letter":"A","text":"與常識有關的事件"},{"letter":"B","text":"保險人已知或當作已知的事實"},{"letter":"C","text":"改善風險的事實"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":362,"chapter":"3","ref":"3.2.3(b)","question":"以下哪項事實無須要披露？","options":[{"letter":"A","text":"存在的戰爭狀況"},{"letter":"B","text":"預期保險人應己知悉的資料"},{"letter":"C","text":"可能改善承保人評估有關風險的事實"},{"letter":"D","text":"以上各項均毋須披露"}],"answer":"D"},{"id":363,"chapter":"3","ref":"3.2.3(b)","question":"根據最高誠信的原則，下列哪項屬於無須揭露的事實？ i 近期健康狀況 ii 與常識有關的事件 iii 保險人已知的事實 iv 增加風險的事實","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"C"},{"id":364,"chapter":"3","ref":"3.2.3(b)","question":"以下哪項或哪些事實毋須在人壽保險合約中以最高誠信責任給予披露?","options":[{"letter":"A","text":"健康紀錄"},{"letter":"B","text":"年齡及性別"},{"letter":"C","text":"被保險人是非吸煙者事實"},{"letter":"D","text":"以上各項"}],"answer":"C"},{"id":365,"chapter":"3","ref":"3.2.4","question":"在一般情況下，如果遇到風險有所轉變，例如購買火險後風險比起購買前提高了：","options":[{"letter":"A","text":"明顯地對保險人來說是十分重要的"},{"letter":"B","text":"以保險條款來說是必須通知保險人的"},{"letter":"C","text":"普通法提及在續約前並不需要通知保險人"},{"letter":"D","text":"以上所列各項"}],"answer":"D"},{"id":366,"chapter":"3","ref":"3.2.4","question":"保險中「最高誠信」原則，以下那項描述為正確的？ i 它是一項披露責任 ii 無論有否提及，必須披露所有重要資料 iii 源自普通法，可以以保單措詞修改 iv 任何情況下保險人必須承擔違反最高誠信法律責任","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":367,"chapter":"3","ref":"3.2.4","question":"最高誠信何時適用？","options":[{"letter":"A","text":"保單期滿"},{"letter":"B","text":"直至出單為至"},{"letter":"C","text":"整份保單有效期內"},{"letter":"D","text":"保單賠償時"}],"answer":"C"},{"id":368,"chapter":"3","ref":"3.2.4","question":"在法律上，投保人有責任向保險人披露重要事實的責任在以下哪項情況下出現：","options":[{"letter":"A","text":"整份保單有效期內"},{"letter":"B","text":"保險人交付保單為止"},{"letter":"C","text":"保險人接受投保為止"},{"letter":"D","text":"投保人簽署投保書為止"}],"answer":"C"},{"id":369,"chapter":"3","ref":"3.2.4(b)","question":"在合約有效期內，下列哪項是正確的？","options":[{"letter":"A","text":"在普通法中，風險的轉變只須續約時才予以知會"},{"letter":"B","text":"當保單續保時，最高誠信的責任不適用"},{"letter":"C","text":"在合約有效期內，要求披露重要資料是一種特殊做法"},{"letter":"D","text":"以上各項都是"}],"answer":"A"},{"id":370,"chapter":"3","ref":"3.2.4(b)","question":"在非人壽保險續保時，最高誠信：","options":[{"letter":"A","text":"需要再履行"},{"letter":"B","text":"不需履行"},{"letter":"C","text":"沒有需要"},{"letter":"D","text":"以上所有各項均不正確"}],"answer":"A"},{"id":371,"chapter":"3","ref":"3.2.4(c)","question":"在一份汽車保單續保時，被保險人的最高誠信責任：","options":[{"letter":"A","text":"只有在保單條款有所規定的情況下才適用"},{"letter":"B","text":"要再履行"},{"letter":"C","text":"不再適用"},{"letter":"D","text":"只有在保險人不再要求變更保單條款的情況下才履行"}],"answer":"B"},{"id":372,"chapter":"3","ref":"3.2.4(c)","question":"對於非人壽保險單在續保時，最高誠信：","options":[{"letter":"A","text":"須再履行"},{"letter":"B","text":"沒有需要"},{"letter":"C","text":"不再適用"},{"letter":"D","text":"只適用於保險人"}],"answer":"A"},{"id":373,"chapter":"3","ref":"3.2.4(c)(d)","question":"保險合約訂立後，以下哪項不是延申或再次履行恢復最高誠信的根據：","options":[{"letter":"A","text":"保單續保時"},{"letter":"B","text":"欺詐性索償"},{"letter":"C","text":"保單條款的具體要求"},{"letter":"D","text":"商討重要合約改變正在進行時"}],"answer":"B"},{"id":374,"chapter":"3","ref":"3.2.5","question":"以下哪三項是被視為違反最高誠信： i 欺詐性不披露 ii 欺詐性不聲明 iii 欺詐性失實陳述 iv 非欺詐性失實陳述","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":375,"chapter":"3","ref":"3.2.5","question":"就保險而言，非欺詐性不披露︰","options":[{"letter":"A","text":"等同於無意地違反保證"},{"letter":"B","text":"如屬投保人行為，在技術上則容許保險人推翻合約"},{"letter":"C","text":"屬於違反最高誠信，只容許受屈的一方作出損害賠償"},{"letter":"D","text":"是指投保人漫不經心的情況下對重要事實的失實陳述"}],"answer":"B"},{"id":376,"chapter":"3","ref":"3.2.5","question":"以下哪項情況在沒有披露的情形下會被視為違返最高誠信？","options":[{"letter":"A","text":"過往遭到盜竊的記錄(盜竊險)"},{"letter":"B","text":"受保地方戰爭情況(水險)"},{"letter":"C","text":"發泡膠的高度可燃性(火險)"},{"letter":"D","text":"受保範圍的防火花灑裝置(火險)"}],"answer":"A"},{"id":377,"chapter":"3","ref":"3.2.5","question":"某人於購買保險時，把某些事情誤作為非重要事實而沒有作出披露，但其後在法庭聽證會上法官則持相反 意見。在此情況下，某人可被視為違反最高誠信的：","options":[{"letter":"A","text":"欺詐性不披露"},{"letter":"B","text":"非欺詐性不披露"},{"letter":"C","text":"欺詐性失實陳述"},{"letter":"D","text":"非欺詐性失實陳述"}],"answer":"B"},{"id":378,"chapter":"3","ref":"3.2.5","question":"欺詐性不披露、非欺詐性不披露、非欺詐性失實陳述及欺詐性失實陳述被視為違反：","options":[{"letter":"A","text":"一般誠信"},{"letter":"B","text":"普通誠信"},{"letter":"C","text":"至高誠信"},{"letter":"D","text":"最高誠信"}],"answer":"D"},{"id":379,"chapter":"3","ref":"3.2.5","question":"以下哪三項通常被認為違反最高誠信？ i 真正忘記了以往的一項被竊事件(盜竊險) ii 蓄意隱瞞一項不良索償記錄(火險) iii 有意提供良好的健康証明，但與事實相反(人壽保險) iv 沒有披露一項自己完全不知情的健康情況(人身意外保險)","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":380,"chapter":"3","ref":"3.2.5","question":"欺詐性失實陳述與非欺詐性失實陳述，彼此相同存在的特性是：","options":[{"letter":"A","text":"同樣以可保權益關係為基準"},{"letter":"B","text":"兩者間並無表述任何資料"},{"letter":"C","text":"兩者同樣在非自願情況下提供資料"},{"letter":"D","text":"兩者同樣有提供資料"}],"answer":"D"},{"id":381,"chapter":"3","ref":"3.2.5","question":"欺詐性失實陳述和非欺詐性失實陳述有甚麼共同/分別之處？ i 欺詐性失實陳述涉及並非知情欺騙；非欺詐性失實陳述涉及歪曲事實 ii 欺詐性失實陳述涉及蓄意歪曲事實；非欺詐性失實陳述涉及非知情欺騙 iii 兩者同樣提供虛假資料 iv 欺詐性失實陳述指蓄意保留重要資料；非欺詐性失實陳述指非蓄意保留重要資料","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, iii"},{"letter":"D","text":"iii, iv"}],"answer":"B"},{"id":382,"chapter":"3","ref":"3.2.5(c)","question":"涉及有計劃地保留重要事實，蓄意欺騙保險人的違反最高誠信行為稱為：","options":[{"letter":"A","text":"欺詐性不披露"},{"letter":"B","text":"非欺詐性不披露"},{"letter":"C","text":"欺詐性失實陳述"},{"letter":"D","text":"非欺詐性失實陳述"}],"answer":"A"},{"id":383,"chapter":"3","ref":"3.2.6","question":"假如被保險人違反最高誠信，保險人可作出以下哪項的補救行動：","options":[{"letter":"A","text":"可拒絕作出賠償，並於剩餘的保險期內把保單視為有效"},{"letter":"B","text":"保單開始日起取消保單"},{"letter":"C","text":"可提出侵權法訴訟要求損害賠償"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":384,"chapter":"3","ref":"3.2.6","question":"如果投保人違反最高誠信","options":[{"letter":"A","text":"保險人可不作追究"},{"letter":"B","text":"除非牽涉詐騙成份的情況下,保險人才可得到補救"},{"letter":"C","text":"除非牽涉詐騙或疏忽成份的情況下, 保險人才可得到補救"},{"letter":"D","text":"保險保單會自動取消"}],"answer":"A"},{"id":385,"chapter":"3","ref":"3.2.6","question":"以下哪項不屬保險人因被保險人違反最高誠信的補救？","options":[{"letter":"A","text":"保險人在發現違反事項時開始推翻合約"},{"letter":"B","text":"保險人可追回在未發現違反事項時所支付的賠款"},{"letter":"C","text":"如涉及詐騙，受屈一方可以侵權法從民事訴訟要求損害賠償"},{"letter":"D","text":"保險人可由保單起保時開始推翻合約"}],"answer":"D"},{"id":386,"chapter":"3","ref":"3.2.6","question":"如果違反最高誠信，保險人可以：","options":[{"letter":"A","text":"拒絕賠償這次損失，合約在餘下時限內將被視為有效，可以索償"},{"letter":"B","text":"不再追究"},{"letter":"C","text":"如果已經誤賠，可向被保險人以侵權法為由追索損害賠償"},{"letter":"D","text":"以上各項皆是"}],"answer":"B"},{"id":387,"chapter":"3","ref":"3.2.6","question":"在保險合約中，以下哪項不屬於違反最高誠信的補救？","options":[{"letter":"A","text":"受屈的一方可推翻合約"},{"letter":"B","text":"受屈的保險人可追回在不知道該違反的情況下支付的賠償"},{"letter":"C","text":"受屈的一方可展開刑事訴訟"},{"letter":"D","text":"如涉及欺詐，受屈的一方可趕出侵權法訴訟要求損害賠償"}],"answer":"C"},{"id":388,"chapter":"3","ref":"3.2.6(a)","question":"某位投保人在投保一份為期十二個月的火險單時忘了披露某些重要事實，該保單的保費為港幣一萬二千 元。保險人在保單生效一個月後才發現，下列哪或哪些項屬於受屈的保險人可享用的補救？","options":[{"letter":"A","text":"保險人可選擇推翻保單"},{"letter":"B","text":"保險人可選擇推翻保單，並保留保費的全數"},{"letter":"C","text":"保險人可選擇推翻保單，並保留一個月的保費(港幣一千元)"},{"letter":"D","text":"保險人可取消保單，並保留一個月的保費(港幣二千四元)"}],"answer":"A"},{"id":389,"chapter":"3","ref":"3.3","question":"近因的重要是因為：","options":[{"letter":"A","text":"保險原則中一項甚為重要的要項"},{"letter":"B","text":"通常與核保息息相關"},{"letter":"C","text":"與保險人是否願意承保有著密切關係"},{"letter":"D","text":"一般情況中與賠償理賠的處理關係甚為密切"}],"answer":"D"},{"id":390,"chapter":"3","ref":"3.3","question":"「近因」是很重要的，因為：","options":[{"letter":"A","text":"它是購買保險的原因"},{"letter":"B","text":"它可用來計算保險標的的價值"},{"letter":"C","text":"一項損失的原因未必是保單之保障範圍"},{"letter":"D","text":"根據情況，保險人可考慮通知警察"}],"answer":"C"},{"id":391,"chapter":"3","ref":"3.3","question":"就近因而言，一項導致損失的有效成因稱為：","options":[{"letter":"A","text":"壽險"},{"letter":"B","text":"危險"},{"letter":"C","text":"事故"},{"letter":"D","text":"實質或道德危險"}],"answer":"B"},{"id":392,"chapter":"3","ref":"3.3","question":"「近因」是很重要的，因為：","options":[{"letter":"A","text":"它是購買保險的原因"},{"letter":"B","text":"它可用來計算保險標的的價值"},{"letter":"C","text":"一項損失的原因未必是保單之保障範圍"},{"letter":"D","text":"根據情況，保險人可考慮通知警察"}],"answer":"C"},{"id":393,"chapter":"3","ref":"3.3.1","question":"近因在保險中非常重要，因為：","options":[{"letter":"A","text":"它確定了保險的存在"},{"letter":"B","text":"須要它確定投保物件的價值"},{"letter":"C","text":"不是所有引致的損失均受到保障"},{"letter":"D","text":"視乎情況，保險人可能會通知警方"}],"answer":"C"},{"id":394,"chapter":"3","ref":"3.3.1","question":"由於大部份保單都有除外責任，所以確定什麼是有效導致損失原因是十分重要，這類調查與下列哪項原則 最有關係？","options":[{"letter":"A","text":"最高誠信"},{"letter":"B","text":"近因"},{"letter":"C","text":"可保權益"},{"letter":"D","text":"代位"}],"answer":"B"},{"id":395,"chapter":"3","ref":"3.3.1","question":"以下哪項對近因的描述是正確的？","options":[{"letter":"A","text":"由不保危險引致的損失必然得不到保障"},{"letter":"B","text":"損失只是由除外危險引致損失是不可以得到保障"},{"letter":"C","text":"由不保危險或除外危險引致的損失必定得不到保障"},{"letter":"D","text":"以上各項皆正確"}],"answer":"B"},{"id":396,"chapter":"3","ref":"3.3.1","question":"以下哪項有關近因原則的陳述是正確的：","options":[{"letter":"A","text":"它在所有保險種類中均屬重要"},{"letter":"B","text":"嘗試推斷一項損失的有效理由"},{"letter":"C","text":"它是一項與索償極其重要的原則"},{"letter":"D","text":"以上各項皆正確"}],"answer":"D"},{"id":397,"chapter":"3","ref":"3.3.1","question":"一種理解為『一項對損失最顯著及最具效力的理由』的保險原則為：","options":[{"letter":"A","text":"近因"},{"letter":"B","text":"分擔"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"可保權益"}],"answer":"A"},{"id":398,"chapter":"3","ref":"3.3.1","question":"近因是：","options":[{"letter":"A","text":"推測近似損失的原因"},{"letter":"B","text":"不適用於所有保險類別之中"},{"letter":"C","text":"推測真正導致損失的原因"},{"letter":"D","text":"適用於安排保單的時候"}],"answer":"C"},{"id":399,"chapter":"3","ref":"3.3.1","question":"近因原則在保險中非常重要，理由是：","options":[{"letter":"A","text":"不是所有損失之近因都是受保的"},{"letter":"B","text":"政府要求損失之近因的統計數字"},{"letter":"C","text":"如屬個人疏忽導致的損失，保險人毋需負責"},{"letter":"D","text":"如屬天意造成的損失及損毀，保險人永遠不需賠償"}],"answer":"A"},{"id":400,"chapter":"3","ref":"3.3.1","question":"近因是重要的，因為","options":[{"letter":"A","text":"它找出買保險的原因"},{"letter":"B","text":"需要它確定保險標的的價值"},{"letter":"C","text":"不是每一項引致該損失的成因均受到保障"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":401,"chapter":"3","ref":"3.3.1","question":"近因：","options":[{"letter":"A","text":"對人壽保險來說從不重要"},{"letter":"B","text":"對所有索償情況來說均屬重要"},{"letter":"C","text":"從不被保單措詞所更改"},{"letter":"D","text":"符合以上各項的陳述"}],"answer":"B"},{"id":402,"chapter":"3","ref":"3.3.1","question":"近因的定義是甚麼？","options":[{"letter":"A","text":"最後導致損失的原因"},{"letter":"B","text":"間接導致損失的原因"},{"letter":"C","text":"真正導致損失的原因"},{"letter":"D","text":"任何導致損失的原因"}],"answer":"C"},{"id":403,"chapter":"3","ref":"3.3.3 (d)","question":"i 它是那個最接近有關損失的成因 ii 這是把一般合約中的原則應用到保險處境 iii 它是調查索償中一項重要的原則 iv 它是嘗試去揭開真正導致損失的原因","options":[{"letter":"A","text":"i & ii"},{"letter":"B","text":"ii & iii"},{"letter":"C","text":"iii & iv"},{"letter":"D","text":"i & iv"}],"answer":"C"},{"id":404,"chapter":"3","ref":"3.3.2","question":"在「近因」的法則中，一項並非在保障範圍內剔除，亦非包括在保障範圍內之危險名稱：","options":[{"letter":"A","text":"不保危險"},{"letter":"B","text":"非決定性危險"},{"letter":"C","text":"無保障危險"},{"letter":"D","text":"除外危險"}],"answer":"A"},{"id":405,"chapter":"3","ref":"3.3.2","question":"被保單條款所剔除的危險稱為：","options":[{"letter":"A","text":"除外危險"},{"letter":"B","text":"不保危險"},{"letter":"C","text":"不受保危險"},{"letter":"D","text":"不被接受的危險"}],"answer":"A"},{"id":406,"chapter":"3","ref":"3.3.2","question":"假如發生事件袛有單一成因，以下哪項描述是正確的？","options":[{"letter":"A","text":"不保危險引致的損失並不得到保障"},{"letter":"B","text":"除外危險引致的損失並不得到保障"},{"letter":"C","text":"受保危險引致的損失可以得到保障"},{"letter":"D","text":"以上各項皆正確"}],"answer":"D"},{"id":407,"chapter":"3","ref":"3.3.2","question":"導致損失的成因均稱為危險，近因應注意的危險為： i 受保危險 ii 不保危險 iii 除外危險 iv 額外危險","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"A"},{"id":408,"chapter":"3","ref":"3.3.2","question":"受保物件受到損害：","options":[{"letter":"A","text":"若危險是受保，被保險人可獲得賠償"},{"letter":"B","text":"若危險是除外保障，被保險人將得不到賠償"},{"letter":"C","text":"若危險是不保事項，被保險人將得不到賠償"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":409,"chapter":"3","ref":"3.3.2","question":"在近因原則中，以下哪些是不保危險的不正確陳述：","options":[{"letter":"A","text":"儘管不是特別包括在內，但也不是特別排除在外"},{"letter":"B","text":"由受保危險引致的不保危險，其導致的損失可得到保障"},{"letter":"C","text":"術語中\"不保危險\"及\"除外危險\"是完全相同的"},{"letter":"D","text":"如果由單一原因引致的損失，不保危險引致的損失是得不到保障的"}],"answer":"C"},{"id":410,"chapter":"3","ref":"3.3.2","question":"基本上，有 3 種危險是近因的考慮範圍，分別是受保危險，除外危險，及：","options":[{"letter":"A","text":"不保危險"},{"letter":"B","text":"額外危險"},{"letter":"C","text":"外來(特殊的)危險"},{"letter":"D","text":"特定附加在合約的危險"}],"answer":"A"},{"id":411,"chapter":"3","ref":"3.3.2","question":"危險的種類，可分為以下哪項或哪些項？ i 不保危險 ii 受保危險 iii 除外危險 iv 特殊危險","options":[{"letter":"A","text":"只有 i"},{"letter":"B","text":"ii, iii, iv"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"C"},{"id":412,"chapter":"3","ref":"3.3.2(c)","question":"假設火險保單只保障由火災或雷電帶來的損失或損壞。如果雨水透過開敞開窗戶而進入室內而造成的損失 是得不到保障的，因為其近因是：","options":[{"letter":"A","text":"除外危險"},{"letter":"B","text":"不保危險"},{"letter":"C","text":"外來危險"},{"letter":"D","text":"不可保危險"}],"answer":"B"},{"id":413,"chapter":"3","ref":"3.3.2(c)","question":"以下哪項指「既不是受保也不是除外責任的危險，而是在保單保障的範圍以外。」？","options":[{"letter":"A","text":"受保危險"},{"letter":"B","text":"除外危險"},{"letter":"C","text":"不保危險"},{"letter":"D","text":"不特定危險"}],"answer":"C"},{"id":414,"chapter":"3","ref":"3.3.2","question":"在近因中，導致損失的成因被描述為：","options":[{"letter":"A","text":"風險"},{"letter":"B","text":"危險"},{"letter":"C","text":"事故"},{"letter":"D","text":"實質或道德危險"}],"answer":"B"},{"id":415,"chapter":"3","ref":"3.3.3","question":"就近因法則而言，以下哪項或哪些是正確的?","options":[{"letter":"A","text":"如果損失的近因獲賠償，這一定不會是除外危險"},{"letter":"B","text":"損失的單一成因只涉及不保危險是不獲賠償的"},{"letter":"C","text":"損失是由不保危險引起的除外危險可得到保障"},{"letter":"D","text":"以上各項都是"}],"answer":"B"},{"id":416,"chapter":"3","ref":"3.3.3","question":"以下那項與近因有關","options":[{"letter":"A","text":"由受保危險引起，可獲得賠償"},{"letter":"B","text":"如非單一成因引起，危險必須既不是不保危險，也不是除外危險，便可得到保障"},{"letter":"C","text":"若保障是由除外危險引起，一般會令索償失效"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":417,"chapter":"3","ref":"3.3.3","question":"就近因而言，以下哪項或哪些陳述是正確的?","options":[{"letter":"A","text":"要構成有效的索償，近因不能屬於不保危險"},{"letter":"B","text":"由除外危險單獨地導致的損失便不會有保障"},{"letter":"C","text":"由自然地來自除外危險的不保危險導致的損害是不受到保障的"},{"letter":"D","text":"以上各項皆正確"}],"answer":"D"},{"id":418,"chapter":"3","ref":"3.3.3","question":"一批貨物已經購買商業火險單，大廈發現火災，貨物受濃煙損壞，損失是：","options":[{"letter":"A","text":"不會得到保障的，因為損失係由非受保危險引致"},{"letter":"B","text":"不會得到保障的，因為損失係由除外危險引致"},{"letter":"C","text":"得到保障的，因為損失係由受保危險引致不保危險"},{"letter":"D","text":"得到保障的，因為損失係由受保危險引致"}],"answer":"C"},{"id":419,"chapter":"3","ref":"3.3.3","question":"在考慮近因之應用時，如果一項特定損失只涉及單一成因，而：","options":[{"letter":"A","text":"成因是受保危險，被保人便可以得到損失的保障額"},{"letter":"B","text":"成因是不保危險，被保人便可以得到損失的保障額"},{"letter":"C","text":"成因是除外危險，被保人便可以得到損失的保障額"},{"letter":"D","text":"以上各項都是"}],"answer":"A"},{"id":420,"chapter":"3","ref":"3.3.3","question":"以下哪項關於近因是正確的：","options":[{"letter":"A","text":"必須涉及一項可受保危險"},{"letter":"B","text":"損失要得到賠償，一項危險的單一成因不能是除外危險或不保危險"},{"letter":"C","text":"非受保危險引起的一連串危險均不給予賠償"},{"letter":"D","text":"以上各項"}],"answer":"B"},{"id":421,"chapter":"3","ref":"3.3.3","question":"根據近因的一般原則，當雷電導致火警的話，以下哪類的損毀可按商業火險得到保障？ i. 電極造成的損毀 ii. 有關火警對建築物造成的損毀 iii. 濃煙對存貨造成的損毀，然而未有被火燒毀 iv. 因嘗試以水救火而對建築物造成的損毀","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":422,"chapter":"3","ref":"3.3.3","question":"以下哪項對於受保危險，不保危險及除外危險的描述是正確的？","options":[{"letter":"A","text":"因受保危險所引致的損失不可得到保障"},{"letter":"B","text":"因除外危險所引致的損失可得到保障"},{"letter":"C","text":"因受保危險直接產生的不保危險所導致的損失可得到保障"},{"letter":"D","text":"因受保危險直接產生的不保危險所導致的損失不可得到保障"}],"answer":"C"},{"id":423,"chapter":"3","ref":"3.3.3","question":"在近因原則中，以下哪些是不保危險的正確陳述：","options":[{"letter":"A","text":"損失由受保危險引致的不保危險，故此不可得到保障"},{"letter":"B","text":"如果由不保危險引致的損失是得到保障的"},{"letter":"C","text":"損失是由不保危險引致受保危險，故此得到賠償"},{"letter":"D","text":"損失是由不保危險引起的除外危險可得到保障"}],"answer":"C"},{"id":424,"chapter":"3","ref":"3.3.3(c)","question":"有關一項索償，是由一宗(受火險保單保障)意外火災而導致的。在火災發生的過程中，消防員為了進入 建築物通道及用水撲救火災，而進一步引致損失，就近因的規則以言，消防員的努力而引致的損失：","options":[{"letter":"A","text":"只有 50%的保障，因真正導致損失的是該火災"},{"letter":"B","text":"因由一項非受保危險導致的，故此得不到保障"},{"letter":"C","text":"是由一項受保危險而引致的不保危險，故此得到保障"},{"letter":"D","text":"只有由火險保單伸展到該危險風險時才能得到保障"}],"answer":"C"},{"id":425,"chapter":"3","ref":"3.3.3 (c)(i)","question":"一個單位購買火險後，鄰居發生火警，在必要情況下，消防員需要破壞此單位某些設施進入鄰居救火， 有關這些設施的損失：","options":[{"letter":"A","text":"因為受保危險引致不保危險，故此可得到賠償"},{"letter":"B","text":"因為不保危險引致受保危險，故此得不到賠償"},{"letter":"C","text":"屬於不保危險，故此得不到賠償"},{"letter":"D","text":"屬於受保危險，故此得到賠償"}],"answer":"A"},{"id":426,"chapter":"3","ref":"3.3.4","question":"如果一項保單除外責任中所採用的字眼規定由某指明原因「直接或間接」引致的損失是除外的，哪麼下列 哪項陳述是正確的？ i 無法透過這些字眼修改近因這個法則的應用 ii 與除外危險關係疏遠的損失都可能是屬於除外損失 iii 這是有利於被保險人 iv 直接由除外原因引致的損失都是不提供保障的","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"i, ii, iii"},{"letter":"D","text":"ii, iv"}],"answer":"D"},{"id":427,"chapter":"3","ref":"3.3.4","question":"在保險索償中，近因法則是：","options":[{"letter":"A","text":"不可以由保單條款來修改"},{"letter":"B","text":"往往可以由保單條款來修改"},{"letter":"C","text":"有時可以透過保單條款來修改"},{"letter":"D","text":"是絶對性的，不可經私人協議而修改"}],"answer":"C"},{"id":428,"chapter":"3","ref":"3.3.4","question":"近因對於保險索償來說是一項非常重要的原則，它在保險索償的應用：","options":[{"letter":"A","text":"永不會由保單條款來更改"},{"letter":"B","text":"往往可以由保單條款來更改"},{"letter":"C","text":"有時可以透過保單條款來修改"},{"letter":"D","text":"往往指個別索償得不到賠償"}],"answer":"C"},{"id":429,"chapter":"3","ref":"3.3.4","question":"保險單：","options":[{"letter":"A","text":"永不更改近因的原則"},{"letter":"B","text":"通常排除應用近因的原則"},{"letter":"C","text":"可能包括更改近因原則的短句"},{"letter":"D","text":"上述所有各項"}],"answer":"C"},{"id":430,"chapter":"3","ref":"3.3.4","question":"近因︰","options":[{"letter":"A","text":"可被保單條款措詞所更改"},{"letter":"B","text":"經常引伸拒絕賠償的情況"},{"letter":"C","text":"與損失賠償沒有關係"},{"letter":"D","text":"是保單成立時的重要元素"}],"answer":"A"},{"id":431,"chapter":"3","ref":"3.3.4 註","question":"由於在賠償過程中通常都會牽涉“近因”的運用，所以：","options":[{"letter":"A","text":"要視乎保險人的決定"},{"letter":"B","text":"可以由保單持有人提出證據便可以"},{"letter":"C","text":"運用時是可能會受到某些限制及頗為複雜"},{"letter":"D","text":"需交由法院判決"}],"answer":"C"},{"id":432,"chapter":"3","ref":"3.3.4 註","question":"由於近因是一項判斷損失的原因，基於這個原因，近因：","options":[{"letter":"A","text":"必然是易於判斷"},{"letter":"B","text":"在一些情況下，有時顯得頗為複雜"},{"letter":"C","text":"必然是難於判斷"},{"letter":"D","text":"必須經過法庭的判定"}],"answer":"B"},{"id":433,"chapter":"3","ref":"3.4-3.6","question":"以下哪項是保險理賠涉及的範疇：","options":[{"letter":"A","text":"損餘"},{"letter":"B","text":"代位權的可能性"},{"letter":"C","text":"分擔"},{"letter":"D","text":"以上各項"}],"answer":"D"},{"id":434,"chapter":"3","ref":"3.4","question":"彌償是指當損失出現時，對損失作出：","options":[{"letter":"A","text":"長遠具持續的補償"},{"letter":"B","text":"精確補償"},{"letter":"C","text":"50%的補償"},{"letter":"D","text":"有限度的補償"}],"answer":"B"},{"id":435,"chapter":"3","ref":"3.4","question":"彌償是一項重要原則，與下列那項或那些原則有關?","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"分擔"},{"letter":"C","text":"可保權益"},{"letter":"D","text":"以上各項"}],"answer":"D"},{"id":436,"chapter":"3","ref":"3.4","question":"一個保險的原則，致力於恢復被保人在損失前的財務狀況，被稱為：","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"代位"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"可保權益"}],"answer":"A"},{"id":437,"chapter":"3","ref":"3.4","question":"以下哪二項保險原理有相當密切的關係 i 彌償 ii 分擔 iii 近因 iv 最高誠信","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"ii, iii"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"i, iii"}],"answer":"A"},{"id":438,"chapter":"3","ref":"3.4","question":"如果一份保單承諾依據保單條款及條件向被保險人提供「彌償」，這意味著：","options":[{"letter":"A","text":"任何理賠給付均只能以現金方式進行"},{"letter":"B","text":"該份保單必須代表一份人壽保險合約"},{"letter":"C","text":"針對特定損失，該保險人只會給付己聲明的利益"},{"letter":"D","text":"保險人打算對損失提供一項精確的補償"}],"answer":"D"},{"id":439,"chapter":"3","ref":"3.4","question":"以下哪項有關彌償的描述並不正確？","options":[{"letter":"A","text":"它適用於大多數非彌償保單以外的險種"},{"letter":"B","text":"它僅僅適用於「利益保單」"},{"letter":"C","text":"它不適用於人身意外保險"},{"letter":"D","text":"它意味著保單持有人收到的賠償不會超越損失金額"}],"answer":"B"},{"id":440,"chapter":"3","ref":"3.4","question":"就保險而言，以下哪項或哪些有關彌償的陳述是正確的? i 它是通過眀示協議創造出來的 ii 它是適用於某些保險類別的隱含條款 iii 保險單的彌償高於金額是違法 iv 它的基本意圖是提供精確的財務補償","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"ii, iv"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":441,"chapter":"3","ref":"3.4","question":"一項損失發生了，金額為$4,000。就此提供保障的火險單的保額為$1,000,000，其中包含了一項比例分 擔條款和一項$1,000 的起賠額。損失發生時，受保財產的實在價值是$4,000,000。保險人根據保單提供 彌償後，將受摧毀財產出售，取得$800。請問保險人根據保單賠償多少錢？在出售受毀財產後，需就殘 餘價值（如有）向被保險人支付多少錢？","options":[{"letter":"A","text":"分別為$1,000 及$600"},{"letter":"B","text":"分別為$1,000 及$0"},{"letter":"C","text":"分別為$4,000 及$0"},{"letter":"D","text":"分別為$4,000 及$800"}],"answer":"B"},{"id":442,"chapter":"3","ref":"3.4","question":"一項損失發生了，金額為$4,000，就此提供保障的火險單的保額為$1,000,000，並包含了一項比例分攤條 件。損失發生時，受保財產的實在價值為$2,000,000。保險人就保單提供彌償後，把受摧毀的財產賣掉， 取得$500。請問保險人就保單賠付了多少錢？又就處理受摧毀的財產後，須就殘餘的部份(如有的話)，給 被保險人支付多少錢？","options":[{"letter":"A","text":"分別為$2,000 及$0"},{"letter":"B","text":"分別為$4,000 及$500"},{"letter":"C","text":"分別為$2,000 及$250"},{"letter":"D","text":"分別為$2,000 及$500"}],"answer":"A"},{"id":443,"chapter":"3","ref":"3.4","question":"某保單面額$1,000,000，出現受保損失$6,000。而該保單受到比例分攤及單一物件限額限制，如受保物件 實質價值為$3,000,000。保單限額為$8,000，保險人在賠償後出售損餘價值為$300，請問被保險人可得 之實際償付及就損餘部分之價值分配為：","options":[{"letter":"A","text":"被保險人$6,000 保險人 - $0"},{"letter":"B","text":"被保險人$2,000 保險人 - $0"},{"letter":"C","text":"被保險人$6,000 保險人 - $300"},{"letter":"D","text":"被保險人$2,000 保險人 - $300"}],"answer":"D"},{"id":444,"chapter":"3","ref":"3.4.1","question":"就保險而言，以下哪項或哪些有關彌償的陳述是正確的? i 它是通過眀示協議創造出來的 ii 它是適用於某些保險類別的隱含條款 iii 保險單的彌償高於金額是違法 iv 它的基本意圖是提供精確的財務補償","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"ii, iv"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"C"},{"id":445,"chapter":"3","ref":"3.4.2","question":"人壽與人生意外保險都不受彌償的原則約束，因為:","options":[{"letter":"A","text":"人命是可以財務方法計算價值"},{"letter":"B","text":"不可能以財務方法精確計算人命的"},{"letter":"C","text":"保險人不願意作出十足的財務補償"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":446,"chapter":"3","ref":"3.4.2","question":"人壽及人身意外保險有時又稱為「利益保單」，原因是：","options":[{"letter":"A","text":"在正常情況下不能提供彌償"},{"letter":"B","text":"提供的金錢是財務補償"},{"letter":"C","text":"支付本身利益毋須繳稅"},{"letter":"D","text":"屬於人身保險，因此不受比例分擔約束"}],"answer":"A"},{"id":447,"chapter":"3","ref":"3.4.2","question":"彌償是一種對損失的精確財務補償，故適用於：","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"人身意外保險"},{"letter":"C","text":"汽車保險"},{"letter":"D","text":"以上各項都是"}],"answer":"C"},{"id":448,"chapter":"3","ref":"3.4.2 &","question":"一名男子在撞車意外中死亡。他有意外死亡保單的保障，同時他的汽車保單提供死亡權益。在這情況下： 3.5.4","options":[{"letter":"A","text":"兩份保單均須作出賠償"},{"letter":"B","text":"只由最先生效的保單才需支付"},{"letter":"C","text":"只由保額較大的保單才需支付"},{"letter":"D","text":"由於是汽車意外,因此由汽車保單提供權益"}],"answer":"A"},{"id":449,"chapter":"3","ref":"3.4.2","question":"下列那項最能解釋彌償?","options":[{"letter":"A","text":"補償"},{"letter":"B","text":"精確賠償"},{"letter":"C","text":"保單的實際保額"},{"letter":"D","text":"保險標的實際價值"}],"answer":"B"},{"id":450,"chapter":"3","ref":"3.4.2","question":"人壽及人身意外保險有時會被稱為「利益保單」 ，這是由於下列哪項原因？","options":[{"letter":"A","text":"在正常情況下，他們不提供彌償"},{"letter":"B","text":"賠付的比財務損失多"},{"letter":"C","text":"所繳付的保費毋須繳稅"},{"letter":"D","text":"在賠償時，不會受比例分擔約束"}],"answer":"A"},{"id":451,"chapter":"3","ref":"3.4.2","question":"下列哪項不屬於彌償？ i 人壽保險 ii 火險 iii 水險 iv 人身意外保險","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iv"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"B"},{"id":452,"chapter":"3","ref":"3.5.4","question":"亡：","options":[{"letter":"A","text":"每份保單必須賠償死亡利益全數"},{"letter":"B","text":"僅僅首先生效的保單必須支付死亡利益"},{"letter":"C","text":"僅僅提供較大保額的保單必須賠償"},{"letter":"D","text":"既然死亡是由汽車意外導致，僅僅汽車保單須賠付"}],"answer":"A"},{"id":453,"chapter":"3","ref":"3.4.3","question":"i 人命是沒有任何方法精確地以財務方法量度 ii 人壽保險一般視為附有無窮的可保權益 iii 人壽保險一般視為附有有限的可保權益 iv 人命是可以精確地以財務方法量度","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"A"},{"id":454,"chapter":"3","ref":"3.4.2&3.4.3","question":"以下哪項不是一般業務的處理範圍：","options":[{"letter":"A","text":"計算彌償"},{"letter":"B","text":"運用比例分攤"},{"letter":"C","text":"計算及處理保單抵押貸款"},{"letter":"D","text":"應用代位"}],"answer":"C"},{"id":455,"chapter":"3","ref":"3.4.3","question":"以下哪一項保險產品類別，是不適用於彌償的定義上：","options":[{"letter":"A","text":"汽車意外"},{"letter":"B","text":"家居保險"},{"letter":"C","text":"火險"},{"letter":"D","text":"人身意外保險"}],"answer":"D"},{"id":456,"chapter":"3","ref":"3.4.3","question":"權益保單不適於彌償的原則，因為：","options":[{"letter":"A","text":"權益的定義是可大可細難以釐定"},{"letter":"B","text":"這是保險公司所定的法定條例"},{"letter":"C","text":"權益保單是涉及人壽及人身意外故此是不適用"},{"letter":"D","text":"彌償與權益保單完全談不上"}],"answer":"C"},{"id":457,"chapter":"3","ref":"3.4.2&3.4.3","question":"在普通情況下，人壽及大部份人身意外保險均不受彌償約束，以下哪項或哪些原因是正確的？","options":[{"letter":"A","text":"人命價值是無法量度的"},{"letter":"B","text":"這種保險是具有無限可保權益的"},{"letter":"C","text":"不論支付多少，也無法得出精確財務補償額"},{"letter":"D","text":"以上所有各項均成立"}],"answer":"D"},{"id":458,"chapter":"3","ref":"3.4.3","question":"在保險原則中，彌償與可保權益:","options":[{"letter":"A","text":"是完全相同的"},{"letter":"B","text":"是亳不相干的"},{"letter":"C","text":"均與近因有著密切的關係"},{"letter":"D","text":"皆有著共同的基礎，因為它們涉及被保人的財務權益"}],"answer":"D"},{"id":459,"chapter":"3","ref":"3.4.3","question":"人壽及人身意外保單有時稱為「權益保單」，這是由於它們：","options":[{"letter":"A","text":"屬於人身保險，因此不受比例分攤的約束；"},{"letter":"B","text":"在正常情況下都能提供彌償；"},{"letter":"C","text":"所提供的多於財務補償；"},{"letter":"D","text":"按本身支付的金錢，毋需繳稅。"}],"answer":"A"},{"id":460,"chapter":"3","ref":"3.4.3","question":"以下哪一項保險原則與彌償的聯繫是最少？","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"分擔"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"可保權益"}],"answer":"C"},{"id":461,"chapter":"3","ref":"3.4.3","question":"一份恰當地安排的財產保險，於被保險的全損出現時，應可提供完全的補償。這項補償代表該名被保險人 在有關財產上的權益，顯示彌償與以下哪一項的原則相連？","options":[{"letter":"A","text":"近因"},{"letter":"B","text":"可保權益"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"以上所有各項"}],"answer":"B"},{"id":462,"chapter":"3","ref":"3.4.4","question":"i 家居保險 ii 水險 iii 人身意外保險 iv 人壽保險","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"iii, iv"},{"letter":"C","text":"i, iii"},{"letter":"D","text":"ii, iv"}],"answer":"B"},{"id":463,"chapter":"3","ref":"3.4.3","question":"以彌償原則而言，在某些情況下可容許賠償的金額可超過實際損失，而並不包括：","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"重置保險"},{"letter":"C","text":"以新代舊保障"},{"letter":"D","text":"約定價值保單"}],"answer":"A"},{"id":464,"chapter":"3","ref":"3.4.4","question":"雖然彌償有多種方法，但以下哪項為一般最常用及方便的方法：","options":[{"letter":"A","text":"現金支付"},{"letter":"B","text":"修理受保物件"},{"letter":"C","text":"更換受保物件"},{"letter":"D","text":"復原受保物件"}],"answer":"A"},{"id":465,"chapter":"3","ref":"3.4.4","question":"以下哪項或哪些保險是以修理損失作為彌償方式？","options":[{"letter":"A","text":"玻璃保險"},{"letter":"B","text":"公眾責任保險"},{"letter":"C","text":"非全險汽車索償"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":466,"chapter":"3","ref":"3.4.4","question":"更換一件受損害或毀壞物件是損害賠償的一科，以下哪項或那些描述正確的?","options":[{"letter":"A","text":"車險而已"},{"letter":"B","text":"對保險人而言是最方便的方法"},{"letter":"C","text":"只有少許損壞或折扣中才可使用"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":467,"chapter":"3","ref":"3.4.4","question":"如何提供彌償？ i 支付現金 ii 修理 iii 更換 iv 恢復原狀","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":468,"chapter":"3","ref":"3.4.4(a)","question":"以下哪項彌償是在任何情況之下，也能夠以最實際方式提供？","options":[{"letter":"A","text":"支付現金"},{"letter":"B","text":"修理"},{"letter":"C","text":"更換"},{"letter":"D","text":"恢復原狀"}],"answer":"A"},{"id":469,"chapter":"3","ref":"3.4.4(c)","question":"更換一項受摧毀或失掉的受保物件，可以作為一種提供損害賠償的形式。這種安排適合以下哪項情況？","options":[{"letter":"A","text":"每類型的索償"},{"letter":"B","text":"僅於汽車保險而已"},{"letter":"C","text":"完全沒有或只有少量折舊的物件"},{"letter":"D","text":"只有在盜竊是損失的近因時"}],"answer":"C"},{"id":470,"chapter":"3","ref":"3.4.5","question":"若在毀項一項金磚而又留下殘餘的金碎，在理賠時會把殘餘一併計算，稱為：","options":[{"letter":"A","text":"損餘"},{"letter":"B","text":"分擔比例"},{"letter":"C","text":"剩餘物資"},{"letter":"D","text":"損毀"}],"answer":"A"},{"id":471,"chapter":"3","ref":"3.4.5","question":"「損餘」的定義為：","options":[{"letter":"A","text":"搶修損害物件涉及的資金"},{"letter":"B","text":"搶救有關保險標的的資金"},{"letter":"C","text":"保險標的的剩餘部份"},{"letter":"D","text":"以上所有各項"}],"answer":"C"},{"id":472,"chapter":"3","ref":"3.4.5","question":"損餘在保險公司運作上，通常：","options":[{"letter":"A","text":"保險人是用作量度損失的準確金額時特別留意部份"},{"letter":"B","text":"與海上所指的救援費用同屬同一意思"},{"letter":"C","text":"只限汽車殘駭上的應用"},{"letter":"D","text":"無論任何情況下保險人只付一半賠償"}],"answer":"A"},{"id":473,"chapter":"3","ref":"3.4.5","question":"考慮 Salvage 時，以下哪項並不正確：","options":[{"letter":"A","text":"只有當彌償出現時才會考慮"},{"letter":"B","text":"在海事法中,” Salvage” 一詞帶有截然不同的意思"},{"letter":"C","text":"在提供彌償時, 必須把該價值考慮在內"},{"letter":"D","text":"只有在不足保險上才會考慮"}],"answer":"D"},{"id":474,"chapter":"3","ref":"3.4.5","question":"在多數的財產保險索償中標的有時還有剩餘價值，該價值應於賠償給付中計算在內，稱為：","options":[{"letter":"A","text":"損餘"},{"letter":"B","text":"分擔"},{"letter":"C","text":"比例分攤"},{"letter":"D","text":"代位"}],"answer":"A"},{"id":475,"chapter":"3","ref":"3.4.5","question":"作為計算彌償時予以考慮的一環，「損餘」應解作：","options":[{"letter":"A","text":"出現損失前該物件的價值"},{"letter":"B","text":"維修損毀物件時應該給付的金錢"},{"letter":"C","text":"搶救涉及索償物件的成本"},{"letter":"D","text":"損毀標的的剩餘部份"}],"answer":"D"},{"id":476,"chapter":"3","ref":"3.4.5","question":"損餘可被定義為：","options":[{"letter":"A","text":"向保險人交出標的，以索取全部損失賠償金額的慣例"},{"letter":"B","text":"部分損失"},{"letter":"C","text":"損毀標的的剩餘部份"},{"letter":"D","text":"金額以下的任何損失，被保險人都得不到保障"}],"answer":"C"},{"id":477,"chapter":"3","ref":"3.4.5","question":"以下哪項對損餘的描述是不正確的？","options":[{"letter":"A","text":"向保險人交出標的，以索取全部損失賠償金額的慣例"},{"letter":"B","text":"部分損失"},{"letter":"C","text":"損毀標的的剩餘部份"},{"letter":"D","text":"金額以下的任何損失，被保險人都得不到保障"}],"answer":"D"},{"id":478,"chapter":"3","ref":"3.4.5(b)","question":"汽車在意外中受到損毀，保險公司已按照意外損失之數額作出十足賠償；損餘價值之剩餘部份$2,000 可怎樣處理？","options":[{"letter":"A","text":"全數歸於保險人"},{"letter":"B","text":"保險人與被保險人平均分配"},{"letter":"C","text":"由法庭判決"},{"letter":"D","text":"全歸於被保險人"}],"answer":"A"},{"id":479,"chapter":"3","ref":"3.4.6","question":"以下哪些形容委付是正確的？","options":[{"letter":"A","text":"大多數出現在水險中"},{"letter":"B","text":"於火險單中，通常剔除委付"},{"letter":"C","text":"將損餘交付保險人"},{"letter":"D","text":"以上各項"}],"answer":"D"},{"id":480,"chapter":"3","ref":"3.4.6","question":"損餘出現時，若被保險人保留損餘，保險人會從賠償中扣除損餘之價值；若被保險人不保留損餘，以下 哪種情況會出現？","options":[{"letter":"A","text":"合約便失去效力"},{"letter":"B","text":"保險人可拒絕賠償"},{"letter":"C","text":"保險人可要求被保險人出售損餘"},{"letter":"D","text":"被保險人將損餘交予保險人，以求全數索償"}],"answer":"D"},{"id":481,"chapter":"3","ref":"3.4.6","question":"當被保險人提出索償時，將損餘部份交予保險人以換取索取全數賠償。當保險人出售該損餘後，該筆款項:","options":[{"letter":"A","text":"保險人得到不俗的額外利益"},{"letter":"B","text":"保險人及被保險人各佔 50%"},{"letter":"C","text":"全數交予政府"},{"letter":"D","text":"全數交予被保險人(因保險人不可得到其利益)"}],"answer":"A"},{"id":482,"chapter":"3","ref":"3.4.6","question":"以下哪三項形容委付是正確的？ i 委付是將損餘交付保險人的行為 ii 出售損餘後的收入歸於保險人 iii 適用於任何類型保單﹝人壽及一般保險﹞ iv 非水險保單條件通常剔除委任","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":483,"chapter":"3","ref":"3.4.6","question":"以下哪項對水險委付非常重要","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"近因"},{"letter":"C","text":"可保權益"},{"letter":"D","text":"最高誠信"}],"answer":"A"},{"id":484,"chapter":"3","ref":"3.4.6","question":"「委付」最常見於以下哪類保險？","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"火險"},{"letter":"C","text":"水險"},{"letter":"D","text":"汽車保險"}],"answer":"C"},{"id":485,"chapter":"3","ref":"3.4.6","question":"如果汽車在意外中毀爛，保險人雖已作出全額賠償，但仍需考慮汽車殘骸的任何剩餘價值。該殘骸如以 港幣 2,000 元被售出，該殘骸的價值","options":[{"letter":"A","text":"應全數屬於被保險人"},{"letter":"B","text":"應全數屬於保險人"},{"letter":"C","text":"應在下一次保費扣除"},{"letter":"D","text":"包括在以後任何一項賠償中"}],"answer":"B"},{"id":486,"chapter":"3","ref":"3.4.6","question":"可能在機緣巧合下，在出售損餘後的款項高於實際賠償的金額，那麼：","options":[{"letter":"A","text":"保險人便可賺取不俗的利潤"},{"letter":"B","text":"盈餘須與被保險人以五五分賬形式分享"},{"letter":"C","text":"這項事宜須呈與法庭解決"},{"letter":"D","text":"盈餘須歸予被保險人(保險人沒有權利賺取利潤)"}],"answer":"A"},{"id":487,"chapter":"3","ref":"3.4.7(a)","question":"取得$800，請問被保險人最終可獲多少賠償及可獲得多少因出售損餘(如有)所得的金額？","options":[{"letter":"A","text":"2,000 + 200"},{"letter":"B","text":"2,000 + 0"},{"letter":"C","text":"8,000 + 200"},{"letter":"D","text":"8,000 + 0"}],"answer":"B"},{"id":488,"chapter":"3","ref":"3.4.7","question":"有些保單條款允許多於嚴格彌償的賠償，以下哪項不屬於這個範圍之內？","options":[{"letter":"A","text":"比例分攤"},{"letter":"B","text":"約定價值保單"},{"letter":"C","text":"重置保險"},{"letter":"D","text":"“以新代舊”保單"}],"answer":"A"},{"id":489,"chapter":"3","ref":"3.4.7","question":"對於一份意圖屬於彌償的保單，以下哪項或哪些可能免除彌償原則賠付？","options":[{"letter":"A","text":"保單免賠額"},{"letter":"B","text":"比例分攤條款"},{"letter":"C","text":"保單起賠額(賠償金額少於起賠額)"},{"letter":"D","text":"以上各項皆是"}],"answer":"D"},{"id":490,"chapter":"3","ref":"3.4.7","question":"以下哪項對保單起賠額或免賠額的描述是正確的？ i 兩種保單均減少瑣碎的索償 ii 兩種保單意味著相同的運作方式 iii 保單起賠額之保單會賠償全數損失如損失超過起賠額 iv 對少於起賠額的損失是不受保單的保障","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"iii, iv"},{"letter":"D","text":"i, iv"}],"answer":"C"},{"id":491,"chapter":"3","ref":"3.4.7(a)","question":"在處理一項財產保險的保險中介人，應盡力確保客戶將要求的保額是代表該財產的價值，因不足額的保險:","options":[{"letter":"A","text":"合約便告無效"},{"letter":"B","text":"被保人需要付額外的保費"},{"letter":"C","text":"保險人於賠償時會作出比例分攤"},{"letter":"D","text":"不足額保險是不重要的"}],"answer":"C"},{"id":492,"chapter":"3","ref":"3.4.7(a)","question":"如果一份財產保險內包含「比例分攤條款」，這是","options":[{"letter":"A","text":"不足額保險是不重要的"},{"letter":"B","text":"不論在什麼情況下均不會對損失提供全數的賠償"},{"letter":"C","text":"在買足額保險的情況下便會對損失提供全數的賠償"},{"letter":"D","text":"它是代表標準風險，因此標準保費該是適合這風險"}],"answer":"C"},{"id":493,"chapter":"3","ref":"3.4.7(a)","question":"如果一份財產保險單被稱為「受比例分攤條件約束」，那麼它的意思是：","options":[{"letter":"A","text":"所代表的是一種標準風險，因此標準保費適用於該風險"},{"letter":"B","text":"不足額保險是不重要的"},{"letter":"C","text":"在任何情況下均不會對損失提供十足的支付"},{"letter":"D","text":"如果保額足夠的話，便會對損失提供十足的支付"}],"answer":"D"},{"id":494,"chapter":"3","ref":"3.4.7(a)","question":"海上保險述語「海損(Average)」是指：","options":[{"letter":"A","text":"部分(非全部)損失"},{"letter":"B","text":"不足額保險的懲罰"},{"letter":"C","text":"標準風險的選擇"},{"letter":"D","text":"剩餘保險標的的價值"}],"answer":"A"},{"id":495,"chapter":"3","ref":"3.4.7(a)","question":"以下哪三項對於保險術語中\"average\"的含義中，哪項或哪些是不正確?","options":[{"letter":"A","text":"在火險中，它是指不足額的保險"},{"letter":"B","text":"在水險中，它的含義與火險截然不同"},{"letter":"C","text":"對不足額保險之處罰，應用於各類的保險"},{"letter":"D","text":"以上各項皆不正確"}],"answer":"C"},{"id":496,"chapter":"3","ref":"3.4.7(b)","question":"如果一份保單有 3,000 港元的免賠額，意思是：","options":[{"letter":"A","text":"如果損失超過 3,000 元便不會得到賠償"},{"letter":"B","text":"如果損失不超過 3,000 元便會得到賠償"},{"letter":"C","text":"如果損失超過 3,000 元便會得到全額賠償"},{"letter":"D","text":"如果損失不超過 3,000 元便不會得到賠償"}],"answer":"D"},{"id":497,"chapter":"3","ref":"3.4.7(b)&","question":"以下哪項是對「免賠額」和「起賠額」的正確描述？ (c) i 兩者的原意均是避免瑣碎的索償 ii 兩者的意思一樣 iii 當低於免賠額時得不到賠償 iv 當高於起賠額時可獲全數的金償","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, iii, iv"},{"letter":"C","text":"i, ii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":498,"chapter":"3","ref":"3.4.7(b)","question":"保單出現 x 元的免賠額賠償，當索償出現時：","options":[{"letter":"A","text":"被保人的首 x 元，不會獲得賠償"},{"letter":"B","text":"索償超過 x 元，保險人不會賠償"},{"letter":"C","text":"索償超過 x 元，保險人賠償 x 元"},{"letter":"D","text":"以上各項不是"}],"answer":"A"},{"id":499,"chapter":"3","ref":"3.4.7(b)","question":"在彌償中，下列哪些條件有時意味著比應予賠償為少的金額？ &(c) i 保單免賠額 ii 保單起賠額 iii 約定價值保單 iv 水險保單","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"A"},{"id":500,"chapter":"3","ref":"3.4.7(c)","question":"水險保單起賠額為 5%，下列哪項損失賠償為正確？","options":[{"letter":"A","text":"損失 3%，則全數賠償 3%"},{"letter":"B","text":"損失超過 5%，則全數賠償損失"},{"letter":"C","text":"損失 6%，則賠償 5%以外的損失"},{"letter":"D","text":"損失超過 5%，只賠償 5%"}],"answer":"B"},{"id":501,"chapter":"3","ref":"3.4.7(c)","question":"索償如達 X 元便作出正常賠償的保單，利用了限制彌償保單中的哪項條款？","options":[{"letter":"A","text":"保單超額的十足賠償"},{"letter":"B","text":"保單起賠額的十足賠償"},{"letter":"C","text":"保單超額的保費"},{"letter":"D","text":"保單起賠額的保費"}],"answer":"B"},{"id":502,"chapter":"3","ref":"3.4.8","question":"某部電視機在火災損壞的時間已使用了 5 年，該損壞所引致的維修費用為$5,000，而有關的家居保險人 則負責全數賠付，由此可推斷有關保險是以下面哪項形式訂立？","options":[{"letter":"A","text":"「以舊代新」形式"},{"letter":"B","text":"重置保險"},{"letter":"C","text":"「以新代舊」形式"},{"letter":"D","text":"約定價值保單"}],"answer":"C"},{"id":503,"chapter":"3","ref":"3.4.8","question":"哪一項是屬於「超越彌償」的類別？","options":[{"letter":"A","text":"雙方協議"},{"letter":"B","text":"以舊代新"},{"letter":"C","text":"約定價值"},{"letter":"D","text":"保單起賠額"}],"answer":"C"},{"id":504,"chapter":"3","ref":"3.4.8","question":"重置保險、「以新代舊」保障、約定價值保單及水險保單之共通點是：","options":[{"letter":"A","text":"與火險有關"},{"letter":"B","text":"與水險有關"},{"letter":"C","text":"與彌償並沒有關係"},{"letter":"D","text":"與提供超越彌償的保單條文有關"}],"answer":"D"},{"id":505,"chapter":"3","ref":"3.4.8","question":"下列哪三項屬於當索償出現時，可以提供超越彌償的保險種類？ i 「以新代舊」保障 ii 重置保險 iii 人身意外保險 iv 水險的定值保單","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"ii, iii, iv"}],"answer":"B"},{"id":506,"chapter":"3","ref":"3.4.8","question":"一幢大廈因地震倒塌，而這大廈已經有二十年樓齡，大廈亦有購買火災及附加危險保障，讓保險人須為重 建這大廈的費用作出全數賠付，但不能扣除損耗，即是表示這大廈的保險是以什麼形式發出：","options":[{"letter":"A","text":"以舊代新形式"},{"letter":"B","text":"不能扣減形式"},{"letter":"C","text":"以新代舊形式"},{"letter":"D","text":"重置保險"}],"answer":"D"},{"id":507,"chapter":"3","ref":"3.4.8(c)","question":"保單的賠償額已決定，當損失出現時，保單就會承擔這個金額，這種賠償方式稱為：","options":[{"letter":"A","text":"重置保險"},{"letter":"B","text":"以新代舊"},{"letter":"C","text":"約定價值"},{"letter":"D","text":"水險保單"}],"answer":"C"},{"id":508,"chapter":"3","ref":"3.4.8(d)","question":"一份海上船體保單的承保表是這樣寫的「保額：$1,000,000；約定價值：$1,000,000。」這意味？","options":[{"letter":"A","text":"當一項損失發生時，賠償金額是保額的一半"},{"letter":"B","text":"該約定價值將被視為損失時的實際價值，但只限於全損索償目的"},{"letter":"C","text":"該約定價值將被視為損失時的實際價值"},{"letter":"D","text":"這是一項重置賠償"}],"answer":"C"},{"id":509,"chapter":"3","ref":"3.4.8(c)","question":"下列哪項有關約定價值保單是正確的？ i 這類保單可以用於價值較高的物件上，例如藝術作品 ii 折舊是最大的考慮因素 iii 保額視乎專家的估價 iv 當出現全損時，保單就會承擔專家估價的保額再扣除當時的折舊率","options":[{"letter":"A","text":"i, ii"},{"letter":"B","text":"i, iii"},{"letter":"C","text":"ii, iii"},{"letter":"D","text":"iii, iv"}],"answer":"B"},{"id":510,"chapter":"3","ref":"3.4.8(d)","question":"一份水險保單以「定值」作索償，下列哪項損失賠償為正確：","options":[{"letter":"A","text":"賠償金額為保額一半"},{"letter":"B","text":"這是一份彌償保險"},{"letter":"C","text":"以約定的定價賠償"},{"letter":"D","text":"無論損失多少也會得到十足的賠償"}],"answer":"C"},{"id":511,"chapter":"3","ref":"3.4.8(d)","question":"一份海上船體保單的承保表是這樣寫著：「保額：$1,000,000，約定價值：$1,000,000」這表示：","options":[{"letter":"A","text":"損失發生時，賠償金額是保額的全部；"},{"letter":"B","text":"約定價值視為損失時的實際價值，但只限於全損理賠目的；"},{"letter":"C","text":"約定價值視為損失時的實際價值；"},{"letter":"D","text":"這是一項「以新代舊」賠償"}],"answer":"C"},{"id":512,"chapter":"3","ref":"3.5","question":"以下哪種情況，分擔原則不大可能被保單條款修改：","options":[{"letter":"A","text":"限制保單按特定比例支付金額"},{"letter":"B","text":"删除更具體受保物件的保障"},{"letter":"C","text":"取消分擔按金額全數支付"},{"letter":"D","text":"有其他保單提供彌償，取消保障"}],"answer":"D"},{"id":513,"chapter":"3","ref":"3.5","question":"分擔不適用於買方兩份人壽保險合約被保人，因為：","options":[{"letter":"A","text":"分擔只適用於火險及盜竊險"},{"letter":"B","text":"被保人已就該兩份保單支付保費"},{"letter":"C","text":"人壽保險保單有免除分擔條款"},{"letter":"D","text":"人壽保險是不受制於彌償的最終原則的"}],"answer":"D"},{"id":514,"chapter":"3","ref":"3.5","question":"分擔屬於下列哪項的重要原則之一？","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"彌償"},{"letter":"C","text":"委付"},{"letter":"D","text":"損餘"}],"answer":"B"},{"id":515,"chapter":"3","ref":"3.5","question":"彌償引伸出兩個重要原則：代位及","options":[{"letter":"A","text":"分擔"},{"letter":"B","text":"委付"},{"letter":"C","text":"損餘"},{"letter":"D","text":"雙重保險"}],"answer":"A"},{"id":516,"chapter":"3","ref":"3.5","question":"代位和分擔有近似的目標，它們都是：","options":[{"letter":"A","text":"它們都有兩份保單"},{"letter":"B","text":"每份保單都有共同的保障"},{"letter":"C","text":"保險人向引致疏忽的人作出追討賠償"},{"letter":"D","text":"賠償額不能大於彌償"}],"answer":"D"},{"id":517,"chapter":"3","ref":"3.5&3.6","question":"代位與分擔有近似目標，就是兩者均：","options":[{"letter":"A","text":"要求有兩份或以上保單"},{"letter":"B","text":"要求其他保險保障相同權益"},{"letter":"C","text":"力求確保疏忽一方支付損失"},{"letter":"D","text":"力求確保被保險人最後收取不會超過彌償"}],"answer":"D"},{"id":518,"chapter":"3","ref":"3.5.1","question":"保險的理賠部門毋需考慮以下哪項因素？","options":[{"letter":"A","text":"代位"},{"letter":"B","text":"未清還的貸款"},{"letter":"C","text":"分擔的可能性"},{"letter":"D","text":"比例分攤"}],"answer":"C"},{"id":519,"chapter":"3","ref":"3.5.1","question":"在「海上保險條例」中，關於「重覆保險」一項術語，這一項普通法的原則，並與以下那項原則有關：","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"代位"},{"letter":"C","text":"分擔"},{"letter":"D","text":"可保權益"}],"answer":"C"},{"id":520,"chapter":"3","ref":"3.5.1","question":"分擔是指兩個或多個保險人就一項損失分擔的成本，並且以以下哪項為主導：","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"近因"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"可保權益"}],"answer":"A"},{"id":521,"chapter":"3","ref":"3.5.1","question":"如果被保人擁有兩份保障相同損失的彌償保單，釐定如何在兩者分配損失的保險原則為：","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"分擔"},{"letter":"C","text":"可保權益"},{"letter":"D","text":"最高誠信"}],"answer":"B"},{"id":522,"chapter":"3","ref":"3.5.1","question":"在重覆保險上，以下哪項不應出現分擔原理？","options":[{"letter":"A","text":"火險"},{"letter":"B","text":"盜竊保險"},{"letter":"C","text":"人身意外保險中的人壽利益部份"},{"letter":"D","text":"以上各項皆是"}],"answer":"C"},{"id":523,"chapter":"3","ref":"3.5.1","question":"如果投保人為自己的財產投買了兩份保障(例如盜竊)，在合法的情況下：","options":[{"letter":"A","text":"投保人可以得到雙倍賠償"},{"letter":"B","text":"因為可能是欺詐，所以得不到賠償"},{"letter":"C","text":"只有第一間保險公司才需賠償"},{"letter":"D","text":"該兩間保險公司均需分擔有關的損失"}],"answer":"D"},{"id":524,"chapter":"3","ref":"3.5.1","question":"投保人持有兩份就同一保障的玻璃保險，即個別保險人均需就損失賠償，此稱為重覆保險，這與以下那項 原則有關？","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"分擔"},{"letter":"C","text":"近因"},{"letter":"D","text":"最高誠信"}],"answer":"B"},{"id":525,"chapter":"3","ref":"3.5.1","question":"以下哪項或哪些對分擔的陳述是正確的?","options":[{"letter":"A","text":"適用於人壽保險保單"},{"letter":"B","text":"只適合應用於彌償保險"},{"letter":"C","text":"不適用於彌償保險"},{"letter":"D","text":"其中一方在索償時出現過錯的保單"}],"answer":"B"},{"id":526,"chapter":"3","ref":"3.5.1","question":"如果被保險人投買了兩份保障相同損失的火險保單，對賠償分配的有關原則為：","options":[{"letter":"A","text":"分擔"},{"letter":"B","text":"可保權益"},{"letter":"C","text":"最高誠信"},{"letter":"D","text":"彌償"}],"answer":"A"},{"id":527,"chapter":"3","ref":"3.5.2","question":"當發生一項$1,000,000 的財產損失，當中出現雙重保險。因此，一名提供財產全險保障保險人委任的 理賠師建議提供$400,000 的賠償，有關保額為$10,000,000，這顯示以下哪項所述是正確的？","options":[{"letter":"A","text":"所有其他有關保單均有比率之數條款"},{"letter":"B","text":"這份保單有比率之數條款"},{"letter":"C","text":"這份保單有比例分擔條款"},{"letter":"D","text":"所有有關保單均有比率之數條款"}],"answer":"B"},{"id":528,"chapter":"3","ref":"3.5.3","question":"必須符合以下哪些條件，才可以應用分擔？","options":[{"letter":"A","text":"每份保單必須屬非彌償保單"},{"letter":"B","text":"每份保單必須有相同的條款及相同的保額"},{"letter":"C","text":"每份保單必須保障一套相同的危險"},{"letter":"D","text":"每份保單均保障受影響的權益"}],"answer":"D"},{"id":529,"chapter":"3","ref":"3.5.3","question":"銀行向’A’的物業作出貸款，銀行基於本身的利益為該貸款購買保險(貸款價值)，而’A’亦為該物業購買 保險，當損失出現時：","options":[{"letter":"A","text":"不適用於比例分擔條款，保險人各自賠償 50%"},{"letter":"B","text":"不適用於分擔條款，因兩份保險提供的不同保障"},{"letter":"C","text":"只有’A’得到賠償，因兩份保險提供的不同保障"},{"letter":"D","text":"只有銀行得到賠償，因兩份保險提供的不同保障"}],"answer":"B"},{"id":530,"chapter":"3","ref":"3.5.3","question":"以下哪項準則對分擔來說並非必要？","options":[{"letter":"A","text":"每份保單均需是彌償合約"},{"letter":"B","text":"每份保單均需是保障相同的財務權益"},{"letter":"C","text":"每份保單均需引起損失的相同危險"},{"letter":"D","text":"每份保單具備相同的條款及相同的保額"}],"answer":"D"},{"id":531,"chapter":"3","ref":"3.5.3(a)","question":"為： 分擔可以出現於：","options":[{"letter":"A","text":"人壽保險保單"},{"letter":"B","text":"提供利益的保單"},{"letter":"C","text":"提供彌償的保單"},{"letter":"D","text":"不提供彌償的保單"}],"answer":"C"},{"id":532,"chapter":"3","ref":"3.5.4","question":"分擔只能應用於：","options":[{"letter":"A","text":"與人壽保單之間"},{"letter":"B","text":"與提供利益保單之間"},{"letter":"C","text":"與不提供彌償保單之間"},{"letter":"D","text":"與提供彌償保單之間"}],"answer":"D"},{"id":533,"chapter":"3","ref":"3.5.4","question":"在以下哪種情況中，普通法的分擔原則較不可能被保單條款所修改？","options":[{"letter":"A","text":"限制該保單只按特定的百分比計算支付的金額"},{"letter":"B","text":"取消對更具體受保物件的保障"},{"letter":"C","text":"除分擔的權利，並按損失的全數金額支付"},{"letter":"D","text":"如果其他保單提供彌償時保障會被取消"}],"answer":"D"},{"id":534,"chapter":"3","ref":"3.5.4","question":"為何分擔不適用於人壽保險？","options":[{"letter":"A","text":"因為人壽保險不受彌償所約束"},{"letter":"B","text":"因為它們不是保障導致損失的相同危險"},{"letter":"C","text":"因為所有保障都是由同一保險人提供"},{"letter":"D","text":"因為它們不是保障相同的標的"}],"answer":"A"},{"id":535,"chapter":"3","ref":"3.5.4","question":"分擔只能應用於：","options":[{"letter":"A","text":"人壽保險保單"},{"letter":"B","text":"提供彌償的保險保單"},{"letter":"C","text":"不提供彌償的保險保單"},{"letter":"D","text":"其中一方在賠償過程中須負上過錯"}],"answer":"B"},{"id":536,"chapter":"3","ref":"3.5.4","question":"如果發現保單持有人有 2 份保險提供財產上的保障(例如：盜竊)，以下哪情況是正確的？","options":[{"letter":"A","text":"保單持有人可以得到雙賠的賠償"},{"letter":"B","text":"因為可能涉及詐騙，2 份保單都不會作出賠償"},{"letter":"C","text":"第一份購買的保單會承擔所有的賠付"},{"letter":"D","text":"2 份保單會以共同分擔賠付"}],"answer":"D"},{"id":537,"chapter":"3","ref":"3.5.5","question":"一份有分擔成份的保單，保險人可以怎樣更改此分擔條款？","options":[{"letter":"A","text":"在保單中，加入免分擔條款"},{"letter":"B","text":"限制個別保險人在損失上的分擔比例 例如：某個百分比"},{"letter":"C","text":"讓保險人向其他保險人尋找分擔機會"},{"letter":"D","text":"以上各項都是"}],"answer":"D"},{"id":538,"chapter":"3","ref":"3.5.5(a)","question":"兩個保險人同時保障了已損失的玻璃，稱為「重覆保險」 ，其衡平法則稱之為:","options":[{"letter":"A","text":"分擔"},{"letter":"B","text":"可保權益"},{"letter":"C","text":"近因"},{"letter":"D","text":"彌償"}],"answer":"A"},{"id":539,"chapter":"3","ref":"3.5.5(a)","question":"非海上保單的分擔條件：","options":[{"letter":"A","text":"該保單不適用分擔"},{"letter":"B","text":"把保險人的法律責任限制於他在損失中的比率之數"},{"letter":"C","text":"如果涉及重覆保險，該保單便可使無效"},{"letter":"D","text":"該保單不可以尋求其他保單進行分擔"}],"answer":"B"},{"id":540,"chapter":"3","ref":"3.5.5(b)","question":"可能出現在家居保險中的「更具體地受保條款」, 屬於以下哪項例子？","options":[{"letter":"A","text":"保單保證"},{"letter":"B","text":"免分擔條款"},{"letter":"C","text":"分擔條件"},{"letter":"D","text":"隱含保單條件"}],"answer":"B"},{"id":541,"chapter":"3","ref":"3.5.5(c)","question":"一般商業火險單包含所謂的「海上條款」，其主要目的是：","options":[{"letter":"A","text":"豁免儲藏於碼頭附近倉庫的貨物"},{"letter":"B","text":"避免與已有足額保險的水險單進行分擔"},{"letter":"C","text":"令為保障相同保險標的的水險單無效"},{"letter":"D","text":"以上皆是"}],"answer":"B"},{"id":542,"chapter":"3","ref":"3.6.1","question":"以下哪種情況會在第三者一方的疏忽後，出現代位的權利？","options":[{"letter":"A","text":"被保險人的辭世（壽險保單）"},{"letter":"B","text":"被保險的建築物受損害（火險）"},{"letter":"C","text":"被保險人遭受嚴重傷害（人身意外保單）"},{"letter":"D","text":"上述所有情況"}],"answer":"B"},{"id":543,"chapter":"3","ref":"3.6.1","question":"容許保險人給付賠償後，為本身的利益承繼及使用被保險人向第三者索償權利，這是哪項保險原則？","options":[{"letter":"A","text":"分擔"},{"letter":"B","text":"代位"},{"letter":"C","text":"重覆保險"},{"letter":"D","text":"最高誠信"}],"answer":"B"},{"id":544,"chapter":"3","ref":"3.6.1","question":"第三者一方出現疏忽後，下列哪項情況不會產生代位？","options":[{"letter":"A","text":"被保險人辭世(壽險保單)"},{"letter":"B","text":"受保財產的損(火險保單)"},{"letter":"C","text":"受保汽車的摧毀(汽車保單)"},{"letter":"D","text":"上述所有各項例子"}],"answer":"A"},{"id":545,"chapter":"3","ref":"3.6.1","question":"一宗撞車意外因為第三者疏忽而引起，在此情況下，請問「代位」在下列哪一類保險適用？","options":[{"letter":"A","text":"人壽保險"},{"letter":"B","text":"意外保險"},{"letter":"C","text":"汽車保險"},{"letter":"D","text":"以上所有各項"}],"answer":"C"},{"id":546,"chapter":"3","ref":"3.6.1","question":"某些情況下通常因為第三者的疏忽(行為上)而造成的損失或毀壞，這原則稱為：","options":[{"letter":"A","text":"彌償"},{"letter":"B","text":"近因"},{"letter":"C","text":"代位"},{"letter":"D","text":"最高誠信"}],"answer":"C"},{"id":547,"chapter":"3","ref":"3.6.2","question":"一名提供僱員補償保險的保險人在一項條款下可向疏忽的第三者索償對受傷員工已支付的賠償，這顯示 以下哪項情況出現？","options":[{"letter":"A","text":"在損餘中出現代位權"},{"letter":"B","text":"在合約上出現代位權"},{"letter":"C","text":"在侵權法上出現代位權"},{"letter":"D","text":"在法規下出現代位權"}],"answer":"D"},{"id":548,"chapter":"3","ref":"3.6.2","question":"在香港經營僱員補償保險的保險人可依據一項條例，有權利向疏忽的第三者償還保險人已向受傷的工人所 作出的賠償，技術上稱為：","options":[{"letter":"A","text":"分擔"},{"letter":"B","text":"重覆彌償"},{"letter":"C","text":"侵權法上的代位權"},{"letter":"D","text":"法規下的代位權"}],"answer":"D"},{"id":549,"chapter":"3","ref":"3.6.2","question":"代位如何出現？ i 在侵權法上 ii 在合約上 iii 在法規下 iv 在損餘中","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"ii, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":550,"chapter":"3","ref":"3.6.2(a)","question":"代位的出現，大部份由於第三者疏忽地對受保財產造成損毀，並且該財產的保險人承繼向疏忽的人士 行使法律權利。技術上，這意味著代位來自:","options":[{"letter":"A","text":"侵權法"},{"letter":"B","text":"法規"},{"letter":"C","text":"分擔"},{"letter":"D","text":"因他人行為而須負上的責任"}],"answer":"A"},{"id":551,"chapter":"3","ref":"3.6.3","question":"如果一個人買了人身意外及私人汽車保險中的意外死亡利益，而其後在一次汽車意外中死亡：","options":[{"letter":"A","text":"每份保單均需作出賠償"},{"letter":"B","text":"僅僅首先生效的保單須要作出賠償"},{"letter":"C","text":"僅僅保額較高的保單須要作出賠償"},{"letter":"D","text":"既然是由於汽車意外而死，只有汽車保險須要作出賠償"}],"answer":"A"},{"id":552,"chapter":"3","ref":"3.6.3","question":"在下列哪個情況下，代位才能有效？","options":[{"letter":"A","text":"當分擔出現時"},{"letter":"B","text":"當執行彌償時"},{"letter":"C","text":"當比例分擔出現時"},{"letter":"D","text":"當違反最高誠信出現時"}],"answer":"B"},{"id":553,"chapter":"3","ref":"3.6.4","question":"雖然某份財產全損保單在損失發生的時候不存在保額不足的情況，但由於一項免賠額條文的應用，保險人 就該$6,000 的損失賠付了$5,000。如果保險人就代位的行動中追回了$1,000，請問誰人有權分享這筆款 項？而各人的分配又是多少？","options":[{"letter":"A","text":"保險人$1,000；被保險人$0"},{"letter":"B","text":"保險人$0；被保險人$1,000"},{"letter":"C","text":"保險人一半；被保險人一半"},{"letter":"D","text":"保險人六份之五；被保險人六份之一"}],"answer":"A"},{"id":554,"chapter":"3","ref":"3.6.4","question":"建築商就一意外向一架私家車擁有人支付$13,000,000。因為一項每宗責任事故限額的應用。該名私家車 司機只有權向其責任保險人取得保險金$12,000,000。如果保險人後來可向第三者追回$7,000,000，請問 誰有權取得這筆錢？又怎樣分這筆金額？","options":[{"letter":"A","text":"保險人佔$7,000,000，被保險人沒有份兒。"},{"letter":"B","text":"保險人沒有份兒，被保險人$7,000,000"},{"letter":"C","text":"保險人佔$6,000,000，被保險人$1,000,000"},{"letter":"D","text":"保險人佔十三分之十二，被保險人佔十三分之一"}],"answer":"C"},{"id":555,"chapter":"3","ref":"3.6.4","question":"法院命令一名受保的士司機向一架私家車擁有人支付$12,000,000。因為一項每宗責任事故限額的應用。 該名的士司機只有權向其責任保險人取得保險金$10,000,000。如果保險人後來可向就有關須百分之六十 承擔責任的另一名道路使用者追回$8,000,000，請問誰有權取得這筆錢？又怎樣分這筆金額？又怎樣分這 筆金額？","options":[{"letter":"A","text":"保險人佔$8,000,000，被保險人沒有份兒。"},{"letter":"B","text":"保險人沒有份兒，被保險人$8,000,000。"},{"letter":"C","text":"保險人佔$6,000,000，被保險人$2,000,000。"},{"letter":"D","text":"保險人佔百分之八十，被保險人佔百分之二十。"}],"answer":"C"},{"id":556,"chapter":"3","ref":"3.6.4","question":"法院命令一名受保巴士營運商向一架私家車擁有人支付$10,000,000。因為一項每宗責任事故限額的應 用。該名巴士營運商只有權向其責任保險人取得保險金$8,000,000。如果保險人後來可向就有關須百分之 五十承擔責任的另一名道路使用者追回$5,000,000，請問誰有權取得這筆錢？又怎樣分這筆金額？又怎樣 分這筆金額？","options":[{"letter":"A","text":"保險人佔$5,000,000，被保險人沒有份兒"},{"letter":"B","text":"保險人佔$3,000,000，被保險人$2,000,000"},{"letter":"C","text":"保險人沒有份兒，被保險人$5,000,000"},{"letter":"D","text":"保險人佔百分之八十，被保險人佔百分之二十"}],"answer":"B"},{"id":557,"chapter":"3","ref":"3.6.4(a)","question":"就保險而言，普通法規定當提供彌償後，可取得代位權。非海上保險保單條件：","options":[{"letter":"A","text":"從不可改變這項普通法的規定"},{"letter":"B","text":"在法律上不得更改這項普通法的規定"},{"letter":"C","text":"只當就索償給清達成協定後才給予代位權"},{"letter":"D","text":"通常即時給予保險人代位權以便馬上展開追償行動"}],"answer":"D"},{"id":558,"chapter":"3","ref":"3.6.4(a)","question":"在普通法中，只有在給予彌償之後才可取得代位權，而保單的條件通常：","options":[{"letter":"A","text":"說明要在理賠後才可取得代位權"},{"letter":"B","text":"說明保險人可即時取得代位權"},{"letter":"C","text":"說明任何時候不可取得代位權"},{"letter":"D","text":"說明只有被保人可擁有代位權"}],"answer":"B"},{"id":559,"chapter":"3","ref":"3.6.4(a)","question":"保單的條件通常說明，該保險人有權即時取得代位權，可以立刻開始執行補償程序的行動，但在普通法中：","options":[{"letter":"A","text":"不合法的"},{"letter":"B","text":"在給予彌償以後，才可獲取代位權"},{"letter":"C","text":"在比例分攤的條件下，才可執行"},{"letter":"D","text":"違反最高誠信"}],"answer":"B"},{"id":560,"chapter":"3","ref":"3.6.4(b)","question":"某項財產全險不存在著保額不足的情況。然而，因免賠額的原因，一項 7,000 元的受保損失獲得 6,000 元 的賠償，而保險人行使代位向第三者追討了 8,000 元，請問有誰可分享這筆款項？分配的比例又是怎樣？","options":[{"letter":"A","text":"保險人可得到 6,000 元，被保險人可得到 1,000 元"},{"letter":"B","text":"保險人可得到 6,000 元，被保險人可得到 2,000 元"},{"letter":"C","text":"保險人可得到 7,000 元，被保險人可得到 1,000 元"},{"letter":"D","text":"保險人可得到 7 份之 6，被保險人可得到 7 份之 1"}],"answer":"D"},{"id":561,"chapter":"3","ref":"3.6.4(b)","question":"在代位的補償上，如何處置因向第三者索取的多餘款項？","options":[{"letter":"A","text":"屬於被保險人"},{"letter":"B","text":"屬於保險人"},{"letter":"C","text":"運用比例分攤"},{"letter":"D","text":"由保險人及被保險人平均分享"}],"answer":"A"},{"id":562,"chapter":"3","ref":"3.6.4(b)","question":"在代位的補償上，以下哪項具體的考慮因素會出現？ i 保險人從代位安排下取得的補償， 不可多於彌償安排下的金額 ii 假如代位在委付財產予保險人後出現，保險人便可從此財產中取利 iii 對於每一元的付出，代位能給予的上限為 100 仙 iv 假如代位在委付財產予保險人後出現，對於每一元的付出，代位能給予多於 100 仙","options":[{"letter":"A","text":"i, ii, iii"},{"letter":"B","text":"i, ii, iv"},{"letter":"C","text":"i, iii, iv"},{"letter":"D","text":"i, ii, iii, iv"}],"answer":"D"},{"id":563,"chapter":"3","ref":"3.6.4(b)","question":"遺失了戒指一隻，保險人按照保單約定賠償了 5 萬，但該戒指於稍後時間尋回並以 6 萬元售出，對於該 (i) 1 萬元的額外收入，應屬於哪一方？","options":[{"letter":"A","text":"屬於保險人"},{"letter":"B","text":"屬於被保險人"},{"letter":"C","tex
